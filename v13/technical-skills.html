<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — Master Technical Skills Curriculum V1</title><meta name="description" content="VIOLIN AI — MASTER TECHNICAL SKILLS CURRICULUM V1"><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 40px #0002}select{padding:10px;border-radius:9px;border:1px solid #d9dee8;margin-right:8px}.student{border:1px solid #e3e7ee;border-radius:12px;padding:14px;margin:8px 0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #e3e7ee;border-radius:13px;padding:14px}.item{margin:4px 0}.muted{color:#687487}.pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700;margin-right:5px}</style></head><body><main class="wrap"><h1>VIOLIN AI — MASTER TECHNICAL SKILLS CURRICULUM V1</h1><p class="muted">Teacher-facing cumulative technical curriculum · Levels 1–9 · 18 Terms</p><div id="app"></div></main><script src="./technical-skills-curriculum-data.js"></script><script>(function(){var d=window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1,a=[];try{a=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}').students||[]}catch(e){}var app=document.getElementById('app');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function lv(s){var m=String(s.level??s.Level??s.currentLevel??s.grade??'').match(/\d+/);return m?+m[0]:null}function tm(s){var m=String(s.term??s.Term??s.currentTerm??s.quarter??1).match(/[12]/);return m?+m[0]:1}function arr(v){return Array.isArray(v)?v.map(function(x){return '<div class="item">• '+esc(x)+'</div>'}).join(''):v?'<div class="item">'+esc(v)+'</div>':''}function show(s){var l=lv(s),t=tm(s),c=d.levels[l]&&d.levels[l][t];if(!c){app.innerHTML='<p>No curriculum mapping found.</p>';return}app.innerHTML='<h2>'+esc(s.name||s.studentName||'Student')+' <span class="pill">Level '+l+'</span><span class="pill">Term '+t+'</span></h2><div class="grid">'+[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']].map(function(f){return c[f[0]]&&c[f[0]].length?'<section class="card"><h3>'+f[1]+'</h3>'+arr(c[f[0]])+'</section>':''}).join('')+'</div><section class="card"><h3>MASTER OUTCOME</h3><p>'+esc(c.outcome||'')+'</p></section><p class="muted"><b>Mastery:</b> 0 Not Introduced · 1 Introduced · 2 Developing · 3 Functional · 4 Secure · 5 Mastered · Needs Review · Not Yet Ready</p>'}if(!a.length){app.innerHTML='<p class="muted">No students found in Agenda storage.</p>'}else{app.innerHTML='<h2>Select student</h2>'+a.map(function(s,i){return '<div class="student" data-i="'+i+'"><b>'+esc(s.name||s.studentName||'Student')+'</b><br><span class="pill">Level '+(lv(s)||'—')+'</span><span class="pill">Term '+tm(s)+'</span></div>'}).join('');app.querySelectorAll('.student').forEach(function(x){x.onclick=function(){show(a[+x.dataset.i])}})}})();</script></body></html>
