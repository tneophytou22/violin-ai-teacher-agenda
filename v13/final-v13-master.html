<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — V13 MASTER</title>
<style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="../index.html?v=v13-master-base-7"></iframe>
<script src="./v13/core/state.js?v=1"></script>
<script src="./v13/core/navigation.js?v=1"></script>
<script src="./v13/core/curriculum-contract.js?v=1"></script>
<script src="./v13/curriculum/scales-data.js?v=4"></script>
<script src="./scale-curriculum-data.js?v=4"></script>
<script src="./v13/core/scales-adapter.js?v=6"></script>
<script src="./v13/ui/scales-ui.js?v=6"></script>
<script src="./v13/v13-curriculum-force-mount.js?v=1"></script>
<script>
(function(){
'use strict';
var frame=document.getElementById('app');
function text(x){return String(x==null?'':x).replace(/\s+/g,' ').trim()}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function readJSON(k,f){try{var x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}
function agenda(){var x=readJSON('VIOLIN_AI_AGENDA_V10',{});return Array.isArray(x.students)?x.students:[]}
function sid(s){return String(s&&(s.id??s.studentId??s.uid)??'')}
function studentFromUrl(){try{var q=new URL(frame.src,location.href).searchParams,id=q.get('studentId');if(!id)return null;return agenda().find(function(s){return sid(s)===String(id)})||null}catch(e){return null}}
function studentFromDoc(doc){try{var a=agenda(),body=text(doc.body&&doc.body.innerText);for(var i=0;i<a.length;i++){var n=text(a[i].name||a[i].studentName);if(n&&body.indexOf(n)>=0)return a[i]}var m=body.match(/Level\s+(\d+)/i);return m?{name:'Student',level:+m[1],term:1}:null}catch(e){return null}}
function level(s){return +(String(s&&(s.level??s.Level??s.currentLevel??s.grade)??1).match(/\d+/)||[1])[0]}
function term(s){return +(String(s&&(s.term??s.Term??s.currentTerm)??1).match(/\d+/)||[1])[0]}
function scaleCurriculum(lv,tm){var D=window.VIOLIN_SCALE_CURRICULUM_V1;if(!D)return null;return typeof D.getTerm==='function'?D.getTerm(lv,tm):(D.levels?.[lv]?.[tm]||D.terms?.[lv]?.[tm]||D[lv]?.[tm]||null)}
function scaleItems(lv,tm){try{var C=window.VIOLIN_AI_CURRICULUM;if(C&&C.scales&&typeof C.scales.list==='function'){var a=C.scales.list(lv,tm);if(a&&a.length)return a}}catch(e){}var c=scaleCurriculum(lv,tm),out=[];if(!c)return out;[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','One-String Scales']].forEach(function(f){var v=c[f[0]];(Array.isArray(v)?v:[v]).forEach(function(x){if(x)out.push({id:'scale-'+lv+'-'+tm+'-'+out.length,curriculum:'scales',category:f[1],title:String(x),level:lv,term:tm,requirements:{tempo:c.tempo,octaves:c.octaves,bowing:c.bowing,articulation:c.articulation,rhythmicGroups:c.rhythm,accents:c.accents,dynamics:c.dynamics,positions:c.positions},objective:c.objective,mastery:c.mastery,source:'scale-curriculum-data.js'})})});return out}
function selectedLesson(s){var id=sid(s),p=readJSON('VIOLIN_AI_LESSON_SELECTION_V1',null),q=readJSON('VIOLIN_AI_CURRENT_SELECTION_V1',null);function ok(x){return x&&x.studentId!=null&&id&&String(x.studentId)===id&&Array.isArray(x.items)&&x.items.length&&x.kind==='lesson'}if(ok(p))return p;if(ok(q))return q;return null}
function normalize(x,lv,tm){return{id:x.id||('scale-'+Math.random().toString(16).slice(2)),curriculum:'scales',category:x.category||x.cat||x.section||'Scales',title:x.title||x.name||x.text||'Selected scale',level:x.level??lv,term:x.term??tm,requirements:x.requirements||x.scaleData||x.scale||{},objective:x.objective,mastery:x.mastery,source:x.source||'curriculum'}}
function isLesson(doc){return /\/lesson\.html(?:\?|$)/i.test(String(frame.src||''))||[].slice.call(doc.querySelectorAll('h1,h2')).some(function(x){return /^🎓?\s*Lesson\s*[·—-]/i.test(text(x.textContent))})}
function isStudentScales(doc){return [].slice.call(doc.querySelectorAll('h1,h2')).some(function(x){return /^🎵?\s*SCALES\s*[·—-]/i.test(text(x.textContent))})}
function isPlannerScales(doc){var b=[].slice.call(doc.querySelectorAll('.tabs button')).find(function(x){return /SCALES\s*$/i.test(text(x.textContent))});if(!b)return false;var c=(b.className||'')+' '+(b.getAttribute('aria-current')||'')+' '+(b.getAttribute('aria-selected')||'');return /active|selected|current/i.test(c)}
function css(doc){if(doc.getElementById('v13mastercss'))return;var s=doc.createElement('style');s.id='v13mastercss';s.textContent='.v13-master-curriculum{margin:12px 0;padding:12px;border:1px solid #dfd4ff;border-radius:14px;background:#faf8ff;color:#24344c}.v13-master-curriculum h3{margin:0 0 3px;font-size:18px}.v13-master-sub{font-size:12px;color:#687487;margin-bottom:8px}.v13-master-cat{margin:7px 0 4px;padding:7px 9px;border:1px solid #e4e0ef;border-radius:9px;background:#fff;font-weight:900;font-size:13px}.v13-master-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.v13-master-item{display:flex;gap:7px;align-items:center;padding:7px 8px;border:1px solid #e6e8ee;border-radius:9px;background:#fff;min-height:34px}.v13-master-item input{width:17px;height:17px;min-width:17px;margin:0}.v13-master-item b{font-size:12px;line-height:1.15}.v13-master-meta{font-size:9px;color:#687487;margin-top:2px;line-height:1.15}.v13-master-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.v13-master-actions button{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.v13-master-actions .lesson{background:#24344c;color:#fff}.v13-master-actions .home{background:#64c6a3;color:#12372c}.v13-master-actions .clear{background:#eef1f5;color:#24344c}.v13-master-selected{padding:8px 10px;border:1px solid #ddd5f5;border-radius:10px;background:#fff;margin:5px 0}.v13-master-selected b{font-size:12px}.v13-master-selected small{display:block;color:#687487;font-size:10px;margin-top:2px}@media(max-width:900px){.v13-master-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.v13-master-grid{grid-template-columns:1fr}}';doc.head.appendChild(s)}
function host(doc){return doc.getElementById('v13mastercurriculum')}
function renderChooser(doc,s){css(doc);var lv=level(s),tm=term(s),items=scaleItems(lv,tm),h=host(doc);if(!items.length)return;if(!h){h=doc.createElement('section');h.id='v13mastercurriculum';h.className='v13-master-curriculum';var tabs=doc.querySelector('.tabs');if(tabs)tabs.parentElement.insertBefore(h,tabs.nextSibling);else(doc.querySelector('.wrap')||doc.body).appendChild(h)}var key='chooser|'+sid(s)+'|'+lv+'|'+tm;if(h.dataset.key===key)return;h.dataset.key=key;var groups={};items.forEach(function(x,i){(groups[x.category]||(groups[x.category]=[])).push({x:x,i:i})});var chosenLesson=selectedLesson(s),chosenIds={};if(chosenLesson)chosenLesson.items.forEach(function(x){chosenIds[x.id]=1;chosenIds[x.title]=1});var html='<h3>🎼 Curriculum Scales</h3><div class="v13-master-sub">Level '+lv+' · Term '+tm+' · Select what you want to hear today or assign for home practice.</div>';Object.keys(groups).forEach(function(cat){html+='<div class="v13-master-cat">'+esc(cat)+'</div><div class="v13-master-grid">';groups[cat].forEach(function(z){var x=z.x,checked=chosenIds[x.id]||chosenIds[x.title];html+='<label class="v13-master-item"><input type="checkbox" data-mi="'+z.i+'" '+(checked?'checked':'')+'><span><b>'+esc(x.title)+'</b><div class="v13-master-meta">'+esc((x.requirements&&x.requirements.octaves)||'')+(x.requirements&&x.requirements.tempo?' · '+esc(x.requirements.tempo):'')+'</div></span></label>'});html+='</div>'});html+='<div class="v13-master-actions"><button class="lesson" data-ma="lesson">🎓 Add to Lesson</button><button class="home" data-ma="home">🏠 Add to Homework</button><button class="clear" data-ma="clear">Clear</button></div>';h.innerHTML=html;function chosen(){return items.filter(function(x,i){var q=h.querySelector('[data-mi="'+i+'"]');return q&&q.checked}).map(function(x){return normalize(x,lv,tm)})}h.querySelector('[data-ma="clear"]').onclick=function(){h.querySelectorAll('input').forEach(function(q){q.checked=false})};h.querySelector('[data-ma="lesson"]').onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var p={studentId:s.id||s.studentId||null,studentName:s.name||s.studentName||'',level:lv,term:tm,kind:'lesson',curriculum:'scales',items:x,createdAt:new Date().toISOString()};localStorage.setItem('VIOLIN_AI_LESSON_SELECTION_V1',JSON.stringify(p));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(p));localStorage.removeItem('VIOLIN_AI_SELECTED_LESSON_V1');frame.src='./lesson.html?studentId='+encodeURIComponent(p.studentId||'')+'&v=v13-master-lesson-4'};h.querySelector('[data-ma="home"]').onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var p={studentId:s.id||s.studentId||null,studentName:s.name||s.studentName||'',level:lv,term:tm,kind:'homework',curriculum:'scales',items:x,createdAt:new Date().toISOString()};localStorage.setItem('VIOLIN_AI_HOMEWORK_SELECTION_V1',JSON.stringify(p));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(p));alert('Scales added to Homework.')}}
function renderLesson(doc,s){css(doc);var p=selectedLesson(s),h=host(doc);if(!p){if(h)h.remove();return}var items=p.items.map(function(x){return normalize(x,level(s),term(s))});var syncKey=String(p.createdAt||'')+'|'+items.map(function(x){return x.id+':'+x.title}).join('|');var stored=readJSON('VIOLIN_AI_SELECTED_LESSON_V1',null);if(!stored||String(stored.studentId)!==sid(s)||String(stored.createdAt||'')!==String(p.createdAt||'')){localStorage.setItem('VIOLIN_AI_SELECTED_LESSON_V1',JSON.stringify(p));if(doc.body.dataset.v13LessonSynced!==syncKey){doc.body.dataset.v13LessonSynced=syncKey;var regen=doc.getElementById('regenerate');if(regen)setTimeout(function(){regen.click()},30)}}if(!h){h=doc.createElement('section');h.id='v13mastercurriculum';h.className='v13-master-curriculum';var plan=doc.getElementById('plan'),pc=plan&&plan.parentElement;if(pc)pc.parentElement.insertBefore(h,pc.nextSibling);else(doc.querySelector('.wrap')||doc.body).appendChild(h)}var key='lesson|'+syncKey;if(h.dataset.key!==key){h.dataset.key=key;var html='<h3>🎼 Selected Scales</h3><div class="v13-master-sub">Only the scales selected by the teacher for this lesson.</div><div class="v13-master-grid">';items.forEach(function(x){var r=x.requirements||{};html+='<div class="v13-master-selected"><b>'+esc(x.title)+'</b><small>'+esc(x.category)+(r.octaves?' · '+esc(r.octaves):'')+(r.tempo?' · '+esc(r.tempo):'')+'</small></div>'});h.innerHTML=html+'</div>'}doc.querySelectorAll('.v13-lesson-scale-details').forEach(function(x){x.remove()});var plan=doc.getElementById('plan');if(plan){var rows=[].slice.call(plan.querySelectorAll('.selectrow'));var wanted={};items.forEach(function(x){wanted[x.title]=1});rows.forEach(function(row){var b=row.querySelector('b'),title=text(b&&b.textContent);if(title&&!wanted[title])row.style.display='none'})}}
function run(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var s=studentFromUrl()||studentFromDoc(doc);if(!s)return;if(isLesson(doc))renderLesson(doc,s);else if(isStudentScales(doc)||isPlannerScales(doc))renderChooser(doc,s);else{var h=host(doc);if(h)h.remove()}}catch(e){console.log('V13 MASTER FIX',e)}}
frame.addEventListener('load',function(){setTimeout(run,100);setTimeout(run,500);setTimeout(run,1200);setTimeout(run,2500)});setInterval(run,400);
})();
</script>
