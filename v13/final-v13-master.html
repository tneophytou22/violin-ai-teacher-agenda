<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — V13 MASTER</title>
<style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="../index.html?v=v13-master-base-5"></iframe>
<script src="./v13/core/state.js?v=1"></script>
<script src="./v13/core/navigation.js?v=1"></script>
<script src="./v13/core/curriculum-contract.js?v=1"></script>
<script src="./v13/curriculum/scales-data.js?v=2"></script>
<script src="./scale-curriculum-data.js?v=2"></script>
<script src="./v13/core/scales-adapter.js?v=4"></script>
<script src="./v13/ui/scales-ui.js?v=4"></script>
<script src="./v13-master-fixes.js?v=4"></script>
<script src="./v13-curriculum-level-ui.js?v=1"></script>
<script src="./v13-student-scale-isolation.js?v=2"></script>
<script src="./v13-scale-selection-fix.js?v=3"></script>
<script src="./v13-lesson-scale-requirements.js?v=1"></script>
<script src="./v13-scale-detail-display.js?v=2"></script>
<script>
(function(){
'use strict';
var frame=document.getElementById('app');
function text(x){return String(x==null?'':x).replace(/\s+/g,' ').trim()}
function agenda(){try{var x=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(x.students)?x.students:[]}catch(e){return[]}}
function studentFromDoc(doc){
 try{
  var a=agenda(),body=text(doc.body&&doc.body.innerText),heads=[].slice.call(doc.querySelectorAll('h1,h2')),head=heads.length?text(heads[0].textContent):'';
  for(var i=0;i<a.length;i++){var s=a[i],n=text(s.name||s.studentName);if(n&&(body.indexOf(n)>=0||head.indexOf(n)>=0))return s}
  var lm=body.match(/Level\s+(\d+)/i),tm=body.match(/Term\s+(\d+)/i);
  if(lm)return{name:(head.split(/[·—-]/)[1]||'Student').trim(),level:+lm[1],term:tm?+tm[1]:1};
 }catch(e){}
 return null;
}
function studentFromUrl(){try{var q=new URL(frame.src,location.href).searchParams,id=q.get('studentId');if(!id)return null;return agenda().find(function(s){return String(s.id??s.studentId??s.uid??'')===String(id)})||null}catch(e){return null}}
function level(s){return +(s&&(s.level??s.Level??s.currentLevel??s.grade)||1)}
function term(s){return +(s&&(s.term??s.Term??s.currentTerm)||1)}
function isLesson(doc){
 var path=String(frame.src||'').toLowerCase();
 if(/\/lesson\.html(?:\?|$)/.test(path))return true;
 return [].slice.call(doc.querySelectorAll('h1,h2')).some(function(x){return /^🎓?\s*Lesson\s*[·—-]/i.test(text(x.textContent))});
}
function isStudentScales(doc){return [].slice.call(doc.querySelectorAll('h1,h2')).some(function(x){return /^🎵?\s*SCALES\s*[·—-]/i.test(text(x.textContent))})}
function isPlannerScales(doc){var b=[].slice.call(doc.querySelectorAll('.tabs button')).find(function(x){return /SCALES\s*$/i.test(text(x.textContent))});if(!b)return false;var c=(b.className||'')+' '+(b.getAttribute('aria-current')||'')+' '+(b.getAttribute('aria-selected')||'')+' '+(b.getAttribute('data-active')||'');return /active|selected|current/i.test(c)}
function fallbackList(lv,tm){var D=window.VIOLIN_SCALE_CURRICULUM_V1;if(!D)return[];var c=typeof D.getTerm==='function'?D.getTerm(lv,tm):(D[lv]&&D[lv][tm]);if(!c)return[];var out=[];[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','One-String Scales']].forEach(function(f){var v=c[f[0]];(Array.isArray(v)?v:[v]).forEach(function(x){if(x)out.push({id:'scale-'+lv+'-'+tm+'-'+out.length,curriculum:'scales',category:f[1],title:String(x),level:lv,term:tm,requirements:{tempo:c.tempo,octaves:c.octaves,bowing:c.bowing,articulation:c.articulation,rhythmicGroups:c.rhythm,accents:c.accents,dynamics:c.dynamics,positions:c.positions},objective:c.objective,mastery:c.mastery,source:'scale-curriculum-data.js'})})});return out}
function getItems(lv,tm){try{var C=window.VIOLIN_AI_CURRICULUM;if(C&&C.scales&&typeof C.scales.list==='function'){var x=C.scales.list(lv,tm);if(x&&x.length)return x}}catch(e){}return fallbackList(lv,tm)}
function readJSON(key,fallback){try{var x=JSON.parse(localStorage.getItem(key)||'null');return x==null?fallback:x}catch(e){return fallback}}
function selectedForStudent(s){
 var sid=String(s.id||s.studentId||s.uid||'');
 var keys=['VIOLIN_AI_LESSON_SELECTION_V1','VIOLIN_AI_CURRENT_SELECTION_V1'];
 for(var i=0;i<keys.length;i++){
  var p=readJSON(keys[i],null);if(!p)continue;
  if(p.studentId!=null&&sid&&String(p.studentId)!==sid)continue;
  if(Array.isArray(p.items)&&p.items.length)return p.items;
 }
 return [];
}
function normalizeSelected(x){
 return {id:x.id||('scale-selected-'+Math.random().toString(16).slice(2)),curriculum:x.curriculum||'scales',category:x.category||x.cat||x.section||'Scales',title:x.title||x.name||x.text||'Selected scale',level:x.level,term:x.term,requirements:x.requirements||x.scaleData||x.scale||{},objective:x.objective,mastery:x.mastery,source:x.source||'curriculum'};
}
function css(doc){
 if(doc.getElementById('v13mastercurriculumcss'))return;
 var s=doc.createElement('style');s.id='v13mastercurriculumcss';
 s.textContent='.v13-master-curriculum{margin:12px 0;padding:12px;border:1px solid #dfd4ff;border-radius:14px;background:#faf8ff;color:#24344c}.v13-master-curriculum h3{margin:0 0 3px;font-size:18px}.v13-master-sub{font-size:12px;color:#687487;margin-bottom:8px}.v13-master-cat{margin:7px 0 4px;padding:7px 9px;border:1px solid #e4e0ef;border-radius:9px;background:#fff;font-weight:900;font-size:13px}.v13-master-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.v13-master-item{display:flex;gap:7px;align-items:center;padding:7px 8px;border:1px solid #e6e8ee;border-radius:9px;background:#fff;min-height:34px}.v13-master-item input{width:17px;height:17px;min-width:17px;margin:0}.v13-master-item b{font-size:12px;line-height:1.15}.v13-master-meta{font-size:9px;color:#687487;margin-top:2px;line-height:1.15}.v13-master-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.v13-master-actions button{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.v13-master-actions .lesson{background:#24344c;color:#fff}.v13-master-actions .home{background:#64c6a3;color:#12372c}.v13-master-actions .clear{background:#eef1f5;color:#24344c}.v13-master-selected{padding:8px 10px;border:1px solid #ddd5f5;border-radius:10px;background:#fff;margin:5px 0}.v13-master-selected b{font-size:12px}.v13-master-selected small{display:block;color:#687487;font-size:10px;margin-top:2px}@media(max-width:900px){.v13-master-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.v13-master-grid{grid-template-columns:1fr}.v13-master-item{padding:8px}}
';doc.head.appendChild(s)
}
function renderStudentOrPlanner(doc,s,mode){
 var lv=level(s),tm=term(s),items=getItems(lv,tm);if(!items.length)return false;css(doc);
 var host=doc.getElementById('v13mastercurriculum');if(!host){host=doc.createElement('section');host.id='v13mastercurriculum';host.className='v13-master-curriculum';var tabs=doc.querySelector('.tabs');if(mode==='student'){var add=[].slice.call(doc.querySelectorAll('button')).find(function(b){return /add\s+scales/i.test(text(b.textContent))});if(add&&add.parentElement)add.parentElement.parentElement.insertBefore(host,add.parentElement.nextSibling);else(doc.querySelector('.wrap')||doc.body).insertBefore(host,(doc.querySelector('.wrap')||doc.body).firstChild)}else if(tabs)tabs.parentElement.insertBefore(host,tabs.nextSibling)}
 var key=mode+'|'+lv+'|'+tm+'|'+String(s.id||s.studentId||'');if(host.dataset.key===key)return true;host.dataset.key=key;
 var groups={};items.forEach(function(x,i){(groups[x.category]||(groups[x.category]=[])).push({x:x,i:i})});var h='<h3>🎼 Curriculum Scales</h3><div class="v13-master-sub">Level '+lv+' · Term '+tm+' · Select what you want to hear today or assign for home practice.</div>';Object.keys(groups).forEach(function(cat){h+='<div class="v13-master-cat">'+esc(cat)+'</div><div class="v13-master-grid">';groups[cat].forEach(function(z){var r=z.x.requirements||{};h+='<label class="v13-master-item"><input type="checkbox" data-mi="'+z.i+'"><span><b>'+esc(z.x.title)+'</b><div class="v13-master-meta">'+(r.octaves?esc(r.octaves)+' · ':'')+(r.tempo?esc(r.tempo):'')+'</div></span></label>'});h+='</div>'});h+='<div class="v13-master-actions"><button class="lesson" data-ma="lesson">🎓 Add to Lesson</button><button class="home" data-ma="home">🏠 Add to Homework</button><button class="clear" data-ma="clear">Clear</button></div>';host.innerHTML=h;
 function chosen(){return items.filter(function(x,i){var q=host.querySelector('[data-mi="'+i+'"]');return q&&q.checked})}
 host.querySelector('[data-ma="clear"]').onclick=function(){host.querySelectorAll('input').forEach(function(q){q.checked=false})};
 host.querySelector('[data-ma="lesson"]').onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var p={studentId:s.id||s.studentId||null,studentName:s.name||s.studentName||'',level:lv,term:tm,kind:'lesson',curriculum:'scales',items:x.map(normalizeSelected),createdAt:new Date().toISOString()};localStorage.setItem('VIOLIN_AI_LESSON_SELECTION_V1',JSON.stringify(p));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(p));frame.src='./lesson.html?studentId='+encodeURIComponent(p.studentId||'')+'&v=v13-master-lesson-2'};
 host.querySelector('[data-ma="home"]').onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var p={studentId:s.id||s.studentId||null,studentName:s.name||s.studentName||'',level:lv,term:tm,kind:'homework',curriculum:'scales',items:x.map(normalizeSelected),createdAt:new Date().toISOString()};localStorage.setItem('VIOLIN_AI_HOMEWORK_SELECTION_V1',JSON.stringify(p));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(p));alert('Scales added to Homework.')};
 return true;
}
function renderLesson(doc,s){
 var host=doc.getElementById('v13mastercurriculum');
 var selected=selectedForStudent(s).map(normalizeSelected);
 if(!selected.length){if(host)host.remove();return true}
 css(doc);
 if(!host){host=doc.createElement('section');host.id='v13mastercurriculum';host.className='v13-master-curriculum';var plan=doc.getElementById('plan'),pc=plan&&plan.parentElement;if(pc)pc.parentElement.insertBefore(host,pc.nextSibling);else(doc.querySelector('.wrap')||doc.body).appendChild(host)}
 var key='lesson-selected|'+selected.map(function(x){return x.id+':'+x.title}).join('|');if(host.dataset.key===key)return true;host.dataset.key=key;
 var h='<h3>🎼 Selected Scales</h3><div class="v13-master-sub">Only the scales selected by the teacher for this lesson.</div><div class="v13-master-grid">';
 selected.forEach(function(x){var r=x.requirements||{};h+='<div class="v13-master-selected"><b>'+esc(x.title)+'</b><small>'+esc(x.category)+(r.octaves?' · '+esc(r.octaves):'')+(r.tempo?' · '+esc(r.tempo):'')+'</small></div>'});
 h+='</div>';host.innerHTML=h;return true;
}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function run(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var s=studentFromDoc(doc)||studentFromUrl();if(!s)return;if(isLesson(doc))renderLesson(doc,s);else if(isStudentScales(doc))renderStudentOrPlanner(doc,s,'student');else if(isPlannerScales(doc))renderStudentOrPlanner(doc,s,'planner');else{var h=doc.getElementById('v13mastercurriculum');if(h)h.remove()}}catch(e){console.log('V13 MASTER CURRICULUM',e)}}
frame.addEventListener('load',function(){setTimeout(run,150);setTimeout(run,700);setTimeout(run,1500);setTimeout(run,3000)});setInterval(run,500);
})();
</script>
</body>
</html>
