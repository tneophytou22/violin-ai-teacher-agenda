<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 MASTER</title><style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="../index.html?v=v13-master-architecture-1"></iframe>
<script src="./v13/core/state.js?v=1"></script><script src="./v13/core/navigation.js?v=1"></script><script src="./v13/core/curriculum-contract.js?v=2"></script><script src="./v13/curriculum/scales-data.js?v=5"></script><script src="./scale-curriculum-data.js?v=5"></script><script src="./v13/core/scales-adapter.js?v=7"></script><script src="./v13/core/curriculum-controller.js?v=1"></script><script src="./v13/ui/scales-ui.js?v=7"></script><script src="./v13/v13-curriculum-force-mount.js?v=2"></script>
<script>(function(){'use strict';var frame=document.getElementById('app');function read(k,f){try{var x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}function agenda(){var x=read('VIOLIN_AI_AGENDA_V10',{});return Array.isArray(x.students)?x.students:[]}function sid(s){return String(s&&(s.id??s.studentId??s.uid)??'')}function student(doc){var q;try{q=new URL(frame.src,location.href).searchParams.get('studentId')}catch(e){}var a=agenda();if(q){var z=a.find(function(s){return sid(s)===String(q)});if(z)return z}try{var body=(doc.body&&doc.body.innerText)||'';for(var i=0;i<a.length;i++){var n=String(a[i].name||a[i].studentName||'').trim();if(n&&body.indexOf(n)>=0)return a[i]}var m=body.match(/Level\s+(\d+)/i);if(m)return{name:'Student',level:+m[1],term:1}}catch(e){}return null}function isLesson(doc){return /\/lesson\.html(?:\?|$)/i.test(String(frame.src||''))}function isScales(doc){return [].slice.call(doc.querySelectorAll('h1,h2')).some(function(x){return /SCALES\s*[·•—-]/i.test((x.textContent||'').trim())})}function css(doc){if(doc.getElementById('v13archcss'))return;var s=doc.createElement('style');s.id='v13archcss';s.textContent='.v13-arch-selection{margin:12px 0;padding:12px;border:1px solid #dfd4ff;border-radius:14px;background:#faf8ff;color:#24344c}.v13-arch-selection h3{margin:0 0 3px;font-size:18px}.v13-arch-sub{font-size:12px;color:#687487;margin-bottom:8px}.v13-arch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.v13-arch-card{padding:8px 10px;border:1px solid #e2e5eb;border-radius:9px;background:#fff}.v13-arch-card b{font-size:12px}.v13-arch-card small{display:block;color:#687487;font-size:10px;margin-top:2px}@media(max-width:900px){.v13-arch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.v13-arch-grid{grid-template-columns:1fr}}';doc.head.appendChild(s)}function renderLesson(doc,s){var C=window.VIOLIN_AI_CURRICULUM&&window.VIOLIN_AI_CURRICULUM.controller;if(!C)return;var p=C.getSelection(sid(s),'lesson','scales');var h=doc.getElementById('v13archselection');if(!p){if(h)h.remove();return}css(doc);if(!h){h=doc.createElement('section');h.id='v13archselection';h.className='v13-arch-selection';var plan=doc.getElementById('plan'),pc=plan&&plan.parentElement;if(pc)pc.parentElement.insertBefore(h,pc.nextSibling);else(doc.querySelector('.wrap')||doc.body).appendChild(h)}var items=Array.isArray(p.items)?p.items:[];h.innerHTML='<h3>🎼 Selected Scales</h3><div class="v13-arch-sub">Only the curriculum items selected by the teacher.</div><div class="v13-arch-grid">'+items.map(function(x){var r=x.requirements||{};return '<div class="v13-arch-card"><b>'+esc(x.title)+'</b><small>'+esc(x.category||'Scales')+(r.octaves?' · '+esc(r.octaves):'')+(r.tempo?' · '+esc(r.tempo):'')+'</small></div>'}).join('')+'</div>';function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}}function run(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var s=student(doc);if(!s)return;if(isLesson(doc))renderLesson(doc,s);else{var h=doc.getElementById('v13archselection');if(h)h.remove()}}catch(e){console.log('V13 ARCH',e)}}frame.addEventListener('load',function(){setTimeout(run,150);setTimeout(run,700);setTimeout(run,1500)});setInterval(run,700)})();</script></body></html>
