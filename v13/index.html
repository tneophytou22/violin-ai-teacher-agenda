<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — V13</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.devbar{position:fixed;right:12px;top:12px;z-index:20;background:#14233d;color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;box-shadow:0 6px 20px #0003}.devbar button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.panel{display:none;position:fixed;z-index:30;right:12px;top:58px;width:min(620px,calc(100% - 24px));max-height:calc(100% - 72px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 15px 50px #0005;padding:16px}.panel.open{display:block}.student{display:block;width:100%;box-sizing:border-box;border:1px solid #e6e9ef;border-radius:12px;padding:11px;margin:8px 0;cursor:pointer;background:#fff;text-align:left;font:inherit}.student:hover{background:#f4f7fb}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:700;margin:4px}.section{border-top:1px solid #eee;padding:12px 0}.section strong{display:block;margin-bottom:5px}.close,.back{border:0;background:#eef1f5;border-radius:8px;padding:7px 10px;cursor:pointer}.close{float:right}.back{margin-bottom:10px}.empty{color:#687487;padding:12px 0}.item{margin:3px 0}.current{background:#f3f6fa;border-radius:12px;padding:12px;margin:10px 0 14px}.current h3{margin:0 0 5px}.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#687487}.note{font-size:12px;color:#687487;margin-top:4px}.switch{display:flex;gap:8px;margin:10px 0 14px}.switch button{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}.switch button.active{background:#eef1f5}.tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tech-card{border:1px solid #e3e7ee;border-radius:13px;padding:12px}.tech-card h4{margin:0 0 7px}.mastery{font-size:12px;color:#687487;margin-top:12px}.student-curriculum-card{margin:12px 0;padding:14px;border:1px solid #dfd4ff;border-radius:16px;background:linear-gradient(135deg,#f7f4ff,#fff);box-shadow:0 7px 24px #14233d0d}.student-curriculum-card h3{margin:0 0 4px}.student-curriculum-card .sub{font-size:12px;color:#687487;margin-bottom:10px}.sc-pick{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid #e7e2f4;border-radius:10px;background:#fff;margin:6px 0}.sc-pick input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}.sc-pick b{display:block}.sc-pick small{display:block;color:#687487}.sc-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.sc-actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.sc-lesson{background:#24344c;color:#fff}.sc-home{background:#64c6a3;color:#12372c}.sc-clear{background:#eef1f5}.sc-collapse{border:1px solid #e7e2f4;border-radius:12px;margin-top:10px;overflow:hidden;background:#faf9fd}.sc-collapse>button{width:100%;border:0;background:#fff;padding:11px 12px;text-align:left;font:inherit;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.sc-collapse-body{display:none;padding:4px 10px 10px}.sc-collapse.open .sc-collapse-body{display:block}.sc-chevron{font-size:12px;color:#687487}
</style>
<script src="./scale-curriculum-data.js"></script>
<script src="./technical-skills-curriculum-data.js"></script>
</head>
<body>
<iframe id="appFrame" src="../index.html" title="VIOLIN AI Teacher Agenda"></iframe>
<div class="devbar"><button id="open" type="button">Curriculum</button></div>
<div id="panel" class="panel" role="dialog" aria-modal="true"><button id="close" class="close" type="button">✕</button><h2 id="panelTitle">Curriculum</h2><p>Teacher-facing Level &amp; Term curriculum</p><div class="switch"><button id="scaleBtn" class="active" type="button">Scale &amp; Arpeggio</button><button id="techBtn" type="button">Technical Skills</button></div><div id="students"></div><div id="curriculum"></div></div>
<script>
(function(){'use strict';
var panel=document.getElementById('panel'),students=document.getElementById('students'),curr=document.getElementById('curriculum'),frame=document.getElementById('appFrame'),mode='scale';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}
function num(v){var m=String(v==null?'':v).match(/\d+/);return m?Number(m[0]):null}
function level(s){return num(s.level??s.Level??s.currentLevel??s.grade)}
function term(s){var v=s.term??s.Term??s.currentTerm??s.quarter??1,m=String(v).match(/[12]/);return m?Number(m[0]):1}
function name(s){return s.name||s.studentName||'Student'}
function text(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return '<div class="item">• '+text(x)+'</div>'}).join('');if(typeof v==='object')return Object.keys(v).map(function(k){return '<div class="item"><b>'+esc(k)+':</b> '+text(v[k])+'</div>').join('');return esc(v)}
function getScale(l,t){var x=window.VIOLIN_SCALE_CURRICULUM_V1;if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);return x.terms?.[l]?.[t]||x.levels?.[l]?.[t]||x[l]?.[t]||null}
function getTech(l,t){var x=window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return null;return x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||x[l]?.[t]||null}
function setMode(m){mode=m;scaleBtn.classList.toggle('active',m==='scale');techBtn.classList.toggle('active',m==='tech');document.getElementById('panelTitle').textContent=m==='scale'?'Scale & Arpeggio Curriculum':'Technical Skills Curriculum';renderStudents()}
function renderStudents(){curr.innerHTML='';students.style.display='block';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found in this browser storage.</div>';return}a.forEach(function(st,i){var b=document.createElement('button');b.type='button';b.className='student';b.dataset.index=i;b.innerHTML='<strong>'+esc(name(st))+'</strong><br><span class="pill">Level '+esc(level(st)||'—')+'</span><span class="pill">Term '+esc(term(st))+'</span>';students.appendChild(b)})}
function renderCurriculum(st){students.style.display='none';var l=level(st),t=term(st),c=mode==='scale'?getScale(l,t):getTech(l,t),h='<button class="back" type="button">← Back to students</button><div class="current"><div class="label">Current curriculum</div><h3>'+esc(name(st))+'</h3><span class="pill">Level '+esc(l||'—')+'</span><span class="pill">Term '+esc(t)+'</span><div class="note">'+(mode==='scale'?'What this student has to learn in the current Level and Term.':'Cumulative technical requirements for the current Level and Term.')+'</div></div>';
if(!c){curr.innerHTML=h+'<div class="empty">No curriculum mapping found.</div>';curr.querySelector('.back').onclick=renderStudents;return}
if(mode==='scale'){var fields=[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String'],['positions','Position Requirements'],['bowing','Bowing Patterns'],['articulation','Articulation'],['rhythm','Rhythmic Variations'],['patterns','Advanced Patterns'],['accents','Accent Patterns'],['dynamics','Dynamics'],['octaves','Number of Octaves'],['tempo','Target Tempo'],['objective','Technical Objective'],['mastery','Mastery Criteria']];if(c.name)h+='<div class="section"><strong>Term focus</strong>'+esc(c.name)+'</div>';fields.forEach(function(f){if(c[f[0]]!=null&&c[f[0]]!=='')h+='<div class="section"><strong>'+f[1]+'</strong>'+text(c[f[0]])+'</div>})}else{h+='<div class="tech-grid">';[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']].forEach(function(f){if(c[f[0]]&&c[f[0]].length)h+='<section class="tech-card"><h4>'+f[1]+'</h4>'+text(c[f[0]])+'</section>'});h+='</div><section class="section"><strong>MASTER OUTCOME</strong>'+esc(c.outcome||'')+'</section><div class="mastery"><b>Mastery:</b> 0 Not Introduced · 1 Introduced · 2 Developing · 3 Functional · 4 Secure · 5 Mastered · Needs Review · Not Yet Ready</div>'}
curr.innerHTML=h;curr.querySelector('.back').onclick=renderStudents}
scaleBtn.onclick=function(){setMode('scale')};techBtn.onclick=function(){setMode('tech')};document.getElementById('open').onclick=function(){panel.classList.add('open');setMode(mode)};document.getElementById('close').onclick=function(){panel.classList.remove('open')};students.addEventListener('click',function(e){var b=e.target.closest('.student');if(!b)return;var a=read(),st=a[Number(b.dataset.index)];if(st)renderCurriculum(st)});
function currentStudent(doc){var title=((doc.querySelector('h1')||{}).textContent||doc.title||'');var a=read();return a.find(function(s){var n=String(name(s)).trim().toLowerCase();return n&&title.toLowerCase().indexOf(n)>=0})||null}
function curriculumItems(st){var c=getScale(level(st),term(st)),out=[];if(!c)return out;[['major','Major Scale'],['minor','Minor Scale'],['arpeggios','Tonic Arpeggio'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scale'],['doubleStops','Double Stops'],['oneString','One-String Scale'],['positions','Positions'],['bowing','Bowing'],['articulation','Articulation'],['rhythm','Rhythm'],['patterns','Patterns'],['accents','Accents'],['dynamics','Dynamics'],['octaves','Octaves'],['tempo','Tempo'],['objective','Objective'],['mastery','Mastery']].forEach(function(f){var v=c[f[0]];if(v==null||v==='')return;(Array.isArray(v)?v:[v]).forEach(function(x){if(typeof x==='object')Object.keys(x).forEach(function(k){(Array.isArray(x[k])?x[k]:[x[k]]).forEach(function(q){if(q!=null&&q!=='')out.push({title:String(q),category:f[1]+' · '+k})})});else out.push({title:String(x),category:f[1]})})});var seen={};return out.filter(function(x){var k=x.category+'|'+x.title;if(seen[k])return false;seen[k]=1;return true})}
function technicalItems(st){var c=getTech(level(st),term(st)),out=[];if(!c)return out;[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']].forEach(function(f){var v=c[f[0]];if(Array.isArray(v))v.forEach(function(x){out.push({title:String(x),category:f[1]})})});return out}
function storageKey(kind){return kind==='lesson'?'VIOLIN_AI_LESSON_SELECTION_V1':'VIOLIN_AI_HOMEWORK_SELECTION_V1'}
function saveMerged(st,chosen,kind){var key=storageKey(kind),old={};try{old=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}var oldItems=Array.isArray(old.items)?old.items:[],map={};oldItems.forEach(function(x){map[x.title+'|'+x.category]=x});chosen.forEach(function(x){map[x.title+'|'+x.category]={title:x.title,category:x.category}});var payload={studentId:st.id??st.studentId??null,studentName:name(st),level:level(st),term:term(st),kind:kind,createdAt:new Date().toISOString(),items:Object.keys(map).map(function(k){return map[k]})};localStorage.setItem(key,JSON.stringify(payload));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(payload));return payload}
function injectStudentCurriculum(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var st=currentStudent(doc);if(!st)return;var buttons=[].slice.call(doc.querySelectorAll('button'));var tab=buttons.find(function(b){return mode==='scale'?/^\s*(🎼|🎵|🎶)?\s*SCALES\s*$/i.test((b.textContent||'').trim()):/\bTECHNIQUE\b/i.test(b.textContent||'')});if(!tab)return;var old=doc.getElementById('violin-v13-student-curriculum');if(old)old.remove();var items=mode==='scale'?curriculumItems(st):technicalItems(st),card=doc.createElement('section');card.id='violin-v13-student-curriculum';card.className='student-curriculum-card';var html='<h3>'+(mode==='scale'?'🎼 Today’s Curriculum Scales':'🧩 Today’s Technical Curriculum')+'</h3><div class="sub">Level '+esc(level(st))+' · Term '+esc(term(st))+' · Select what you want to hear today or assign for home practice.</div>';if(!items.length)html+='<div class="empty">No curriculum mapping found.</div>';else{var body='';items.forEach(function(x,i){body+='<label class="sc-pick"><input type="checkbox" data-ci="'+i+'"><span><b>'+esc(x.title)+'</b><small>'+esc(x.category)+'</small></span></label>'});body+='<div class="sc-actions"><button type="button" class="sc-lesson" id="v13Lesson">🎓 Add to Lesson</button><button type="button" class="sc-home" id="v13Home">🏠 Add to Homework</button><button type="button" class="sc-clear" id="v13Clear">Clear</button></div>';html+='<div class="sc-collapse"><button type="button" id="v13Toggle"><span>Curriculum requirements</span><span class="sc-chevron">▶</span></button><div class="sc-collapse-body">'+body+'</div></div>'}card.innerHTML=html;tab.parentElement&&tab.parentElement.insertAdjacentElement('afterend',card);var toggle=card.querySelector('#v13Toggle');if(toggle)toggle.onclick=function(){var box=card.querySelector('.sc-collapse'),ch=card.querySelector('.sc-chevron');box.classList.toggle('open');ch.textContent=box.classList.contains('open')?'▼':'▶'};function chosen(){return items.filter(function(x,i){var e=card.querySelector('[data-ci="'+i+'"]');return e&&e.checked})}var lesson=card.querySelector('#v13Lesson'),home=card.querySelector('#v13Home'),clear=card.querySelector('#v13Clear');if(lesson)lesson.onclick=function(){var x=chosen();if(!x.length){alert('Select at least one item for today’s lesson.');return}var p=saveMerged(st,x,'lesson');frame.src='lesson.html?studentId='+encodeURIComponent(p.studentId||'')+'&student='+encodeURIComponent(read().indexOf(st))};if(home)home.onclick=function(){var x=chosen();if(!x.length){alert('Select at least one item for homework.');return}saveMerged(st,x,'homework');var hb=[].slice.call(doc.querySelectorAll('button')).find(function(b){return /\bHOMEWORK\b/i.test(b.textContent||'')});if(hb)hb.click();else alert(x.length+' item(s) added to Homework.')};if(clear)clear.onclick=function(){card.querySelectorAll('input[type=checkbox]').forEach(function(e){e.checked=false})}}catch(e){console.warn('V13 curriculum integration',e)}}
function observe(){try{var doc=frame.contentDocument;if(!doc)return;new MutationObserver(function(){clearTimeout(window.__v13);window.__v13=setTimeout(injectStudentCurriculum,180)}).observe(doc.body,{childList:true,subtree:true});injectStudentCurriculum()}catch(e){}}
frame.addEventListener('load',observe);setTimeout(observe,500);setMode('scale');
})();
</script>
</body>
</html>
