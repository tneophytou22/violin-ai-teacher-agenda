<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}#agenda{position:absolute;inset:0;border:0;width:100%;height:100%}#scaleBar{position:fixed;right:18px;top:18px;z-index:9999;background:#14233d;color:#fff;border-radius:14px;padding:10px;box-shadow:0 8px 30px #0004;display:flex;gap:8px;align-items:center}#scaleBar button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e6c25f;color:#473b15}#scalePanel{position:fixed;inset:7% 5%;z-index:10000;background:#fff;border-radius:20px;box-shadow:0 20px 70px #0006;display:none;overflow:auto;padding:22px}#scalePanel.open{display:block}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:9px;padding:8px 12px;cursor:pointer}.meta{color:#657083;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #e4e7ed;border-radius:13px;padding:13px}.card h3{margin:0 0 7px}.muted{color:#788394}.student{display:flex;align-items:center;justify-content:space-between;border:1px solid #e4e7ed;border-radius:12px;padding:10px;margin:7px 0;cursor:pointer}.student:hover{background:#f5f7fb}.badge{font-size:11px;font-weight:800;background:#eef1f5;border-radius:99px;padding:5px 8px}.section{margin-top:18px}.empty{padding:25px;text-align:center;color:#788394}</style></head><body><iframe id="agenda" src="../index.html"></iframe><div id="scaleBar"><span>🎻 Scale &amp; Arpeggio Curriculum</span><button id="openScale">Open</button></div><div id="scalePanel"><div class="head"><div><h2>Scale &amp; Arpeggio Curriculum</h2><div class="meta" id="meta">Select a student</div></div><button class="close" id="closeScale">Close</button></div><div id="students"></div><div id="curriculum"></div></div><script>(function(){'use strict';const KEY='VIOLIN_AI_AGENDA_V10';const curriculum=window.ViolinScaleCurriculumV1||null;const panel=document.getElementById('scalePanel'),studentsEl=document.getElementById('students'),currEl=document.getElementById('curriculum'),meta=document.getElementById('meta');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}').students||[]}catch(e){return[]}}function level(s){let m=String(s.level??s.Level??s.grade??'').match(/\d+/);return m?Number(m[0]):null}function term(s){let m=String(s.term??s.Term??s.currentTerm??'1').match(/[12]/);return m?Number(m[0]):1}function getCurr(l,t){let root=window.ViolinScaleCurriculumV1;if(root){if(root.levels&&root.levels[l]&&root.levels[l].terms)return root.levels[l].terms[t]||null;if(root[l]&&root[l][t])return root[l][t]}return null}function showStudent(s){let l=level(s),t=term(s),c=getCurr(l,t);meta.textContent=esc(s.name||s.studentName||'Student')+' · Level '+(l||'—')+' · Term '+t;studentsEl.style.display='none';if(!c){currEl.innerHTML='<div class="empty">Curriculum not available for this Level / Term.</div>';return}let html='';Object.keys(c).forEach(k=>{let v=c[k];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;html+='<div class="card"><h3>'+esc(k)+'</h3><div>'+esc(Array.isArray(v)?v.join(', '):v)+'</div></div>'});currEl.innerHTML='<div class="grid">'+html+'</div>'}function open(){panel.classList.add('open');currEl.innerHTML='';studentsEl.style.display='block';let ss=read();if(!ss.length){studentsEl.innerHTML='<div class="empty">No students found.</div>';return}studentsEl.innerHTML=ss.map((s,i)=>'<div class="student" data-i="'+i+'"><span>'+esc(s.name||s.studentName||'Student')+'</span><span class="badge">Level '+esc(level(s)||'—')+' · Term '+esc(term(s))+'</span></div>').join('');studentsEl.querySelectorAll('.student').forEach(el=>el.onclick=function(){showStudent(ss[Number(el.dataset.i)])})}document.getElementById('openScale').onclick=open;document.getElementById('closeScale').onclick=function(){panel.classList.remove('open')};})();</script></body></html>
