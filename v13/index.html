<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 Development</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.devbar{position:fixed;right:12px;top:12px;z-index:20;background:#14233d;color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;box-shadow:0 6px 20px #0003}.devbar button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.panel{display:none;position:fixed;z-index:30;right:12px;top:58px;width:min(620px,calc(100% - 24px));max-height:calc(100% - 72px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 15px 50px #0005;padding:16px}.panel.open{display:block}.student{display:block;width:100%;box-sizing:border-box;border:1px solid #e6e9ef;border-radius:12px;padding:11px;margin:8px 0;cursor:pointer;background:#fff;text-align:left;font:inherit}.student:hover,.student:focus{background:#f4f7fb;outline:2px solid #d8dfeb}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:700;margin:4px 4px 0 0}.section{border-top:1px solid #eee;padding:12px 0}.section strong{display:block;margin-bottom:5px}.close,.back{border:0;background:#eef1f5;border-radius:8px;padding:7px 10px;cursor:pointer}.close{float:right}.back{margin-bottom:10px}.empty{color:#687487;padding:12px 0}.item{margin:3px 0}.current{background:#f3f6fa;border-radius:12px;padding:12px;margin:10px 0 14px}.current h3{margin:0 0 5px}.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#687487}.note{font-size:12px;color:#687487;margin-top:4px}.sub{margin-top:6px}</style></head><body><iframe src="../index.html" title="VIOLIN AI Teacher Agenda"></iframe><div class="devbar"><button id="open" type="button">Scale Curriculum</button></div><div id="panel" class="panel" role="dialog" aria-modal="true"><button id="close" class="close" type="button">✕</button><h2>Scale &amp; Arpeggio Curriculum</h2><p>Teacher-facing Level &amp; Term curriculum</p><div id="students"></div><div id="curriculum"></div></div><script src="https://raw.githubusercontent.com/tneophytou22/violin-ai-teacher-agenda/ai-v13-development/curriculum/scale-arpeggio-v1.js"></script><script>(function(){'use strict';var panel=document.getElementById('panel'),students=document.getElementById('students'),curr=document.getElementById('curriculum');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}function n(v){var m=String(v==null?'':v).match(/\d+/);return m?Number(m[0]):null}function getLevel(s){return n(s.level??s.Level??s.currentLevel??s.grade)}function getTerm(s){var v=s.term??s.Term??s.currentTerm??s.quarter??1,m=String(v).match(/[12]/);return m?Number(m[0]):1}function text(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return '<div class="item">• '+text(x)+'</div>'}).join('');if(typeof v==='object')return Object.keys(v).map(function(k){return '<div class="item"><b>'+esc(k)+':</b> '+text(v[k])+'</div>'}).join('');return esc(v)}function getCurriculum(l,t){var x=window.VIOLIN_SCALE_CURRICULUM_V1;if(!x)return null;return typeof x.getTerm==='function'?x.getTerm(l,t):(x.terms&&x.terms[l]&&x.terms[l][t]||null)}function renderStudents(){curr.innerHTML='';students.style.display='block';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found in this browser storage.</div>';return}a.forEach(function(st,i){var b=document.createElement('button');b.type='button';b.className='student';b.dataset.index=String(i);b.innerHTML='<strong>'+esc(st.name||st.studentName||('Student '+(i+1)))+'</strong><br><span class="pill">Level '+esc(getLevel(st)||'—')+'</span><span class="pill">Term '+esc(getTerm(st))+'</span>';students.appendChild(b)})}function renderStudent(st){var l=getLevel(st),t=getTerm(st),c=getCurriculum(l,t);students.style.display='none';if(!c){curr.innerHTML='<button class="back" type="button">← Back to students</button><div class="empty">No curriculum mapping found for Level '+esc(l||'—')+' / Term '+esc(t)+'.</div>';curr.querySelector('.back').onclick=renderStudents;return}var name=st.name||st.studentName||'Student';var title=c.name||('Level '+l+' — Term '+t);var h='<button class="back" type="button">← Back to students</button><div class="current"><div class="label">Current curriculum</div><h3>'+esc(name)+'</h3><div class="pill">Level '+esc(l)+'</div><div class="pill">Term '+esc(t)+'</div><div class="note">What this student has to learn in the current Level and Term.</div></div>';var fields=[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String'],['positions','Position Requirements'],['bowing','Bowing Patterns'],['articulation','Articulation'],['rhythm','Rhythmic Variations'],['patterns','Advanced Patterns'],['accents','Accent Patterns'],['dynamics','Dynamics'],['octaves','Number of Octaves'],['tempo','Target Tempo'],['objective','Technical Objective'],['mastery','Mastery Criteria']];if(title)h+='<div class="section"><strong>Term focus</strong>'+esc(title)+'</div>';fields.forEach(function(f){if(c[f[0]]!==undefined&&c[f[0]]!==null&&c[f[0]]!=='')h+='<div class="section"><strong>'+f[1]+'</strong>'+text(c[f[0]])+'</div>'});curr.innerHTML=h;curr.querySelector('.back').onclick=renderStudents}document.getElementById('open').onclick=function(){panel.classList.add('open');renderStudents()};document.getElementById('close').onclick=function(){panel.classList.remove('open')};students.addEventListener('click',function(e){var b=e.target.closest('.student');if(!b)return;var a=read(),i=Number(b.dataset.index);if(a[i])renderStudent(a[i])})})();</script></body></html>
