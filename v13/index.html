<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}#agenda{position:absolute;inset:0;border:0;width:100%;height:100%}#scaleBar{position:fixed;right:18px;top:18px;z-index:9999;background:#14233d;color:#fff;border-radius:14px;padding:10px;box-shadow:0 8px 30px #0004;display:flex;gap:8px;align-items:center}#scaleBar button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e6c25f;color:#473b15}#scalePanel{position:fixed;inset:7% 5%;z-index:10000;background:#fff;border-radius:20px;box-shadow:0 20px 70px #0006;display:none;overflow:auto;padding:22px}.open{display:block!important}.head{display:flex;justify-content:space-between;align-items:center}.close,.back{border:0;border-radius:9px;padding:8px 12px;cursor:pointer}.meta{color:#657083;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #e4e7ed;border-radius:13px;padding:13px}.card h3{margin:0 0 7px}.student{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;border:1px solid #e4e7ed;border-radius:12px;padding:12px;margin:7px 0;cursor:pointer;background:#fff;font:inherit;text-align:left}.student:hover,.student:focus{background:#f5f7fb;outline:2px solid #d9dee8}.badge{font-size:11px;font-weight:800;background:#eef1f5;border-radius:99px;padding:5px 8px}.empty{padding:25px;text-align:center;color:#788394}.back{background:#eef1f5;margin-bottom:14px}</style></head><body><iframe id="agenda" src="../index.html"></iframe><div id="scaleBar"><span>🎻 Scale &amp; Arpeggio Curriculum</span><button id="openScale" type="button">Open</button></div><div id="scalePanel" role="dialog" aria-modal="true"><div class="head"><div><h2>Scale &amp; Arpeggio Curriculum</h2><div class="meta" id="meta">Select a student</div></div><button class="close" id="closeScale" type="button">Close</button></div><div id="students"></div><div id="curriculum"></div></div><script>(function(){'use strict';const KEY='VIOLIN_AI_AGENDA_V10',panel=document.getElementById('scalePanel'),studentsEl=document.getElementById('students'),currEl=document.getElementById('curriculum'),meta=document.getElementById('meta');function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function read(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}function level(s){const m=String(s.level??s.Level??s.grade??'').match(/\d+/);return m?Number(m[0]):null}function term(s){const m=String(s.term??s.Term??s.currentTerm??'1').match(/[12]/);return m?Number(m[0]):1}function curriculumFor(l,t){const data={1:{1:{'Major Scales':['G major — 1 octave','D major — 1 octave','A major — 1 octave'],'Arpeggios':['G, D, A major'],'Bowing':['Separate bows','1 note/bow','2 notes/bow'],'Articulation':['Détaché'],'Target tempo':'♩=50–60','Technical objective':'Clean intonation, finger placement, straight bow'},2:{'Major Scales':['C major','D major','A major','G major'],'Minor Scales':['E minor — introduction'],'Arpeggios':['C, D, G, A major','E minor'],'Bowing':['1, 2, 4 notes/bow'],'Articulation':['Détaché','Legato','2+2'],'Target tempo':'♩=60–70','Technical objective':'Bow distribution'}},2:{1:{'Major Scales':['G','D','A','C','F'],'Minor Scales':['E natural','A natural'],'Arpeggios':['Major/minor tonic triads'],'Bowing':['1','2','4 notes/bow'],'Articulation':['Détaché','Legato'],'Target tempo':'♩=70–80'},2:{'Minor Scales':['E harmonic','A harmonic','D harmonic','Melodic minor introduction'],'Chromatic Scales':['1 octave'],'Bowing':['2+2','4+4','8 notes/bow'],'Articulation':['Light martelé','Hooked bow introduction'],'Target tempo':'♩=75–85'}}};return data[l]&&data[l][t]?data[l][t]:null}function showStudent(s){const l=level(s),t=term(s),c=curriculumFor(l,t);meta.textContent=esc(s.name||s.studentName||'Student')+' · Level '+(l||'—')+' · Term '+t;studentsEl.style.display='none';if(!c){currEl.innerHTML='<button class="back" type="button" id="backStudents">← Back to students</button><div class="empty">Curriculum not available for this Level / Term yet.</div>';document.getElementById('backStudents').onclick=renderStudents;return}let h='<button class="back" type="button" id="backStudents">← Back to students</button><div class="grid">';Object.keys(c).forEach(k=>{const v=c[k];h+='<div class="card"><h3>'+esc(k)+'</h3><div>'+esc(Array.isArray(v)?v.join(', '):v)+'</div></div>'});currEl.innerHTML=h+'</div>';document.getElementById('backStudents').onclick=renderStudents}function renderStudents(){currEl.innerHTML='';studentsEl.style.display='block';const ss=read();studentsEl.innerHTML='';if(!ss.length){studentsEl.innerHTML='<div class="empty">No students found.</div>';return}ss.forEach(function(s,i){const b=document.createElement('button');b.type='button';b.className='student';b.innerHTML='<span>'+esc(s.name||s.studentName||'Student')+'</span><span class="badge">Level '+esc(level(s)||'—')+' · Term '+esc(term(s))+'</span>';b.onclick=function(){showStudent(ss[i])};studentsEl.appendChild(b)})}function open(){panel.classList.add('open');meta.textContent='Select a student';renderStudents()}document.getElementById('openScale').onclick=open;document.getElementById('closeScale').onclick=function(){panel.classList.remove('open')};})();</script><script src="../js/v13-full-scale-curriculum.js"></script><script src="../js/v13-scale-ui-v2.js"></script></body></html>
