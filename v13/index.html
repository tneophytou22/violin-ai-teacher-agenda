<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 Development</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.devbar{position:fixed;right:12px;top:12px;z-index:20;background:#14233d;color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;box-shadow:0 6px 20px #0003}.devbar button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.panel{display:none;position:fixed;z-index:30;right:12px;top:58px;width:min(620px,calc(100% - 24px));max-height:calc(100% - 72px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 15px 50px #0005;padding:16px}.panel.open{display:block}.student{display:block;width:100%;box-sizing:border-box;border:1px solid #e6e9ef;border-radius:12px;padding:11px;margin:8px 0;cursor:pointer;background:#fff;text-align:left;font:inherit}.student:hover,.student:focus{background:#f4f7fb;outline:2px solid #d8dfeb}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:700;margin:4px 4px 0 0}.section{border-top:1px solid #eee;padding:12px 0}.section strong{display:block;margin-bottom:5px}.close,.back{border:0;background:#eef1f5;border-radius:8px;padding:7px 10px;cursor:pointer}.close{float:right}.back{margin-bottom:10px}.empty{color:#687487;padding:12px 0}.item{margin:3px 0}.current{background:#f3f6fa;border-radius:12px;padding:12px;margin:10px 0 14px}.current h3{margin:0 0 5px}.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#687487}.note{font-size:12px;color:#687487;margin-top:4px}.curriculum-switch{display:flex;gap:8px;margin:10px 0 14px}.curriculum-switch button{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}.curriculum-switch button.active{background:#eef1f5}.tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tech-card{border:1px solid #e3e7ee;border-radius:13px;padding:12px}.tech-card h4{margin:0 0 7px}.mastery{font-size:12px;color:#687487;margin-top:12px}.student-curriculum-card{margin:12px 0;padding:14px;border:1px solid #dfd4ff;border-radius:16px;background:linear-gradient(135deg,#f7f4ff,#fff);box-shadow:0 7px 24px #14233d0d}.student-curriculum-card h3{margin:0 0 4px}.student-curriculum-card .sub{font-size:12px;color:#687487;margin-bottom:10px}.sc-pick{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid #e7e2f4;border-radius:10px;background:#fff;margin:6px 0}.sc-pick input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}.sc-pick b{display:block}.sc-pick small{display:block;color:#687487}.sc-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.sc-actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.sc-lesson{background:#24344c;color:#fff}.sc-home{background:#64c6a3;color:#12372c}.sc-clear{background:#eef1f5;color:#24344c}</style></head><body><iframe id="appFrame" src="../index.html" title="VIOLIN AI Teacher Agenda"></iframe><div class="devbar"><button id="open" type="button">Curriculum</button></div><div id="panel" class="panel" role="dialog" aria-modal="true"><button id="close" class="close" type="button">✕</button><h2 id="panelTitle">Curriculum</h2><p>Teacher-facing Level &amp; Term curriculum</p><div class="curriculum-switch"><button id="scaleBtn" class="active" type="button">Scale &amp; Arpeggio</button><button id="techBtn" type="button">Technical Skills</button></div><div id="students"></div><div id="curriculum"></div></div><script src="./scale-curriculum-data.js"></script><script src="./technical-skills-curriculum-data.js"></script><script>(function(){'use strict';var panel=document.getElementById('panel'),students=document.getElementById('students'),curr=document.getElementById('curriculum'),scaleBtn=document.getElementById('scaleBtn'),techBtn=document.getElementById('techBtn'),frame=document.getElementById('appFrame'),mode='scale';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}function n(v){var m=String(v==null?'':v).match(/\d+/);return m?Number(m[0]):null}function getLevel(s){return n(s.level??s.Level??s.currentLevel??s.grade)}function getTerm(s){var v=s.term??s.Term??s.currentTerm??s.quarter??1,m=String(v).match(/[12]/);return m?Number(m[0]):1}function text(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return '<div class="item">• '+text(x)+'</div>'}).join('');if(typeof v==='object')return Object.keys(v).map(function(k){return '<div class="item"><b>'+esc(k)+':</b> '+text(v[k])+'</div>'}).join('');return esc(v)}function getScale(l,t){var x=window.VIOLIN_SCALE_CURRICULUM_V1;if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);if(x.terms&&x.terms[l]&&x.terms[l][t])return x.terms[l][t];if(x[l]&&x[l][t])return x[l][t];return null}function getTech(l,t){var x=window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return null;if(x.levels&&x.levels[l]&&x.levels[l][t])return x.levels[l][t];return null}function setMode(m){mode=m;scaleBtn.classList.toggle('active',m==='scale');techBtn.classList.toggle('active',m==='tech');document.getElementById('panelTitle').textContent=m==='scale'?'Scale & Arpeggio Curriculum':'Technical Skills Curriculum';renderStudents()}function renderStudents(){curr.innerHTML='';students.style.display='block';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found in this browser storage.</div>';return}a.forEach(function(st,i){var b=document.createElement('button');b.type='button';b.className='student';b.dataset.index=String(i);b.innerHTML='<strong>'+esc(st.name||st.studentName||('Student '+(i+1)))+'</strong><br><span class="pill">Level '+esc(getLevel(st)||'—')+'</span><span class="pill">Term '+esc(getTerm(st))+'</span>';students.appendChild(b)})}function renderScale(st){var l=getLevel(st),t=getTerm(st),c=getScale(l,t);students.style.display='none';if(!c){curr.innerHTML='<button class="back" type="button">← Back to students</button><div class="empty">No curriculum mapping found for Level '+esc(l||'—')+' / Term '+esc(t)+'.</div>';curr.querySelector('.back').onclick=renderStudents;return}var name=st.name||st.studentName||'Student';var h='<button class="back" type="button">← Back to students</button><div class="current"><div class="label">Current curriculum</div><h3>'+esc(name)+'</h3><div class="pill">Level '+esc(l)+'</div><div class="pill">Term '+esc(t)+'</div><div class="note">What this student has to learn in the current Level and Term.</div></div>';var fields=[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String'],['positions','Position Requirements'],['bowing','Bowing Patterns'],['articulation','Articulation'],['rhythm','Rhythmic Variations'],['patterns','Advanced Patterns'],['accents','Accent Patterns'],['dynamics','Dynamics'],['octaves','Number of Octaves'],['tempo','Target Tempo'],['objective','Technical Objective'],['mastery','Mastery Criteria']];if(c.name)h+='<div class="section"><strong>Term focus</strong>'+esc(c.name)+'</div>';fields.forEach(function(f){if(c[f[0]]!==undefined&&c[f[0]]!==null&&c[f[0]]!=='')h+='<div class="section"><strong>'+f[1]+'</strong>'+text(c[f[0]])+'</div>'});curr.innerHTML=h;curr.querySelector('.back').onclick=renderStudents}function renderTech(st){var l=getLevel(st),t=getTerm(st),c=getTech(l,t);students.style.display='none';if(!c){curr.innerHTML='<button class="back" type="button">← Back to students</button><div class="empty">No technical curriculum mapping found for Level '+esc(l||'—')+' / Term '+esc(t)+'.</div>';curr.querySelector('.back').onclick=renderStudents;return}var name=st.name||st.studentName||'Student',h='<button class="back" type="button">← Back to students</button><div class="current"><div class="label">Current technical curriculum</div><h3>'+esc(name)+'</h3><div class="pill">Level '+esc(l)+'</div><div class="pill">Term '+esc(t)+'</div><div class="note">Cumulative technical requirements for the current Level and Term.</div></div><div class="tech-grid">';[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']].forEach(function(f){if(c[f[0]]&&c[f[0]].length)h+='<section class="tech-card"><h4>'+f[1]+'</h4>'+text(c[f[0]])+'</section>'});h+='</div><section class="section"><strong>MASTER OUTCOME</strong>'+esc(c.outcome||'')+'</section><div class="mastery"><b>Mastery:</b> 0 Not Introduced · 1 Introduced · 2 Developing · 3 Functional · 4 Secure · 5 Mastered · Needs Review · Not Yet Ready</div>';curr.innerHTML=h;curr.querySelector('.back').onclick=renderStudents}function renderStudent(st){mode==='scale'?renderScale(st):renderTech(st)}document.getElementById('open').onclick=function(){panel.classList.add('open');setMode(mode)};document.getElementById('close').onclick=function(){panel.classList.remove('open')};scaleBtn.onclick=function(){setMode('scale')};techBtn.onclick=function(){setMode('tech')};students.addEventListener('click',function(e){var b=e.target.closest('.student');if(!b)return;var a=read(),i=Number(b.dataset.index);if(a[i])renderStudent(a[i])});function findStudentInFrame(doc){var heading=doc.querySelector('h1');var title=(heading&&heading.textContent)||doc.title||'';var m=title.match(/(?:SCALES|REPERTOIRE|TECHNIQUE|ETUDES|HOMEWORK)[^·•—-]*[·•—-]\s*(.+)/i);var name=m?m[1].trim():'';var a=read();return a.find(function(s){return String(s.name||s.studentName||'').trim().toLowerCase()===name.toLowerCase()})||a.find(function(s){return title.toLowerCase().indexOf(String(s.name||s.studentName||'').toLowerCase())>=0})||null}function getCurriculumItems(st){var l=getLevel(st),t=getTerm(st),c=getScale(l,t),out=[];if(!c)return out;var fields=[['major','Major Scale'],['minor','Minor Scale'],['arpeggios','Tonic Arpeggio'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scale'],['doubleStops','Double Stops'],['oneString','One-String Scale'],['positions','Positions'],['bowing','Bowing'],['articulation','Articulation'],['rhythm','Rhythm'],['patterns','Patterns'],['accents','Accents'],['dynamics','Dynamics'],['octaves','Octaves'],['tempo','Tempo'],['objective','Objective'],['mastery','Mastery']];fields.forEach(function(f){var v=c[f[0]];if(v==null||v==='')return;var arr=Array.isArray(v)?v:[v];arr.forEach(function(x){if(typeof x==='object'){Object.keys(x).forEach(function(k){var z=x[k];(Array.isArray(z)?z:[z]).forEach(function(q){if(q!=null&&q!=='')out.push({title:String(q),category:f[1]+' · '+k})})}else out.push({title:String(x),category:f[1]})})});var seen={};return out.filter(function(x){var k=x.category+'|'+x.title;if(seen[k])return false;seen[k]=1;return true})}function saveSelection(st,items,kind){var payload={studentId:st.id??st.studentId??null,studentName:st.name||st.studentName||'Student',level:getLevel(st),term:getTerm(st),kind:kind,createdAt:new Date().toISOString(),items:items};localStorage.setItem('VIOLIN_AI_'+(kind==='lesson'?'LESSON':'HOMEWORK')+'_SELECTION_V1',JSON.stringify(payload));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(payload));return payload}function injectStudentScales(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var st=findStudentInFrame(doc);if(!st)return;var tabs=[].slice.call(doc.querySelectorAll('button'));var scaleTab=tabs.find(function(b){return /\bSCALES\b/i.test(b.textContent||'')});if(!scaleTab)return;var old=doc.getElementById('violin-v13-student-curriculum');if(old)old.remove();var card=doc.createElement('section');card.id='violin-v13-student-curriculum';card.className='student-curriculum-card';var items=getCurriculumItems(st);if(!items.length){card.innerHTML='<h3>🎼 Curriculum Scales</h3><div class="sub">No scale mapping found for Level '+esc(getLevel(st))+' · Term '+esc(getTerm(st))+'.</div>';scaleTab.parentElement&&scaleTab.parentElement.insertAdjacentElement('afterend',card);return}var selected={};try{var oldSel=JSON.parse(localStorage.getItem('VIOLIN_AI_CURRENT_SELECTION_V1')||'{}');if(String(oldSel.studentId||oldSel.studentName||'')===String(st.id||st.name||'')){(oldSel.items||[]).forEach(function(x){selected[x.title+'|'+x.category]=1})}}catch(e){}var html='<h3>🎼 Today’s Curriculum Scales</h3><div class="sub">Level '+esc(getLevel(st))+' · Term '+esc(getTerm(st))+' · Select what you want to hear today or assign for home practice.</div>';items.forEach(function(x,i){var key=x.title+'|'+x.category;html+='<label class="sc-pick"><input type="checkbox" data-scidx="'+i+'" '+(selected[key]?'checked':'')+'><span><b>'+esc(x.title)+'</b><small>'+esc(x.category)+'</small></span></label>'});html+='<div class="sc-actions"><button type="button" class="sc-lesson" id="v13ScLesson">🎓 Add to Lesson</button><button type="button" class="sc-home" id="v13ScHome">🏠 Add to Homework</button><button type="button" class="sc-clear" id="v13ScClear">Clear</button></div>';card.innerHTML=html;scaleTab.parentElement&&scaleTab.parentElement.insertAdjacentElement('afterend',card);function selectedItems(){return items.filter(function(x,i){var el=card.querySelector('[data-scidx="'+i+'"]');return el&&el.checked})}card.querySelector('#v13ScLesson').onclick=function(){var chosen=selectedItems();if(!chosen.length){alert('Select at least one curriculum item for today’s lesson.');return}var payload=saveSelection(st,chosen,'lesson');frame.src='./lesson.html?studentId='+encodeURIComponent(payload.studentId||'')+'&student='+encodeURIComponent(read().indexOf(st));};card.querySelector('#v13ScHome').onclick=function(){var chosen=selectedItems();if(!chosen.length){alert('Select at least one curriculum item for homework.');return}saveSelection(st,chosen,'homework');var homeTab=[].slice.call(doc.querySelectorAll('button')).find(function(b){return /^\s*(🏠\s*)?HOMEWORK\s*$/i.test((b.textContent||'').trim())||/\bHOMEWORK\b/i.test(b.textContent||'')});if(homeTab)homeTab.click();else alert(chosen.length+' curriculum item(s) added to Homework.');};card.querySelector('#v13ScClear').onclick=function(){card.querySelectorAll('input[type=checkbox]').forEach(function(x){x.checked=false});localStorage.removeItem('VIOLIN_AI_CURRENT_SELECTION_V1')};}catch(e){console.warn('V13 student curriculum integration',e)}}function observeFrame(){try{var doc=frame.contentDocument;if(!doc)return;new MutationObserver(function(){clearTimeout(window.__v13sc);window.__v13sc=setTimeout(injectStudentScales,120)}).observe(doc.body,{childList:true,subtree:true});injectStudentScales()}catch(e){}}frame.addEventListener('load',observeFrame);setTimeout(observeFrame,400);})();</script></body></html>
