elTitle">Scale &amp; Arpeggio Curriculum</h2></div><button id="close" class="btn close">✕</button></div><div class="tabs"><button id="scaleBtn" class="active">Scale &amp; Arpeggio</button><button id="techBtn">Technical Skills</button></div><div id="students"></div><div id="details"></div></div><script>(function(){'use strict';var frame=document.getElementById('appFrame'),panel=document.getElementById('panel'),students=document.getElementById('students'),details=document.getElementById('details'),mode='scale';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}function num(v){var m=String(v==null?'':v).match(/\d+/);return m?+m[0]:null}function lvl(s){return num(s.level??s.Level??s.currentLevel??s.grade)}function term(s){var v=s.term??s.Term??s.currentTerm??1,m=String(v).match(/[12]/);return m?+m[0]:1}function nm(s){return s.name||s.studentName||'Student'}function data(type,l,t){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return null;return typeof x.getTerm==='function'?x.getTerm(l,t):(x[l]&&x[l][t])||null}function vals(st){var c=data('scale',lvl(st),term(st)),out=[];if(!c)return out;[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String']].forEach(function(f){var v=c[f[0]];if(v==null||v==='')return;(Array.isArray(v)?v:[v]).forEach(function(x){if(x!=null&&x!=='')out.push({title:String(x),category:f[1]})})});var seen={};return out.filter(function(x){var k=x.category+'|'+x.title;if(seen[k])return false;seen[k]=1;return true})}function findStudent(doc){var a=read(),h=(doc.querySelector('h1')?.textContent||'').toLowerCase();for(var i=0;i<a.length;i++){var n=String(nm(a[i])).toLowerCase();if(n&&h.indexOf(n)>=0)return a[i]}var body=(doc.body?.innerText||'').toLowerCase();for(var j=0;j<a.length;j++){var n2=String(nm(a[j])).toLowerCase();if(n2&&body.indexOf(n2)>=0)return a[j]}return null}function save(st,items,kind){var p={studentId:st.id??st.studentId??null,studentName:nm(st),level:lvl(st),term:term(st),kind:kind,createdAt:new Date().toISOString(),items:items};localStorage.setItem(kind==='lesson'?'VIOLIN_AI_LESSON_SELECTION_V1':'VIOLIN_AI_HOMEWORK_SELECTION_V1',JSON.stringify(p));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(p));return p}function addLessonTab(doc,st){if(doc.getElementById('v13-open-lesson'))return;var tabs=[...doc.querySelectorAll('button')].find(function(b){return /^\s*HOMEWORK\s*$/i.test(b.textContent||'')});if(!tabs)return;var b=doc.createElement('button');b.id='v13-open-lesson';b.textContent='🎓 LESSON';b.style.cssText='border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#24344c;color:#fff;cursor:pointer';b.onclick=function(e){e.preventDefault();e.stopPropagation();frame.src='./lesson.html?studentId='+encodeURIComponent(st.id??st.studentId??'')+'&student='+read().indexOf(st)+'&v=13-lesson-final-5'};tabs.parentElement.appendChild(b)}function addScaleCard(doc,st){var old=doc.getElementById('v13-scale-curriculum');if(old)old.remove();var items=vals(st),card=doc.createElement('section');card.id='v13-scale-curriculum';card.style.cssText='margin:14px 0;padding:16px;border:1px solid #dfd4ff;border-radius:16px;background:linear-gradient(135deg,#f7f4ff,#fff);box-shadow:0 7px 24px #14233d0d;font-family:Arial,sans-serif;color:#24344c';var h='<h3 style="margin:0 0 4px;font-size:20px">🎼 Curriculum Scales</h3><div style="font-size:13px;color:#687487;margin-bottom:12px">Level '+esc(lvl(st))+' · Term '+esc(term(st))+' · Choose what you want to hear today or assign for home practice.</div>';if(!items.length)h+='<div style="background:#fff8df;border:1px solid #eadba3;border-radius:12px;padding:11px">No curriculum scale mapping found for this Level / Term.</div>';else{h+='<div id="v13-scale-box" style="border:1px solid #e7e2f4;border-radius:12px;overflow:hidden;background:#faf9fd"><button id="v13-scale-toggle" type="button" style="width:100%;border:0;background:#fff;padding:12px;text-align:left;font:inherit;font-weight:800;display:flex;justify-content:space-between;cursor:pointer">Curriculum requirements <span>▶</span></button><div id="v13-scale-body" style="display:none;padding:8px 10px 10px">';items.forEach(function(x,i){h+='<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #e7e9ef;border-radius:10px;background:#fff;margin:7px 0;cursor:pointer;min-height:44px"><input type="checkbox" data-v13-scale="'+i+'" style="width:20px;height:20px;min-width:20px;margin:0;cursor:pointer"><span><b style="display:block;font-size:14px">'+esc(x.title)+'</b><small style="display:block;color:#687487;margin-top:2px">'+esc(x.category)+'</small></span></label>'});h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="v13ScaleLesson" type="button" style="border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#24344c;color:#fff">🎓 Add to Lesson</button><button id="v13ScaleHome" type="button" style="border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#64c6a3;color:#12372c">🏠 Add to Homework</button><button id="v13ScaleClear" type="button" style="border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#eef1f5;color:#24344c">Clear</button></div></div></div>'}card.innerHTML=h;var scaleTab=[...doc.querySelectorAll('button')].find(function(b){return /^\s*SCALES\s*$/i.test(b.textContent||'')});var tabs=scaleTab?.parentElement;var anchor=tabs||doc.querySelector('h1')?.parentElement;if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(card,anchor.nextSibling);else doc.body.prepend(card);var toggle=card.querySelector('#v13-scale-toggle');if(toggle)toggle.onclick=function(e){e.preventDefault();e.stopPropagation();var body=card.querySelector('#v13-scale-body'),open=body.style.display!=='block';body.style.display=open?'block':'none';toggle.querySelector('span').textContent=open?'▼':'▶'};function chosen(){return items.filter(function(x,i){return card.querySelector('[data-v13-scale="'+i+'"]').checked})}var l=card.querySelector('#v13ScaleLesson'),hw=card.querySelector('#v13ScaleHome'),cl=card.querySelector('#v13ScaleClear');if(l)l.onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var p=save(st,x,'lesson');frame.src='./lesson.html?studentId='+encodeURIComponent(p.studentId||'')+'&student='+read().indexOf(st)+'&v=13-lesson-final-5'};if(hw)hw.onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');save(st,x,'homework');var b=[...doc.querySelectorAll('button')].find(function(q){return /^\s*HOMEWORK\s*$/i.test(q.textContent||'')});if(b)b.click()};if(cl)cl.onclick=function(){card.querySelectorAll('input[type="checkbox"]').forEach(function(q){q.checked=false})}}function sync(){try{var doc=frame.contentDocument;if(!doc?.body)return;var st=findStudent(doc);if(!st)return;addLessonTab(doc,st);var title=(doc.querySelector('h1')?.textContent||'').toUpperCase();if(/^\s*SCALES\b/.test(title))addScaleCard(doc,st);else{var c=doc.getElementById('v13-scale-curriculum');if(c)c.remove()}}catch(e){console.warn('V13',e)}}function observe(){sync();try{var doc=frame.contentDocument;if(doc?.body){if(window.__v13obs)window.__v13obs.disconnect();window.__v13obs=new MutationObserver(function(){clearTimeout(window.__v13timer);window.__v13timer=setTimeout(sync,120)});window.__v13obs.observe(doc.body,{childList:true,subtree:true})}}catch(e){}}frame.addEventListener('load',function(){setTimeout(observe,100);setTimeout(observe,500);setTimeout(observe,1200)});setTimeout(observe,900);document.getElementById('open').onclick=function(){panel.classList.add('open');list()};document.getElementById('close').onclick=function(){panel.classList.remove('open')};function list(){students.style.display='block';details.innerHTML='';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found.</div>';return}a.forEach(function(s,i){var b=document.createElement('button');b.className='student';b.dataset.i=i;b.innerHTML='<b>'+esc(nm(s))+'</b><br><span class="pill">Level '+esc(lvl(s)||'—')+'</span><span class="pill">Term '+esc(term(s))+'</span>';students.appendChild(b)})}function detail(s){students.style.display='none';var c=data(mode,lvl(s),term(s)),h='<button id="back" class="btn back">← Students</button><div class="card"><b>'+esc(nm(s))+'</b><br><span class="pill">Level '+esc(lvl(s)||'—')+'</span><span class="pill">Term '+esc(term(s))+'</span></div>';if(!c){details.innerHTML=h+'<div class="empty">No curriculum mapping.</div>';document.getElementById('back').onclick=list;return}Object.keys(c).forEach(function(k){if(c[k]==null||c[k]==='')return;h+='<div class="section"><strong>'+esc(k)+'</strong>'+esc(Array.isArray(c[k])?c[k].join(' • '):c[k])+'</div>'});details.innerHTML=h;document.getElementById('back').onclick=list}students.addEventListener('click',function(e){var b=e.target.closest('.student');if(b){detail(read()[+b.dataset.i])}});document.getElementById('scaleBtn').onclick=function(){mode='scale';scaleBtn.classList.add('active');techBtn.classList.remove('active');panelTitle.textContent='Scale & Arpeggio Curriculum';list()};document.getElementById('techBtn').onclick=function(){mode='tech';techBtn.classList.add('active');scaleBtn.classList.remove('active');panelTitle.textContent='Technical Skills Curriculum';list()}})();</script></body></html>
