<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — Lesson Controlled</title><style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="lesson" src="./lesson.html?v=controlled-1"></iframe><script>(function(){'use strict';var f=document.getElementById('lesson');var KEY='VIOLIN_AI_LESSON_SELECTION_V1';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function selected(){var x=read();return x&&Array.isArray(x.items)?x.items:[]}function norm(x){return String(x||'').replace(/\s+/g,' ').trim().toLowerCase()}function allowed(){return new Set(selected().map(function(x){return norm(x.title||x.name||x.text)}).filter(Boolean))}function clean(doc){var a=allowed();var hasSelection=a.size>0;var plan=doc.querySelector('#plan');if(plan){Array.from(plan.querySelectorAll('.selectrow')).forEach(function(row){var section=norm(row.querySelector('.source')?.textContent||'');var title=norm(row.querySelector('.grow b')?.textContent||'');if(section.indexOf('scales')>=0){row.style.display=hasSelection&&a.has(title)?'':'none'}})}var content=doc.querySelector('#content');if(content){Array.from(content.querySelectorAll('.collapse')).forEach(function(c){var head=norm(c.querySelector('.collapse-head')?.textContent||'');if(head.indexOf('scales')>=0){var visible=false;Array.from(c.querySelectorAll('.item')).forEach(function(item){var title=norm(item.querySelector('b')?.textContent||'');var ok=hasSelection&&a.has(title);item.style.display=ok?'':'none';if(ok)visible=true});c.style.display=visible?'':'none'}})}var note=doc.getElementById('v13-controlled-note');if(!note){note=doc.createElement('div');note.id='v13-controlled-note';note.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99999;background:#24344c;color:white;padding:8px 12px;border-radius:10px;font:700 12px Arial;box-shadow:0 6px 20px #0002';doc.body.appendChild(note)}note.textContent=hasSelection?'✓ Lesson scales: teacher selected only':'No scales selected for this lesson';}function hook(){try{var d=f.contentDocument;if(!d||!d.body)return;clean(d);if(!d.body.dataset.controlledObserver){d.body.dataset.controlledObserver='1';new MutationObserver(function(){clearTimeout(window.__ct);window.__ct=setTimeout(function(){clean(d)},60)}).observe(d.body,{childList:true,subtree:true})} }catch(e){}}f.addEventListener('load',function(){setTimeout(hook,100);setTimeout(hook,500);setTimeout(hook,1200)});setInterval(hook,500)})();</script></body></html>
