<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI V13</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.bar{position:fixed;right:14px;top:14px;z-index:50}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:#14233d;color:white;box-shadow:0 5px 18px #0003}.panel{display:none;position:fixed;z-index:60;right:14px;top:62px;width:min(620px,calc(100% - 28px));max-height:calc(100vh - 78px);overflow:auto;background:white;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0005}.panel.open{display:block}.head{display:flex;justify-content:space-between;align-items:center}.close,.back{background:#eef1f5;color:#24344c;box-shadow:none}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{border:1px solid #d9dee8;background:white;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.tabs button.active{background:#eef1f5}.student{width:100%;display:block;text-align:left;background:white;border:1px solid #e1e6ee;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.student:hover{background:#f6f8fa}.pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:5px 5px 0 0}.muted,.empty{color:#687487;font-size:13px}.card{background:#f7f8fa;border-radius:13px;padding:12px;margin:10px 0}.section{border-top:1px solid #e7e9ed;padding:12px 0}.section strong{display:block;margin-bottom:7px}.item{padding:4px 0}.error{background:#fff0f0;color:#8a2020;padding:12px;border-radius:10px}.lesson-launch{border:0;border-radius:10px;padding:10px 14px;margin:8px 0;background:#24344c;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 16px #0002}.lesson-launch:hover{filter:brightness(1.08)}
</style>
<script src="./scale-curriculum-data.js"></script>
<script src="./technical-skills-curriculum-data.js"></script>
</head>
<body>
<iframe id="appFrame" src="./index.html?v=13-index-3" title="VIOLIN AI Teacher Agenda"></iframe>
<div class="bar"><button id="open" class="btn">Curriculum</button></div>
<div id="panel" class="panel">
  <div class="head"><div><div class="muted">VIOLIN AI V13</div><h2 id="title">Curriculum</h2></div><button id="close" class="btn close">✕</button></div>
  <div class="tabs"><button id="scale" class="active">Scale &amp; Arpeggio</button><button id="tech">Technical Skills</button></div>
  <div id="students"></div><div id="details"></div>
</div>
<script>
(function(){'use strict';
var panel=document.getElementById('panel'),students=document.getElementById('students'),details=document.getElementById('details'),scale=document.getElementById('scale'),tech=document.getElementById('tech'),frame=document.getElementById('appFrame'),mode='scale';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}
function num(v){var m=String(v==null?'':v).match(/\d+/);return m?Number(m[0]):null}
function lvl(s){return num(s.level!=null?s.level:(s.Level!=null?s.Level:s.currentLevel))}
function trm(s){var v=s.term!=null?s.term:(s.Term!=null?s.Term:s.currentTerm);var m=String(v==null?'1':v).match(/[12]/);return m?Number(m[0]):1}
function out(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return '<div class="item">• '+out(x)+'</div>'}).join('');if(typeof v==='object')return Object.keys(v).map(function(k){return '<div class="item"><b>'+esc(k)+':</b> '+out(v[k])+'</div>'}).join('');return esc(v)}
function curriculum(type,l,t){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);if(x.levels&&x.levels[l]&&x.levels[l][t])return x.levels[l][t];if(x.terms&&x.terms[l]&&x.terms[l][t])return x.terms[l][t];if(x[l]&&x[l][t])return x[l][t];return null}
function list(){students.style.display='block';details.innerHTML='';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found in this browser.</div>';return}a.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.className='student';b.dataset.i=i;b.innerHTML='<b>'+esc(s.name||s.studentName||('Student '+(i+1)))+'</b><br><span class="pill">Level '+esc(lvl(s)||'—')+'</span><span class="pill">Term '+esc(trm(s))+'</span>';students.appendChild(b)})}
function detail(s){students.style.display='none';var l=lvl(s),t=trm(s),c=curriculum(mode,l,t),h='<button id="back" class="btn back">← Students</button><div class="card"><b>'+esc(s.name||s.studentName||'Student')+'</b><br><span class="pill">Level '+esc(l||'—')+'</span><span class="pill">Term '+esc(t)+'</span></div>';if(!c){details.innerHTML=h+'<div class="empty">No curriculum mapping for this Level / Term.</div>';document.getElementById('back').onclick=list;return}var fields=mode==='scale'?[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String'],['positions','Positions'],['bowing','Bowing'],['articulation','Articulation'],['rhythm','Rhythm'],['accents','Accents'],['dynamics','Dynamics'],['octaves','Octaves'],['tempo','Tempo'],['objective','Technical Objective'],['mastery','Mastery Criteria']]:[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']];fields.forEach(function(f){if(c[f[0]]!==undefined&&c[f[0]]!==null&&c[f[0]]!=='')h+='<div class="section"><strong>'+f[1]+'</strong>'+out(c[f[0]])+'</div>'});if(c.outcome)h+='<div class="section"><strong>MASTER OUTCOME</strong>'+out(c.outcome)+'</div>';details.innerHTML=h;document.getElementById('back').onclick=list}
function open(){panel.classList.add('open');list()}
document.getElementById('open').onclick=open;document.getElementById('close').onclick=function(){panel.classList.remove('open')};scale.onclick=function(){mode='scale';scale.classList.add('active');tech.classList.remove('active');document.getElementById('title').textContent='Scale & Arpeggio Curriculum';list()};tech.onclick=function(){mode='tech';tech.classList.add('active');scale.classList.remove('active');document.getElementById('title').textContent='Technical Skills Curriculum';list()};students.addEventListener('click',function(e){var b=e.target.closest('.student');if(!b)return;var a=read();if(a[Number(b.dataset.i)])detail(a[Number(b.dataset.i)])});
function currentStudent(doc){var title=((doc.querySelector('h1')||{}).textContent||doc.title||'');var a=read();return a.find(function(s){var n=String(s.name||s.studentName||'').trim().toLowerCase();return n&&title.toLowerCase().indexOf(n)>=0})||null}
function injectLessonButton(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var st=currentStudent(doc);if(!st)return;var old=doc.getElementById('v13-open-lesson');if(old)old.remove();var buttons=[].slice.call(doc.querySelectorAll('button'));var anchor=buttons.find(function(b){return /HOMEWORK/i.test((b.textContent||''))})||buttons.find(function(b){return /SCALES/i.test((b.textContent||''))})||doc.querySelector('h1');if(!anchor)return;var b=doc.createElement('button');b.id='v13-open-lesson';b.type='button';b.className='lesson-launch';b.textContent='🎓 LESSON';b.title='Open today\'s lesson for this student';b.onclick=function(){var id=st.id??st.studentId??st.uid??'';frame.src='./lesson.html?studentId='+encodeURIComponent(id)+'&v=13-lesson-3'};anchor.parentElement&&anchor.parentElement.insertBefore(b,anchor.nextSibling); }catch(e){console.warn('V13 lesson injection',e)}}
frame.addEventListener('load',function(){setTimeout(injectLessonButton,150);setTimeout(injectLessonButton,700)});
setTimeout(injectLessonButton,500);
})();
</script>
</body></html>
