<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14233d">
<title>VIOLIN AI — V13 FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#24344c;font-family:Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.bar{position:fixed;right:14px;top:14px;z-index:50}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:#14233d;color:#fff;box-shadow:0 5px 18px #0003}.panel{display:none;position:fixed;z-index:60;right:14px;top:62px;width:min(620px,calc(100% - 28px));max-height:calc(100vh - 78px);overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0005}.panel.open{display:block}.head{display:flex;justify-content:space-between;align-items:center}.close,.back{background:#eef1f5;color:#24344c;box-shadow:none}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.tabs button.active{background:#eef1f5}.student{width:100%;display:block;text-align:left;background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:5px 5px 0 0}.muted,.empty{color:#687487;font-size:13px}.card{background:#f7f8fa;border-radius:13px;padding:12px;margin:10px 0}.section{border-top:1px solid #e7e9ed;padding:12px 0}.section strong{display:block;margin-bottom:7px}.item{padding:4px 0}.lesson-launch{border:0;border-radius:10px;padding:10px 14px;margin:8px 0;background:#24344c;color:#fff;font-weight:800;cursor:pointer}.student-curriculum-card{margin:12px 0;padding:14px;border:1px solid #dfd4ff;border-radius:16px;background:linear-gradient(135deg,#f7f4ff,#fff);box-shadow:0 7px 24px #14233d0d}.student-curriculum-card h3{margin:0 0 4px}.sub{font-size:12px;color:#687487;margin-bottom:10px}.sc-collapse{border:1px solid #e7e2f4;border-radius:12px;overflow:hidden;background:#faf9fd}.sc-collapse>button{width:100%;border:0;background:#fff;padding:11px 12px;text-align:left;font:inherit;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.sc-collapse-body{display:none;padding:4px 10px 10px}.sc-collapse.open .sc-collapse-body{display:block}.sc-pick{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid #e7e2f4;border-radius:10px;background:#fff;margin:6px 0}.sc-pick input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}.sc-pick b{display:block}.sc-pick small{display:block;color:#687487}.sc-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.sc-actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.sc-lesson{background:#24344c;color:#fff}.sc-home{background:#64c6a3;color:#12372c}.sc-clear{background:#eef1f5}.notice{background:#fff8df;border:1px solid #eadba3;border-radius:12px;padding:11px;margin:10px 0}
</style>
<script src="./scale-curriculum-data.js"></script>
<script src="./technical-skills-curriculum-data.js"></script>
</head>
<body>
<iframe id="appFrame" src="../index.html?v=v13-direct-final-1" title="VIOLIN AI Teacher Agenda"></iframe>
<div class="bar"><button id="open" class="btn">Curriculum</button></div>
<div id="panel" class="panel"><div class="head"><div><div class="muted">VIOLIN AI V13</div><h2 id="panelTitle">Scale &amp; Arpeggio Curriculum</h2></div><button id="close" class="btn close">✕</button></div><div class="tabs"><button id="scaleBtn" class="active">Scale &amp; Arpeggio</button><button id="techBtn">Technical Skills</button></div><div id="students"></div><div id="details"></div></div>
<script>
(function(){'use strict';
var frame=document.getElementById('appFrame'),panel=document.getElementById('panel'),students=document.getElementById('students'),details=document.getElementById('details'),mode='scale';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}
function num(v){var m=String(v==null?'':v).match(/\d+/);return m?+m[0]:null}
function lvl(s){return num(s.level??s.Level??s.currentLevel??s.grade)}
function term(s){var v=s.term??s.Term??s.currentTerm??1,m=String(v).match(/[12]/);return m?+m[0]:1}
function nm(s){return s.name||s.studentName||'Student'}
function data(type,l,t){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);return x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||x[l]?.[t]||null}
function vals(st){var c=data('scale',lvl(st),term(st)),out=[];if(!c)return out;var fields=[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','One-String Scales']];fields.forEach(function(f){var v=c[f[0]];if(v==null||v==='')return;(Array.isArray(v)?v:[v]).forEach(function(x){if(x!=null&&x!=='')out.push({title:String(x),category:f[1]})})});var seen={};return out.filter(function(x){var k=x.category+'|'+x.title;if(seen[k])return false;seen[k]=1;return true})}
function list(){students.style.display='block';details.innerHTML='';students.innerHTML='';var a=read();if(!a.length){students.innerHTML='<div class="empty">No students found.</div>';return}a.forEach(function(s,i){var b=document.createElement('button');b.className='student';b.dataset.i=i;b.innerHTML='<b>'+esc(nm(s))+'</b><br><span class="pill">Level '+esc(lvl(s)||'—')+'</span><span class="pill">Term '+esc(term(s))+'</span>';students.appendChild(b)})}
function detail(s){students.style.display='none';var c=data(mode,lvl(s),term(s)),h='<button id="back" class="btn back">← Students</button><div class="card"><b>'+esc(nm(s))+'</b><br><span class="pill">Level '+esc(lvl(s)||'—')+'</span><span class="pill">Term '+esc(term(s))+'</span></div>';if(!c){details.innerHTML=h+'<div class="empty">No curriculum mapping.</div>';document.getElementById('back').onclick=list;return}var fields=mode==='scale'?[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','One-String Scales'],['positions','Positions'],['bowing','Bowing'],['articulation','Articulation'],['rhythm','Rhythm'],['accents','Accents'],['dynamics','Dynamics'],['tempo','Tempo'],['objective','Technical Objective'],['mastery','Mastery Criteria']]:[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']];fields.forEach(function(f){if(c[f[0]]!=null&&c[f[0]]!=='')h+='<div class="section"><strong>'+f[1]+'</strong>'+esc(Array.isArray(c[f[0]])?c[f[0]].join(' • '):c[f[0]])+'</div>'});details.innerHTML=h;document.getElementById('back').onclick=list}
function currentStudent(doc){var text=((doc.querySelector('h1,h2')||{}).textContent||'')+' '+(doc.body?.innerText||'');text=text.toLowerCase();return read().find(function(s){var n=String(nm(s)).trim().toLowerCase();return n&&text.indexOf(n)>=0})||null}
function injectLesson(doc,st){var old=doc.getElementById('v13-open-lesson');if(old)old.remove();var buttons=[...doc.querySelectorAll('button')];var anchor=buttons.find(function(b){return /HOMEWORK/i.test(b.textContent||'')})||buttons.find(function(b){return /SCALES/i.test(b.textContent||'')});if(!anchor)return;var b=doc.createElement('button');b.id='v13-open-lesson';b.type='button';b.className='lesson-launch';b.textContent='🎓 LESSON';b.onclick=function(){var id=st.id??st.studentId??st.uid??'';frame.src='./lesson.html?studentId='+encodeURIComponent(id)+'&student='+read().indexOf(st)+'&v=13-lesson-final-1'};anchor.parentElement&&anchor.parentElement.insertBefore(b,anchor.nextSibling)}
function injectScales(doc,st){var old=doc.getElementById('v13-scale-curriculum');if(old)old.remove();var items=vals(st),card=doc.createElement('section');card.id='v13-scale-curriculum';card.className='student-curriculum-card';var h='<h3>🎼 Curriculum Scales</h3><div class="sub">Level '+esc(lvl(st))+' · Term '+esc(term(st))+' · Choose what you want to hear today or assign for home practice.</div>';if(!items.length)h+='<div class="notice">No curriculum scale mapping found for this Level / Term.</div>';else{h+='<div class="sc-collapse"><button id="v13ScaleToggle">Curriculum requirements <span>▶</span></button><div class="sc-collapse-body">';items.forEach(function(x,i){h+='<label class="sc-pick"><input type="checkbox" data-ci="'+i+'"><span><b>'+esc(x.title)+'</b><small>'+esc(x.category)+'</small></span></label>'});h+='<div class="sc-actions"><button class="sc-lesson" id="v13ScaleLesson">🎓 Add to Lesson</button><button class="sc-home" id="v13ScaleHome">🏠 Add to Homework</button><button class="sc-clear" id="v13ScaleClear">Clear</button></div></div></div>'}card.innerHTML=h;var heading=doc.querySelector('h1,h2');var tabs=[...doc.querySelectorAll('button')].find(function(b){return /^\s*🎼?\s*SCALES\s*$/i.test((b.textContent||'').trim())})||[...doc.querySelectorAll('button')].find(function(b){return /\bSCALES\b/i.test(b.textContent||'')});var anchor=tabs?.parentElement||heading;anchor?.parentElement?.insertAdjacentElement('afterend',card);var tog=card.querySelector('#v13ScaleToggle');if(tog)tog.onclick=function(){var box=card.querySelector('.sc-collapse');box.classList.toggle('open');tog.querySelector('span').textContent=box.classList.contains('open')?'▼':'▶'};function chosen(){return items.filter(function(x,i){return card.querySelector('[data-ci="'+i+'"]')?.checked})}var lesson=card.querySelector('#v13ScaleLesson'),home=card.querySelector('#v13ScaleHome');if(lesson)lesson.onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var payload={studentId:st.id??st.studentId??null,studentName:nm(st),level:lvl(st),term:term(st),kind:'lesson',createdAt:new Date().toISOString(),items:x};localStorage.setItem('VIOLIN_AI_LESSON_SELECTION_V1',JSON.stringify(payload));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(payload));frame.src='./lesson.html?studentId='+encodeURIComponent(payload.studentId||'')+'&student='+read().indexOf(st)+'&v=13-lesson-final-1'};if(home)home.onclick=function(){var x=chosen();if(!x.length)return alert('Select at least one scale.');var payload={studentId:st.id??st.studentId??null,studentName:nm(st),level:lvl(st),term:term(st),kind:'homework',createdAt:new Date().toISOString(),items:x};localStorage.setItem('VIOLIN_AI_HOMEWORK_SELECTION_V1',JSON.stringify(payload));localStorage.setItem('VIOLIN_AI_CURRENT_SELECTION_V1',JSON.stringify(payload));var hb=[...doc.querySelectorAll('button')].find(function(b){return /\bHOMEWORK\b/i.test(b.textContent||'')});if(hb)hb.click()};var cl=card.querySelector('#v13ScaleClear');if(cl)cl.onclick=function(){card.querySelectorAll('input').forEach(function(x){x.checked=false})}}
function sync(){try{var doc=frame.contentDocument;if(!doc||!doc.body)return;var st=currentStudent(doc);if(!st)return;var title=(doc.querySelector('h1,h2')?.textContent||'').toUpperCase();if(/\bSCALES\b/.test(title))injectScales(doc,st);injectLesson(doc,st)}catch(e){console.warn('V13 sync',e)}}
function observe(){sync();try{var doc=frame.contentDocument;if(doc?.body){if(window.__v13obs)window.__v13obs.disconnect();window.__v13obs=new MutationObserver(function(){clearTimeout(window.__v13t);window.__v13t=setTimeout(sync,200)});window.__v13obs.observe(doc.body,{childList:true,subtree:true})}}catch(e){}}
frame.addEventListener('load',function(){setTimeout(observe,100);setTimeout(observe,500);setTimeout(observe,1200)});setTimeout(observe,700);
document.getElementById('open').onclick=function(){panel.classList.add('open');list()};document.getElementById('close').onclick=function(){panel.classList.remove('open')};document.getElementById('scaleBtn').onclick=function(){mode='scale';scaleBtn.classList.add('active');techBtn.classList.remove('active');panelTitle.textContent='Scale & Arpeggio Curriculum';list()};document.getElementById('techBtn').onclick=function(){mode='tech';techBtn.classList.add('active');scaleBtn.classList.remove('active');panelTitle.textContent='Technical Skills Curriculum';list()};students.addEventListener('click',function(e){var b=e.target.closest('.student');if(b){var a=read();detail(a[+b.dataset.i])}});
})();
</script>
</body>
</html>
