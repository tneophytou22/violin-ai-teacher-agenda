<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VIOLIN AI — Homework Center V13</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#24344c;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:1080px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{color:#687487;font-size:13px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.ghost{background:#eef1f5;color:#24344c}.primary{background:#24344c;color:#fff}.mint{background:#64c6a3;color:#12372c}.purple{background:#7451d9;color:#fff}.danger{background:#ef6a73;color:#fff}.card{background:#fff;border:1px solid #e3e7ee;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 7px 24px #14233d0d}.hero{background:linear-gradient(135deg,#f4f0ff,#fff);border-color:#dfd4ff}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;line-height:1.45}.students{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.student{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:15px;text-align:left;cursor:pointer;width:100%;transition:.15s}.student:hover{transform:translateY(-1px);box-shadow:0 8px 22px #14233d12}.student-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:800;margin:2px 4px 0 0}.count{background:#f1ecff;color:#5b3db2}.empty{text-align:center;color:#687487;padding:26px}.backrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}.item{border:1px solid #e2e5eb;border-radius:13px;padding:12px;margin:8px 0;background:#fff}.item-title{font-weight:800}.item-meta{color:#687487;font-size:12px;margin-top:4px}.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.item-actions{flex:0 0 auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{padding:11px 13px;border-radius:12px;background:#eefaf5;border:1px solid #cfeadd;margin-top:10px}.warn{background:#fff8df;border-color:#eadba3}@media(max-width:700px){body{padding:12px}.students{grid-template-columns:1fr}.top{align-items:flex-start}.item-row{flex-direction:column}.item-actions{width:100%}}
</style>
<script src="./core/curriculum-contract.js?v=10"></script>
<script src="./core/curriculum-controller.js?v=12"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="muted">VIOLIN AI · V13</div><h1 style="margin:3px 0 0">🏠 Homework Center</h1></div>
    <button class="btn ghost" id="back">← Back</button>
  </div>
  <div class="card hero">
    <h1>📚 Homework for your students</h1>
    <p>Choose a student to see everything already collected for homework. Scales, exercises and other selected curriculum items stay attached to that student until you remove them.</p>
  </div>
  <div id="view"></div>
</div>
<script>
(function(){
'use strict';
const HOME='VIOLIN_AI_HOMEWORK_QUEUE_V1';
function read(k,f){try{const x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function sid(s){return String(s?.id??s?.studentId??s?.uid??'')}
function name(s){return s?.name||s?.studentName||'Student'}
function students(){const x=read('VIOLIN_AI_AGENDA_V10',{});return Array.isArray(x?.students)?x.students:Array.isArray(x)?x:[]}
function queue(id){const C=window.VIOLIN_AI_CURRICULUM?.controller;const r=C?.getHomework?.(id);if(r&&Array.isArray(r.items))return r;const db=read(HOME,{});return db?.[String(id)]||{studentId:id,items:[]}}
function itemKey(x){return [x?.curriculum||'',x?.id||'',x?.title||''].join('|').toLowerCase()}
function fullUrl(id){return 'homework-v13.html?studentId='+encodeURIComponent(id)+'&v=center'}
const view=document.getElementById('view');
function renderList(){
 const a=students();
 if(!a.length){view.innerHTML='<div class="card empty">No students found.</div>';return}
 view.innerHTML='<div class="card"><div class="section-title"><h2 style="margin:0">👥 Select a student</h2><span class="muted">'+a.length+' students</span></div><div class="students" style="margin-top:12px">'+a.map((s,i)=>{const q=queue(sid(s));const n=(q.items||[]).length;return '<button class="student" data-i="'+i+'"><div class="student-head"><div><div class="name">'+esc(name(s))+'</div><span class="pill">Level '+esc(s.level??s.currentLevel??'—')+'</span><span class="pill">Term '+esc(s.term??s.currentTerm??1)+'</span></div><span class="pill count">'+n+' homework item'+(n===1?'':'s')+'</span></div></button>'}).join('')+'</div></div>';
 view.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>renderStudent(a[+b.dataset.i]));
}
function renderStudent(s){
 const id=sid(s),q=queue(id),items=Array.isArray(q.items)?q.items:[];
 const C=window.VIOLIN_AI_CURRICULUM?.controller;
 const detail=items.length?items.map((x,i)=>{const r=x.requirements||{};const meta=[];if(x.curriculum)meta.push(x.curriculum);if(x.category)meta.push(x.category);if(r.positions)meta.push('Positions: '+r.positions);if(r.octaves)meta.push('Octaves: '+r.octaves);if(r.bowing)meta.push('Bowing: '+(Array.isArray(r.bowing)?r.bowing.join(' · '):r.bowing));if(r.articulation)meta.push('Articulation: '+(Array.isArray(r.articulation)?r.articulation.join(' · '):r.articulation));if(r.tempo)meta.push('Tempo: '+r.tempo);return '<div class="item"><div class="item-row"><div><div class="item-title">🎼 '+esc(x.title||x.name||'Selected item')+'</div><div class="item-meta">'+esc(meta.join(' · '))+'</div></div><div class="item-actions"><button class="btn danger" data-delete-index="'+i+'" type="button">Delete</button></div></div></div>'}).join(''):'<div class="empty">Nothing has been added to homework for this student yet.</div>';
 view.innerHTML='<div class="card"><div class="backrow"><button class="btn ghost" id="studentsBack">← Students</button><span class="muted">Homework Center</span></div><div class="section-title"><div><h2 style="margin:0">🏠 '+esc(name(s))+'</h2><div class="muted">Level '+esc(s.level??s.currentLevel??q.level??'—')+' · Term '+esc(s.term??s.currentTerm??q.term??1)+'</div></div><span class="pill count">'+items.length+' selected</span></div></div><div class="card"><div class="section-title"><h2 style="margin:0">📚 Homework collection</h2><span class="muted">Everything selected so far</span></div>'+detail+'<div class="actions"><button class="btn purple" id="openDesigner">✨ Open Homework Designer</button><button class="btn mint" id="backToAgenda">← Back to Agenda</button></div></div>';
 document.getElementById('studentsBack').onclick=renderList;
 document.getElementById('openDesigner').onclick=()=>location.href=fullUrl(id);
 document.getElementById('backToAgenda').onclick=()=>history.back();
 view.querySelectorAll('[data-delete-index]').forEach(b=>b.onclick=()=>{
   const i=Number(b.dataset.deleteIndex), item=items[i];
   if(!item||!C?.removeHomework)return;
   if(!confirm('Delete this homework item for '+name(s)+'?'))return;
   C.removeHomework(id,itemKey(item));
   renderStudent(s);
 });
}
document.getElementById('back').onclick=()=>history.back();
renderList();
})();
</script>
</body></html>
