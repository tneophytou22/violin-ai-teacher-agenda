function isTab(b,name){var t=txt(b).toUpperCase();return t===name||t.includes(name)&&!t.includes('CURRICULUM')}
function active(doc,name){var bs=[...doc.querySelectorAll('.tabs button')],b=bs.find(function(x){return isTab(x,name)});if(!b)return false;var c=(b.className||'').toString().toLowerCase();return b.getAttribute('aria-selected')==='true'||b.getAttribute('data-active')==='true'||/active|selected|current/.test(c)}
function technical(doc){var tabs=doc.querySelector('.tabs');if(!tabs||!window.__v13TechInjected)return;if(!active(doc,'TECHNIQUE'))return;var old=doc.getElementById('v13mastertech');if(old)return;var x=doc.defaultView&&doc.defaultView.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1;if(!x)return;var l=(doc.body.innerText.match(/Level\s+(\d+)/i)||[])[1]||'1',t=(doc.body.innerText.match(/Term\s+(\d+)/i)||[])[1]||'1',lv=x.levels&&x.levels[l]&&x.levels[l][t];if(!lv)return;var card=doc.createElement('section');card.id='v13mastertech';card.className='v13master-tech';var h='<h3>🎯 Technical Curriculum</h3><div class="v13master-sub">Level '+l+' · Term '+t+' · Technical Skills Curriculum V1</div>';Object.keys(lv).forEach(function(k){if(!Array.isArray(lv[k])||!lv[k].length)return;h+='<div class="v13master-term"><button type="button"><span>'+k+'</span><span>▶</span></button><div class="v13master-term-body">'+lv[k].map(function(v){return '<div class="v13master-skill">'+String(v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})+'</div>'}).join('')+'</div></div>'});card.innerHTML=h;tabs.parentElement.insertBefore(card,tabs.nextSibling);card.querySelectorAll('.v13master-term button').forEach(function(b){b.onclick=function(){var q=b.parentElement;q.classList.toggle('open');b.lastElementChild.textContent=q.classList.contains('open')?'▼':'▶'}})}
function timetable(doc){var all=[...doc.querySelectorAll('*')];all.forEach(function(el){if(el.children.length>3)return;var t=txt(el).toLowerCase();if(!t)return;if(/music\s*school|music school|μουσικ(ό|ο)\s*σχολε(ί|ι)ο/.test(t)){el.classList.add('v13music-school')}else if(/private|ιδιωτικ(ό|η)|private lesson/.test(t)){el.classList.add('v13private')}});var heads=[...doc.querySelectorAll('h1,h2,h3')].find(function(x){return /timetable|schedule/i.test(txt(x)));if(heads&&!doc.getElementById('v13schedulelegend')){var lg=doc.createElement('div');lg.id='v13schedulelegend';lg.className='v13schedule-legend';lg.innerHTML='<span class="v13legend-school">🎼 Music School</span><span class="v13legend-private">🎻 Private</span>';heads.parentElement.appendChild(lg)}}
function hideScaleElsewhere(doc){var card=doc.getElementById('v13fixscale');if(!card)return;var tab=active(doc,'SCALES');card.style.display=tab?'':'none'}
function run(d){try{if(!d||!d.body)return;style(d);loadTech(d);window.__v13TechInjected=true;technical(d);timetable(d);hideScaleElsewhere(d);[...d.querySelectorAll('iframe')].forEach(function(f){try{run(f.contentDocument)}catch(e){}})}catch(e){}}
