<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — V13 STABLE</title>
<style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
<script src="./scale-curriculum-data.js"></script>
<script src="./technical-skills-curriculum-data.js"></script>
</head>
<body>
<iframe id="app" src="../index.html?v=v13-stable-3" title="VIOLIN AI Teacher Agenda"></iframe>
<script>
(function(){'use strict';
const outer=document.getElementById('app');
const AGENDA='VIOLIN_AI_AGENDA_V10', LESSON_SEL='VIOLIN_AI_LESSON_SELECTION_V1', CURRENT_SEL='VIOLIN_AI_CURRENT_SELECTION_V1', HOME_SEL='VIOLIN_AI_HOMEWORK_SELECTION_V1';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function readStudents(){try{const d=JSON.parse(localStorage.getItem(AGENDA)||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}
function number(v){const m=String(v??'').match(/\d+/);return m?+m[0]:null}
function level(s){return number(s?.level??s?.Level??s?.currentLevel??s?.grade)||1}
function term(s){return number(s?.term??s?.Term??s?.currentTerm)||1}
function name(s){return s?.name||s?.studentName||'Student'}
// The app is nested: final-stable -> v13/index -> root index -> SPA. Walk through ALL iframes.
function deepestDoc(){let d=null;try{d=outer.contentDocument}catch(e){return null}if(!d)return null;for(let i=0;i<8;i++){let f=d.querySelector('iframe');if(!f)break;try{if(!f.contentDocument)break;d=f.contentDocument}catch(e){break}}return d}
function allDocs(){const out=[];function walk(d,depth){if(!d||depth>8||out.includes(d))return;out.push(d);try{d.querySelectorAll('iframe').forEach(f=>{try{walk(f.contentDocument,depth+1)}catch(e){}})}catch(e){}}try{walk(outer.contentDocument,0)}catch(e){}return out}
function currentStudent(doc){const arr=readStudents();if(!arr.length)return null;const h=(doc.querySelector('h1')?.textContent||'').trim();const title=(doc.title||'').trim();const body=doc.body?.innerText||'';for(const s of arr){const n=name(s).trim();if(n&&(h.includes(n)||title.includes(n)||body.includes(n)))return s}const lm=body.match(/Level\s+(\d+)/i);if(lm){const lv=+lm[1],tm=+(body.match(/Term\s+(\d+)/i)||[])[1]||1;return arr.find(s=>level(s)===lv)||null}return null}
function curriculum(s){const x=window.VIOLIN_SCALE_CURRICULUM_V1;if(!x)return null;const l=level(s),t=term(s);return x[l]?.[t]||x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||(typeof x.getTerm==='function'?x.getTerm(l,t):null)}
function scaleItems(s){const c=curriculum(s),out=[];if(!c)return out;const fields=[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String']];for(const [key,cat] of fields){const v=c[key];if(v==null||v==='')continue;(Array.isArray(v)?v:[v]).forEach(x=>{if(x!=null&&x!=='')out.push({title:String(x),category:cat})})}const seen=new Set();return out.filter(x=>{const k=x.category+'|'+x.title;if(seen.has(k))return false;seen.add(k);return true})}
function css(doc){if(doc.getElementById('v13stable-css'))return;const st=doc.createElement('style');st.id='v13stable-css';st.textContent=`.v13-stable-lesson{background:#24344c!important;color:#fff!important;border:0!important;border-radius:11px!important;padding:10px 13px!important;font-weight:800!important;cursor:pointer!important}.v13-stable-scales{margin:14px 0!important;padding:16px!important;border:1px solid #dfd4ff!important;border-radius:16px!important;background:linear-gradient(135deg,#f7f4ff,#fff)!important;color:#24344c!important}.v13-stable-scales h3{margin:0 0 4px!important;font-size:20px!important}.v13-stable-sub{font-size:13px!important;color:#687487!important;margin-bottom:12px!important}.v13-stable-req{border:1px solid #e7e2f4!important;border-radius:12px!important;overflow:hidden!important;background:#faf9fd!important}.v13-stable-req>button{width:100%!important;border:0!important;background:#fff!important;padding:12px!important;text-align:left!important;font:inherit!important;font-weight:800!important;display:flex!important;justify-content:space-between!important;cursor:pointer!important}.v13-stable-body{display:none!important;padding:8px 10px 10px!important}.v13-stable-req.open .v13-stable-body{display:block!important}.v13-stable-pick{display:flex!important;gap:10px!important;align-items:center!important;padding:10px!important;border:1px solid #e7e9ef!important;border-radius:10px!important;background:#fff!important;margin:7px 0!important;cursor:pointer!important;min-height:44px!important}.v13-stable-pick input{appearance:auto!important;-webkit-appearance:checkbox!important;width:20px!important;height:20px!important;min-width:20px!important;margin:0!important;opacity:1!important;position:static!important;display:inline-block!important;cursor:pointer!important}.v13-stable-pick span{display:block!important;flex:1!important}.v13-stable-pick b{display:block!important;font-size:14px!important}.v13-stable-pick small{display:block!important;color:#687487!important;font-size:12px!important;margin-top:2px!important}.v13-stable-actions{display:flex!important;gap:8px!important;flex-wrap:wrap!important;margin-top:12px!important}.v13-stable-actions button{border:0!important;border-radius:10px!important;padding:10px 13px!important;font-weight:800!important;cursor:pointer!important}.v13-stable-lesson-btn{background:#24344c!important;color:#fff!important}.v13-stable-home-btn{background:#64c6a3!important;color:#12372c!important}.v13-stable-clear-btn{background:#eef1f5!important;color:#24344c!important}.v13-stable-note{background:#fff8df!important;border:1px solid #eadba3!important;border-radius:12px!important;padding:11px!important;font-size:13px!important}`;doc.head.appendChild(st)}
function addLessonTab(doc,s){const tabs=doc.querySelector('.tabs');if(!tabs)return;let b=doc.getElementById('v13-stable-lesson');if(b)return;b=doc.createElement('button');b.id='v13-stable-lesson';b.type='button';b.className='tab v13-stable-lesson';b.textContent='🎓 LESSON';b.onclick=e=>{e.preventDefault();e.stopPropagation();openLesson(s)};tabs.appendChild(b)}
function openLesson(s){const id=s?.id??s?.studentId??s?.uid??'';const idx=readStudents().indexOf(s);outer.src='./lesson.html?studentId='+encodeURIComponent(id)+'&student='+idx+'&v=13-stable-lesson-3'}
function isScales(doc){const h=(doc.querySelector('h1')?.textContent||'').toUpperCase();return /\bSCALES\b/.test(h)}
function save(kind,s,items){const p={studentId:s.id??s.studentId??null,studentName:name(s),level:level(s),term:term(s),kind,items,createdAt:new Date().toISOString()};localStorage.setItem(kind==='lesson'?LESSON_SEL:HOME_SEL,JSON.stringify(p));localStorage.setItem(CURRENT_SEL,JSON.stringify(p));return p}
function injectScales(doc,s){const old=doc.getElementById('v13-stable-scales');if(old)old.remove();const items=scaleItems(s),card=doc.createElement('section');card.id='v13-stable-scales';card.className='v13-stable-scales';let html='<h3>🎼 Curriculum Scales</h3><div class="v13-stable-sub">Level '+esc(level(s))+' · Term '+esc(term(s))+' · Choose what you want to hear today or assign for home practice.</div>';if(!items.length){html+='<div class="v13-stable-note">No curriculum scale mapping found for this Level / Term.</div>'}else{html+='<div class="v13-stable-req"><button type="button" id="v13-stable-toggle">Curriculum requirements <span>▶</span></button><div class="v13-stable-body">';items.forEach((x,i)=>html+='<label class="v13-stable-pick"><input type="checkbox" data-v13-scale="'+i+'"><span><b>'+esc(x.title)+'</b><small>'+esc(x.category)+'</small></span></label>');html+='<div class="v13-stable-actions"><button class="v13-stable-lesson-btn" id="v13-stable-add-lesson" type="button">🎓 Add to Lesson</button><button class="v13-stable-home-btn" id="v13-stable-add-home" type="button">🏠 Add to Homework</button><button class="v13-stable-clear-btn" id="v13-stable-clear" type="button">Clear</button></div></div></div>'}card.innerHTML=html;const heading=doc.querySelector('h1');const tabs=[...doc.querySelectorAll('button')].find(b=>/\bSCALES\b/i.test(b.textContent||''));const anchor=tabs?.parentElement||heading;if(anchor?.parentElement)anchor.parentElement.insertAdjacentElement('afterend',card);else doc.body.prepend(card);const toggle=card.querySelector('#v13-stable-toggle');if(toggle)toggle.onclick=e=>{e.preventDefault();e.stopPropagation();const box=card.querySelector('.v13-stable-req');box.classList.toggle('open');toggle.querySelector('span').textContent=box.classList.contains('open')?'▼':'▶'};const chosen=()=>items.filter((x,i)=>card.querySelector('[data-v13-scale="'+i+'"]')?.checked);card.querySelector('#v13-stable-add-lesson')?.addEventListener('click',()=>{const x=chosen();if(!x.length)return alert('Select at least one scale.');save('lesson',s,x);openLesson(s)});card.querySelector('#v13-stable-add-home')?.addEventListener('click',()=>{const x=chosen();if(!x.length)return alert('Select at least one scale.');save('homework',s,x);const hb=[...doc.querySelectorAll('button')].find(b=>/\bHOMEWORK\b/i.test(b.textContent||''));if(hb)hb.click()});card.querySelector('#v13-stable-clear')?.addEventListener('click',()=>card.querySelectorAll('input').forEach(x=>x.checked=false))}
function sync(){try{const doc=deepestDoc();if(!doc?.body)return;const s=currentStudent(doc);if(!s)return;css(doc);addLessonTab(doc,s);if(isScales(doc))injectScales(doc,s);else{const old=doc.getElementById('v13-stable-scales');if(old)old.remove()}}catch(e){console.warn('V13 stable sync',e)}}
function observe(){sync();allDocs().forEach(doc=>{try{if(!doc.body)return;if(doc.defaultView.__v13StableObserved)return;doc.defaultView.__v13StableObserved=true;const obs=new MutationObserver(()=>{clearTimeout(window.__v13t);window.__v13t=setTimeout(sync,180)});obs.observe(doc.body,{childList:true,subtree:true});}catch(e){}})}
outer.addEventListener('load',()=>{setTimeout(observe,100);setTimeout(observe,500);setTimeout(observe,1200);setTimeout(observe,2500)});setTimeout(observe,1000);
})();
</script>
</body></html>
