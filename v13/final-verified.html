<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 VERIFIED</title><style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.curriculum{position:fixed;right:16px;top:16px;z-index:20;border:0;border-radius:11px;padding:10px 14px;background:#14233d;color:#fff;font-weight:800;cursor:pointer}.panel{display:none;position:fixed;right:16px;top:62px;z-index:30;width:min(620px,calc(100% - 32px));max-height:calc(100% - 78px);overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0005}.panel.open{display:block}.panel button{cursor:pointer}.students button{display:block;width:100%;text-align:left;border:1px solid #e1e6ee;background:#fff;border-radius:12px;padding:12px;margin:8px 0}.pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:4px}.muted{color:#687487;font-size:13px}.close{float:right;border:0;background:#eef1f5;border-radius:10px;padding:8px}.section{border-top:1px solid #e7e9ed;padding:12px 0}.section b{display:block;margin-bottom:5px}</style><script src="./scale-curriculum-data.js"></script><script src="./technical-skills-curriculum-data.js"></script></head><body><iframe id="app" src="../index.html?v=v13-verified-1"></iframe><button id="curriculum" class="curriculum">Curriculum</button><div id="panel" class="panel"><button id="close" class="close">✕</button><h2>VIOLIN AI V13 Curriculum</h2><div class="muted">Scale &amp; Arpeggio Curriculum</div><div id="students" class="students"></div><div id="detail"></div></div><script>(function(){var frame=document.getElementById('app'),panel=document.getElementById('panel'),students=document.getElementById('students'),detail=document.getElementById('detail');function esc(x){return String(x??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function agenda(){try{var x=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(x.students)?x.students:[]}catch(e){return[]}}function num(x){var m=String(x??'').match(/\d+/);return m?+m[0]:null}function studentFromPage(doc){var a=agenda(),h=(doc.querySelector('h1')?.textContent||'').trim();for(var i=0;i<a.length;i++){var n=String(a[i].name||a[i].studentName||'').trim();if(n&&h.indexOf(n)>=0)return a[i]}var body=doc.body?.innerText||'';for(var j=0;j<a.length;j++){var n2=String(a[j].name||a[j].studentName||'').trim();if(n2&&body.indexOf(n2)>=0)return a[j]}var lm=body.match(/Level\s+(\d+)/i);if(lm){var lv=+lm[1],tm=(body.match(/Term\s+(\d+)/i)||[])[1]||1,nm=(h.match(/[·•]\s*(.+)$/)||[])[1]||'Student';return{name:nm,level:lv,term:+tm}}return null}function level(s){return num(s.level??s.Level??s.currentLevel??s.grade)||1}function term(s){return num(s.term??s.Term??s.currentTerm)||1}function getScale(s){var x=window.VIOLIN_SCALE_CURRICULUM_V1;if(!x)return null;var l=level(s),t=term(s);return typeof x.getTerm==='function'?x.getTerm(l,t):(x[l]&&x[l][t])||null}function values(s){var c=getScale(s),out=[];if(!c)return out;[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','One-String Scales']].forEach(function(f){var v=c[f[0]];if(v==null||v==='')return;(Array.isArray(v)?v:[v]).forEach(function(x){out.push({title:String(x),category:f[1]})})});var seen={};return out.filter(function(x){var k=x.category+'|'+x.title;if(seen[k])return false;seen[k]=1;return true})}function injectStyle(doc){if(doc.getElementById('v13verifiedstyle'))return;var st=doc.createElement('style');st.id='v13verifiedstyle';st.textContent='.v13lesson{border:0!important;border-radius:11px!important;padding:10px 13px!important;background:#24344c!important;color:#fff!important;font-weight:800!im
