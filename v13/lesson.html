<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — Lesson</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0;padding:16px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 7px 24px #14233d0d}.item{border:1px solid #e3e7ee;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{width:60px;padding:7px;border:1px solid #ccd3df;border-radius:8px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#24344c;color:#fff}.purple{background:#7451d9;color:#fff}.mint{background:#64c6a3;color:#12372c}.gold{background:#e6c25f;color:#473b15}.back{background:#eef1f5}.muted{color:#687487;font-size:13px}.tag{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:3px}.obs{width:100%;min-height:70px;border:1px solid #ccd3df;border-radius:9px;padding:8px}.empty{padding:20px;color:#687487;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.selectrow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #f0f1f4;padding:10px 0}.selectrow input{width:18px;height:18px;margin-top:2px}.selectrow .grow{flex:1}.analysis{background:linear-gradient(135deg,#f4f0ff,#fff);border:1px solid #dfd4ff}.diagnosis{background:#fff8df;border:1px solid #eadba3}.good{background:#f2fbf7;border-color:#d8f1e7}.priority{font-weight:800}.barbg{height:8px;background:#eceef3;border-radius:99px;overflow:hidden;margin-top:5px}.bar{height:100%;background:#7451d9}.hidden{display:none}.score-label{font-size:12px;font-weight:800;color:#687487}.source{font-size:11px;color:#7b8492}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:700;margin:3px}.summary{font-size:14px;line-height:1.5}.collapse{border:1px solid #e3e7ee;border-radius:14px;overflow:hidden;margin:10px 0;background:#fff}.collapse-head{width:100%;border:0;background:#fff;padding:14px;text-align:left;font:inherit;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.collapse-head:hover{background:#f7f8fa}.collapse-body{display:none;padding:0 14px 14px}.collapse.open .collapse-body{display:block}.chev{color:#687487;font-size:12px}.plan-card .collapse-body{padding-bottom:6px}
@media(max-width:650px){body{padding:10px}.top{align-items:flex-start}.top h1{font-size:23px}}
</style>
<script src="./scale-curriculum-data.js"></script>
<script src="./technical-skills-curriculum-data.js"></script>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="muted">VIOLIN AI</div><h1 id="title">Lesson</h1><div id="meta" class="muted"></div></div><button class="btn back" onclick="history.back()">← Back</button></div>
<div class="card"><div class="row"><button id="generate" class="btn primary">🤖 AI Generate Lesson</button><button id="regenerate" class="btn purple">🔄 Regenerate</button><button id="analysisBtn" class="btn">🧠 Violin Analysis & Suggest</button><button id="save" class="btn">💾 Save Lesson</button><button id="homework" class="btn mint">🏠 Create Homework from Plan</button></div><p class="muted">Lesson is the teacher's working and assessment environment. Curriculum remains the source of requirements. AI suggests; the teacher decides.</p></div>
<div id="analysis" class="card analysis hidden"></div>
<div class="card plan-card"><div class="section-title"><h2>🎯 Today's Teacher Plan</h2><span class="muted">Select what you will hear today</span></div><div id="plan"></div></div>
<div id="content"></div>
</div>
<script>
(function(){'use strict';
var p=new URLSearchParams(location.search),studentId=p.get('studentId'),idx=Number(p.get('student'));
function agenda(){try{return JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}')}catch(e){return{}}}
function students(){var d=agenda();return Array.isArray(d.students)?d.students:[]}
var arr=students(),s=studentId?arr.find(function(x){return String(x.id??x.studentId??x.uid??'')===String(studentId)}):arr[idx];
var state={items:[],plan:[],sid:null};
if(!s){document.getElementById('content').innerHTML='<div class="card empty">Student not found. Open Lesson from the Student page.</div>';return}
var level=s.level??s.Level??s.currentLevel??'—',term=s.term??s.Term??s.currentTerm??1,name=s.name||s.studentName||'Student';state.sid=s.id||s.studentId||studentId||String(idx);
document.getElementById('title').textContent='🎓 Lesson — '+name;document.getElementById('meta').textContent='Level '+level+' · Term '+term;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
function txt(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return '<div>• '+txt(x)+'</div>'}).join('');if(typeof v==='object')return Object.keys(v).map(function(k){return '<div><b>'+esc(k)+':</b> '+txt(v[k])+'</div>'}).join('');return esc(v)}
function readJSON(key,fallback){try{var x=JSON.parse(localStorage.getItem(key)||'null');return x==null?fallback:x}catch(e){return fallback}}
function cur(type){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1,l=Number(String(level).match(/\d+/)?.[0]||0),t=Number(String(term).match(/[12]/)?.[0]||1);if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);return x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||x[l]?.[t]||null}
function priorHomework(){var keys=['VIOLIN_AI_HOMEWORK_V1','VIOLIN_AI_PENDING_HOMEWORK_V1'];var all=[];keys.forEach(function(k){var x=readJSON(k,[]);if(Array.isArray(x))all=all.concat(x);else if(x&&typeof x==='object')all.push(x)});return all.filter(function(h){return !h.studentId||String(h.studentId)===String(state.sid)||String(h.studentIndex)===String(idx)}).slice(-5)}
function selectedFromStorage(){var keys=['VIOLIN_AI_SELECTED_LESSON_V1','VIOLIN_AI_LESSON_SELECTION_V1','VIOLIN_AI_LESSON_PLAN_V1'];for(var i=0;i<keys.length;i++){var x=readJSON(keys[i],null);if(x){if(Array.isArray(x))return x;if(Array.isArray(x.items))return x.items;if(Array.isArray(x.plan))return x.plan;if(Array.isArray(x.selection))return x.selection}}return []}
function item(section,title,detail,source){return{id:'i'+Date.now()+Math.random().toString(16).slice(2),section:section,title:title,detail:detail||'',source:source||'curriculum',score:'',observation:'',lesson:true,homework:false}}
function addItem(section,title,detail,source){state.items.push(item(section,title,detail,source))}
function buildPlan(){var picked=selectedFromStorage();state.plan=[];if(picked.length){picked.forEach(function(x){state.plan.push({id:x.id||('p'+Math.random()),section:x.section||x.category||'Plan',title:x.title||x.name||x.text||'Selected item',detail:x.detail||x.description||'',selected:true})});return}var sc=cur('scale'),tc=cur('tech');if(sc){[['Scales','major','Major Scales'],['Scales','minor','Minor Scales'],['Scales','arpeggios','Tonic Arpeggios'],['Scales','oneString','Scales on One String'],['Scales','bowing','Bowing Patterns'],['Scales','articulation','Articulation']].forEach(function(a){if(sc[a[1]]){var vals=Array.isArray(sc[a[1]])?sc[a[1]]:[sc[a[1]]];vals.forEach(function(v){state.plan.push({id:'p'+Math.random(),section:a[0],title:v,detail:a[2],selected:false})})}})}if(tc){[['Technique','left'],['Technique','thumb'],['Technique','right'],['Technique','strokes']].forEach(function(a){var vals=tc[a[1]];if(Array.isArray(vals))vals.forEach(function(v){state.plan.push({id:'p'+Math.random(),section:a[0],title:v,detail:a[1],selected:false})})})}state.plan.push({id:'pwarm',section:'Warm Up',title:'Warm-up — 5 min',detail:'Preparation and activation',selected:false});state.plan.push({id:'pet',section:'Études',title:'Current Étude',detail:'Listen and assess preparation',selected:false});state.plan.push({id:'prep',section:'Repertoire',title:'Current Repertoire',detail:'Listen, observe and diagnose',selected:false})}
function renderPlan(){var h='';if(!state.plan.length)h='<div class="empty">No teacher plan yet. Use AI Generate Lesson or select items from the Student page.</div>';else{state.plan.forEach(function(x,i){h+='<label class="selectrow"><input type="checkbox" data-plan="'+i+'" '+(x.selected?'checked':'')+'><span class="grow"><b>'+esc(x.title)+'</b><br><span class="source">'+esc(x.section)+' · '+esc(x.detail)+'</span></span></label>'})}document.getElementById('plan').innerHTML=h;document.querySelectorAll('[data-plan]').forEach(function(e){e.onchange=function(){state.plan[+e.dataset.plan].selected=e.checked;syncSelectedPlan()}})}
function syncSelectedPlan(){localStorage.setItem('VIOLIN_AI_SELECTED_LESSON_V1',JSON.stringify({studentId:state.sid,studentName:name,level:level,term:term,items:state.plan.filter(function(x){return x.selected}),date:new Date().toISOString()}))}
function makeCollapse(title,body,open){return '<div class="collapse '+(open?'open':'')+'"><button class="collapse-head" type="button"><span>'+title+'</span><span class="chev">'+(open?'▼':'▶')+'</span></button><div class="collapse-body">'+body+'</div></div>'}
function wireCollapses(root){root.querySelectorAll('.collapse-head').forEach(function(b){b.onclick=function(){var c=b.parentElement;c.classList.toggle('open');b.querySelector('.chev').textContent=c.classList.contains('open')?'▼':'▶'}})}
function generate(){buildPlan();state.items=[];var prev=priorHomework(),sc=cur('scale'),tc=cur('tech');addItem('Warm Up','Warm-up — 5 min',prev.length?'Start from previous homework and recent observations.':'Level-appropriate activation.','AI');state.plan.filter(function(x){return x.selected}).forEach(function(x){addItem(x.section,x.title,x.detail,'teacher-plan')});if(!state.plan.some(function(x){return x.selected})){state.plan.slice(0,Math.min(6,state.plan.length)).forEach(function(x){x.selected=true;addItem(x.section,x.title,x.detail,'AI curriculum suggestion')})}if(sc&&!state.items.some(function(x){return x.section==='Scales'})){if(sc.major)addItem('Scales','Major Scales',txt(sc.major),'curriculum');if(sc.minor)addItem('Scales','Minor Scales',txt(sc.minor),'curriculum');if(sc.arpeggios)addItem('Scales','Tonic Arpeggios',txt(sc.arpeggios),'curriculum')}if(tc&&!state.items.some(function(x){return x.section==='Technique'})){['left','thumb','right','strokes'].forEach(function(k){if(Array.isArray(tc[k])&&tc[k].length)addItem('Technique',k,txt(tc[k]),'curriculum')})}if(!state.items.some(function(x){return x.section==='Études'}))addItem('Études','Current Étude — 5–10 min','Review assigned étude and assess preparation.','student-program');if(!state.items.some(function(x){return x.section==='Repertoire'}))addItem('Repertoire','Current Repertoire','Listen, observe and record musical and technical findings.','student-program');render();syncSelectedPlan()}
function render(){var groups={};state.items.forEach(function(x,i){(groups[x.section]||(groups[x.section]=[])).push([x,i])});var h='';Object.keys(groups).forEach(function(g){var body='';groups[g].forEach(function(a){var x=a[0],i=a[1];body+='<div class="item"><div class="section-title"><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.detail)+'</div><span class="tag">'+esc(x.source)+'</span></div><label class="score-label">Score /20<br><input class="score" data-score="'+i+'" type="number" min="0" max="20" value="'+esc(x.score)+'" placeholder="—"></label></div><div class="row"><label><input type="checkbox" data-hw="'+i+'" '+(x.homework?'checked':'')+'> Add to homework</label></div><textarea class="obs" data-obs="'+i+'" placeholder="Teacher observation / diagnostic note...">'+esc(x.observation)+'</textarea></div>'});h+=makeCollapse(g+' <span class="muted">· '+groups[g].length+' item'+(groups[g].length>1?'s':'')+'</span>',body,false)});document.getElementById('content').innerHTML=h;wireCollapses(document.getElementById('content'));document.querySelectorAll('[data-score]').forEach(function(e){e.oninput=function(){state.items[+e.dataset.score].score=e.value}});document.querySelectorAll('[data-obs]').forEach(function(e){e.oninput=function(){state.items[+e.dataset.obs].observation=e.value}});document.querySelectorAll('[data-hw]').forEach(function(e){e.onchange=function(){state.items[+e.dataset.hw].homework=e.checked}})}
function analysis(){var scored=state.items.filter(function(x){return x.score!==''&&isFinite(+x.score)}),weak=scored.filter(function(x){return +x.score<13}).sort(function(a,b){return +a.score-+b.score}),strong=scored.filter(function(x){return +x.score>=17}).sort(function(a,b){return +b.score-+a.score}),by={};scored.forEach(function(x){by[x.section]??=[];by[x.section].push(+x.score)});var h='<div class="collapse open"><button class="collapse-head" type="button"><span>🧠 Violin Analysis & Suggest</span><span class="chev">▼</span></button><div class="collapse-body"><p class="summary">Analysis is based on today’s teacher scores and observations. It is decision support, not teacher replacement.</p>';if(!scored.length)h+='<div class="diagnosis"><b>No scored items yet.</b><br>Score what you hear first, then run the analysis again.</div>';else{h+='<div class="grid">';Object.keys(by).forEach(function(k){var avg=Math.round(by[k].reduce(function(a,b){return a+b},0)/by[k].length);h+='<div><b>'+esc(k)+'</b><div class="barbg"><div class="bar" style="width:'+avg*5+'%"></div></div><span class="muted">'+avg+'/20</span></div>'});h+='</div>';if(weak.length){h+='<div class="diagnosis" style="margin-top:12px"><div class="priority">🎯 Priority Technical Areas</div>';weak.slice(0,4).forEach(function(x){h+='<div>• <b>'+esc(x.title)+'</b> — '+esc(x.score)+'/20';if(x.observation)h+=' · '+esc(x.observation);h+='</div>'});h+='</div>'}else h+='<div class="card good" style="margin-top:12px">No scored item is currently below 13/20. Continue development and monitor consistency.</div>';if(strong.length){h+='<div style="margin-top:10px"><b>💪 Secure / Strong</b>';strong.slice(0,3).forEach(function(x){h+='<div>• '+esc(x.title)+' — '+esc(x.score)+'/20</div>'});h+='</div>'}}h+='<div class="summary" style="margin-top:12px"><b>AI Suggestion:</b> '+suggestion(weak)+'</div></div></div>';var box=document.getElementById('analysis');box.innerHTML=h;box.classList.remove('hidden');wireCollapses(box)}
function suggestion(weak){if(!weak.length)return'Keep the current plan, then use the next lesson to test consistency under slightly higher coordination or repertoire demand.';var x=weak[0],t=(x.title+' '+x.observation).toLowerCase();if(/bow|détach|spiccat|martel|collé|string crossing/.test(t))return'Primary issue appears to be right-hand / bow-control organisation. Check bow distribution, contact point, bow speed, weight and thumb/finger flexibility before increasing stroke speed.';if(/shift|position|finger|intonation|double stop|octave|tenth/.test(t))return'Primary issue appears to be left-hand coordination. Check finger release, frame, thumb mobility and preparation before adding speed or distance.';if(/rhythm|accent/.test(t))return'Primary issue appears to be rhythmic organisation. Stabilise subdivision and accents before increasing tempo.';return'Repeat the specific weak item with attention to the teacher observation rather than simply adding more repetitions.'}
function save(){var a=readJSON('VIOLIN_AI_LESSONS_V1',[]);if(!Array.isArray(a))a=[];a.push({studentId:state.sid,studentIndex:idx,studentName:name,level:level,term:term,date:new Date().toISOString(),items:state.items,teacherPlan:state.plan});localStorage.setItem('VIOLIN_AI_LESSONS_V1',JSON.stringify(a));alert('Lesson saved.')}
function homework(){var chosen=state.items.filter(function(x){return x.homework||x.score!==''||x.observation});var h={studentId:state.sid,studentIndex:idx,studentName:name,level:level,term:term,sourceLesson:true,createdAt:new Date().toISOString(),items:chosen};localStorage.setItem('VIOLIN_AI_PENDING_HOMEWORK_V1',JSON.stringify(h));var all=readJSON('VIOLIN_AI_HOMEWORK_V1',[]);if(!Array.isArray(all))all=[];all.push(h);localStorage.setItem('VIOLIN_AI_HOMEWORK_V1',JSON.stringify(all));alert('Homework prepared from today’s Lesson plan and assessment.')}
document.getElementById('generate').onclick=generate;document.getElementById('regenerate').onclick=generate;document.getElementById('analysisBtn').onclick=analysis;document.getElementById('save').onclick=save;document.getElementById('homework').onclick=homework;generate();renderPlan();
})();
</script>
</body>
</html>
