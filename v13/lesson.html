<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — Lesson</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0;padding:16px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:16px;margin:12px 0}.item{border:1px solid #e3e7ee;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{width:48px;padding:6px;border:1px solid #ccd3df;border-radius:8px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#24344c;color:#fff}.muted{color:#687487;font-size:13px}.back{background:#eef1f5}.tag{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:3px}.obs{width:100%;min-height:70px;border:1px solid #ccd3df;border-radius:9px;padding:8px;box-sizing:border-box}.empty{padding:20px;color:#687487}.pick{margin-right:6px}</style><script src="./scale-curriculum-data.js"></script><script src="./technical-skills-curriculum-data.js"></script></head><body><div class="wrap"><div class="top"><div><div class="muted">VIOLIN AI</div><h1 id="title">Lesson</h1><div id="meta" class="muted"></div></div><button class="btn back" onclick="history.back()">← Back</button></div><div class="card"><div class="row"><button id="generate" class="btn primary">🤖 AI Generate Lesson</button><button id="save" class="btn">💾 Save Lesson</button><button id="homework" class="btn">🏠 Generate Homework</button></div><p class="muted">Lesson is the teacher's working and assessment environment. Curriculum remains the source of requirements.</p></div><div id="content"></div></div><script>(function(){var p=new URLSearchParams(location.search),studentId=p.get('studentId'),idx=Number(p.get('student'));function students(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}var arr=students(),s=studentId?arr.find(function(x){return String(x.id??x.studentId??x.uid??'')===String(studentId)}):arr[idx],state={items:[]};if(!s){document.getElementById('content').innerHTML='<div class="card empty">Student not found. Open Lesson from the Student page.</div>';return}var level=s.level??s.Level??s.currentLevel??'—',term=s.term??s.Term??1,name=s.name||s.studentName||'Student';document.getElementById('title').textContent='🎓 Lesson — '+name;document.getElementById('meta').textContent='Level '+level+' · Term '+term;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function txt(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.join(' • ');if(typeof v==='object')return Object.keys(v).map(function(k){return k+': '+txt(v[k])}).join(' | ');return String(v)}function cur(type){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1,l=Number(String(level).match(/\d+/)?.[0]||0),t=Number(String(term).match(/[12]/)?.[0]||1);if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);return x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||x[l]?.[t]||null}function add(section,title,detail,source){state.items.push({section,title,detail,source:source||'curriculum',score:'',observation:''})}function render(){var groups={};state.items.forEach(function(x,i){(groups[x.section]||(groups[x.section]=[])).push([x,i])});var h='';Object.keys(groups).forEach(function(g){h+='<div class="card"><h2>'+esc(g)+'</h2>';groups[g].forEach(function(a){var x=a[0],i=a[1];h+='<div class="item"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.detail)+'</div><div class="row"><span>Score</span><input class="score" data-score="'+i+'" type="number" min="0" max="5" value="'+esc(x.score)+'" placeholder="0–5"><span class="tag">Teacher observation</span></div><textarea class="obs" data-obs="'+i+'" placeholder="Observation / diagnostic note...">'+esc(x.observation)+'</textarea></div>'});h+='</div>'});document.getElementById('content').innerHTML=h;document.querySelectorAll('[data-score]').forEach(function(e){e.oninput=function(){state.items[+e.dataset.score].score=e.value}});document.querySelectorAll('[data-obs]').forEach(function(e){e.oninput=function(){state.items[+e.dataset.obs].observation=e.value}})}function previous(){try{return JSON.parse(localStorage.getItem('VIOLIN_AI_HOMEWORK_V1')||'[]')}catch(e){return[]}}function generate(){state.items=[];var sc=cur('scale'),tc=cur('tech');add('Warm-up','Warm-up — 5 min','Use previous homework and recent observations as the starting point.','previous');if(sc){['major','minor','arpeggios','dominant7','diminished7','chromatic','doubleStops','bowing','articulation','rhythm'].forEach(function(k){if(sc[k]!==undefined&&sc[k]!==null&&sc[k]!=='')add('Scales',k,txt(sc[k]))})}else add('Scales','Curriculum Scales','Select today’s scales from the Student page.');if(tc){Object.keys(tc).forEach(function(k){if(Array.isArray(tc[k])&&tc[k].length)add('Technique',k,txt(tc[k]))})}else add('Technique','Technical Skills','Prioritise current technical gaps.');add('Études','Current Étude — 5–10 min','Review the assigned étude and assess preparation.');add('Repertoire','Current Repertoire','Listen, observe and record musical and technical findings.');render()}function save(){var a;try{a=JSON.parse(localStorage.getItem('VIOLIN_AI_LESSONS_V1')||'[]')}catch(e){a=[]}a.push({studentId:studentId||s.id||s.studentId||null,studentIndex:idx,studentName:name,level:level,term:term,date:new Date().toISOString(),items:state.items});localStorage.setItem('VIOLIN_AI_LESSONS_V1',JSON.stringify(a));alert('Lesson saved.')}document.getElementById('generate').onclick=generate;document.getElementById('save').onclick=save;document.getElementById('homework').onclick=function(){var h={studentId:studentId||s.id||s.studentId||null,studentName:name,sourceLesson:true,createdAt:new Date().toISOString(),items:state.items.filter(function(x){return x.score||x.observation})};localStorage.setItem('VIOLIN_AI_PENDING_HOMEWORK_V1',JSON.stringify(h));alert('Lesson assessment prepared for Homework.');};generate()})();</script></body></html>
