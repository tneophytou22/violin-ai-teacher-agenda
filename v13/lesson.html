<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233d"><title>VIOLIN AI — Lesson</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0;padding:16px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #14233d0b}.item{border:1px solid #e3e7ee;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#24344c;color:#fff}.purple{background:#7451d9;color:#fff}.mint{background:#64c6a3;color:#12372c}.gold{background:#e6c25f;color:#473b15}.back{background:#eef1f5}.muted{color:#687487;font-size:13px}.tag{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:3px}.score{width:58px;padding:7px;border:1px solid #ccd3df;border-radius:8px;font-weight:700}.obs{width:100%;min-height:65px;border:1px solid #ccd3df;border-radius:9px;padding:8px;box-sizing:border-box;margin-top:8px}.empty{padding:20px;color:#687487}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.summary{background:linear-gradient(135deg,#f4f0ff,#fff);border:1px solid #dfd4ff;border-radius:14px;padding:14px}.summary h3{margin:0 0 8px}.suggest{background:#f2fbf7;border:1px solid #d8f1e7;border-radius:12px;padding:12px;margin:8px 0}.warning{background:#fff8df;border:1px solid #eadba3;border-radius:12px;padding:12px;margin:8px 0}.analysis{white-space:pre-wrap;background:#faf9ff;border:1px solid #e5defb;border-radius:12px;padding:13px;line-height:1.5}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.mini{font-size:12px}.check{width: </style><script src="./scale-curriculum-data.js"></script><script src="./technical-skills-curriculum-data.js"></script></head><body><div class="wrap"><div class="top"><div><div class="muted">VIOLIN AI · TEACHER WORKSPACE</div><h1 id="title">Lesson</h1><div id="meta" class="muted"></div></div><button class="btn back" onclick="history.back()">← Back</button></div><div class="card"><div class="row"><button id="generate" class="btn primary">🤖 AI Generate Lesson</button><button id="regenerate" class="btn purple">🔄 Regenerate</button><button id="analyze" class="btn">🧠 Violin Analysis & Suggest</button><button id="save" class="btn">💾 Save Lesson</button><button id="homework" class="btn mint">🏠 Create Homework from Plan</button></div><p class="muted">Lesson is the teacher's working and assessment environment. Curriculum supplies requirements; previous homework and lesson history shape today's suggestions. The teacher remains in control.</p></div><div id="suggestions"></div><div id="content"></div><div id="analysisBox"></div></div><script>(function(){'use strict';var p=new URLSearchParams(location.search),studentId=p.get('studentId'),idx=Number(p.get('student'));function readStudents(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}var arr=readStudents(),s=studentId?arr.find(function(x){return String(x.id??x.studentId??x.uid??'')===String(studentId)}):arr[idx],state={items:[],generated:false};if(!s){document.getElementById('content').innerHTML='<div class="card empty">Student not found. Open Lesson from the Student page.</div>';return}var level=s.level??s.Level??s.currentLevel??'—',term=s.term??s.Term??s.currentTerm??1,name=s.name||s.studentName||'Student',sid=studentId||s.id||s.studentId||null;document.getElementById('title').textContent='🎓 Lesson — '+name;document.getElementById('meta').textContent='Level '+level+' · Term '+term;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function txt(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return typeof x==='object'?txt(x):String(x)}).join(' • ');if(typeof v==='object')return Object.keys(v).map(function(k){return k+': '+txt(v[k])}).join(' | ');return String(v)}function n(v){var m=String(v==null?'':v).match(/\d+/);return m?Number(m[0]):0}function curriculum(type){var x=type==='scale'?window.VIOLIN_SCALE_CURRICULUM_V1:window.VIOLIN_TECHNICAL_SKILLS_CURRICULUM_V1,l=n(level),t=n(term)||1;if(!x)return null;if(typeof x.getTerm==='function')return x.getTerm(l,t);return x.levels?.[l]?.[t]||x.terms?.[l]?.[t]||x[l]?.[t]||null}function readJSON(key,fallback){try{var v=JSON.parse(localStorage.getItem(key)||'null');return v==null?fallback:v}catch(e){return fallback}}function previousHomework(){var all=readJSON('VIOLIN_AI_HOMEWORK_V1',[]);if(!Array.isArray(all))return all? [all]:[];var matches=all.filter(function(x){return !sid||String(x.studentId??x.id??'')===String(sid)});return matches.length?matches:all}function previousLessons(){var all=readJSON('VIOLIN_AI_LESSONS_V1',[]);if(!Array.isArray(all))return[];return all.filter(function(x){return !sid||String(x.studentId??x.id??'')===String(sid)})}function selectedPlan(){var keys=['VIOLIN_AI_LESSON_SELECTION_V1','VIOLIN_AI_DAILY_PLAN_V1','VIOLIN_AI_PENDING_LESSON_V1'];for(var i=0;i<keys.length;i++){var v=readJSON(keys[i],null);if(!v)continue;var items=Array.isArray(v)?v:v.items;if(Array.isArray(items)&&items.length)return items}return []}function getScaleItems(c){var out=[];if(!c)return out;[['major','Major Scales'],['minor','Minor Scales'],['arpeggios','Tonic Arpeggios'],['dominant7','Dominant 7th'],['diminished7','Diminished 7th'],['chromatic','Chromatic Scales'],['doubleStops','Double Stops'],['oneString','Scales on One String'],['positions','Position Requirements'],['bowing','Bowing Patterns'],['articulation','Articulation'],['rhythm','Rhythmic Variations'],['patterns','Patterns'],['accents','Accent Patterns'],['dynamics','Dynamics'],['octaves','Octaves'],['tempo','Target Tempo']].forEach(function(f){if(c[f[0]]!==undefined&&c[f[0]]!==null&&c[f[0]]!=='')out.push({title:f[1],detail:txt(c[f[0]]),section:'Scales',source:'curriculum'})});return out}function getTechItems(c){var out=[];if(!c)return out;[['left','LEFT HAND'],['thumb','THUMB / HAND ORGANISATION'],['right','RIGHT HAND / BOW ARM'],['bowDivision','BOW DIVISION'],['strokes','ARTICULATION / BOW STROKES'],['doubleStops','DOUBLE STOPS'],['accents','RHYTHMIC ACCENTS'],['coordination','COORDINATION']].forEach(function(f){var v=c[f[0]];if(v&&((Array.isArray(v)&&v.length)||(!Array.isArray(v)&&v!=='') ))out.push({title:f[1],detail:txt(v),section:'Technique',source:'curriculum'})});return out}function add(section,title,detail,source,minutes){state.items.push({section:section,title:title,detail:detail,source:source||'curriculum',minutes:minutes||5,score:'',observation:'',selected:true})}function renderSuggestions(){var hw=previousHomework(),less=previousLessons(),sel=selectedPlan(),h='';h+='<div class="grid">';h+='<div class="summary"><h3>📚 Previous Homework</h3><div class="mini">'+(hw.length?'Found '+hw.length+' saved homework record(s). Today\'s lesson starts from the latest available work.':'No saved homework found yet.')+'</div></div>';h+='<div class="summary"><h3>📝 Lesson History</h3><div class="mini">'+(less.length?'Found '+less.length+' previous lesson(s).':'No previous lesson history yet.')+'</div></div>';h+='<div class="summary"><h3>🎯 Teacher Selection</h3><div class="mini">'+(sel.length?'A selected plan was found and will be used as the starting point.':'No selected lesson plan found; AI will build one from curriculum + homework.')+'</div></div></div>';document.getElementById('suggestions').innerHTML=h}function render(){var groups={};state.items.forEach(function(x,i){(groups[x.section]||(groups[x.section]=[])).push([x,i])});var h='';Object.keys(groups).forEach(function(g){h+='<div class="card"><div class="section-title"><h2>'+esc(g)+'</h2><span class="tag">Teacher assessment</span></div>';groups[g].forEach(function(a){var x=a[0],i=a[1];h+='<div class="item '+(x.done?'done':'')+'"><div class="row"><input class="check" type="checkbox" data-pick="'+i+'" '+(x.selected?'checked':'')+'><b>'+esc(x.title)+'</b><span class="tag">'+esc(x.source||'curriculum')+'</span><span class="tag">'+esc(x.minutes)+' min</span></div><div class="muted">'+esc(x.detail)+'</div><div class="row" style="margin-top:8px"><span>Score /20</span><input class="score" data-score="'+i+'" type="number" min="0" max="20" value="'+esc(x.score)+'" placeholder="—"><span class="status">'+(x.score!==''?'ASSESSED':'NOT ASSESSED')+'</span></div><textarea class="obs" data-obs="'+i+'" placeholder="Observation / diagnostic note...">'+esc(x.observation)+'</textarea></div>'});h+='</div>'});document.getElementById('content').innerHTML=h;document.querySelectorAll('[data-score]').forEach(function(e){e.oninput=function(){var x=state.items[+e.dataset.score];x.score=e.value;var st=e.parentElement.querySelector('.status');if(st)st.textContent=e.value!==''?'ASSESSED':'NOT ASSESSED'}});document.querySelectorAll('[data-obs]').forEach(function(e){e.oninput=function(){state.items[+e.dataset.obs].observation=e.value}});document.querySelectorAll('[data-pick]').forEach(function(e){e.onchange=function(){state.items[+e.dataset.pick].selected=e.checked}})}function generate(){state.items=[];var sc=curriculum('scale'),tc=curriculum('tech'),sel=selectedPlan(),hw=previousHomework(),latest=hw.length?hw[hw.length-1]:null;renderSuggestions();if(sel.length){sel.forEach(function(x){add(x.section||x.category||'Lesson',x.title||x.name||'Selected item',txt(x.detail||x.description||x.value||''),'teacher selection',x.minutes||5)})}else{add('Warm-up','Warm-up — 5 min',latest?'Start from previous homework and today's observed needs.':'Level-appropriate activation.','previous homework',5);getScaleItems(sc).forEach(function(x){add(x.section,x.title,x.detail,x.source,8)});getTechItems(tc).slice(0,6).forEach(function(x){add(x.section,x.title,x.detail,x.source,8)});add('Études','Current Étude — 5–10 min','Review the assigned étude and assess preparation.','curriculum',10);add('Repertoire','Current Repertoire','Listen, observe and record musical and technical findings.','curriculum',12)}state.generated=true;render();document.getElementById('analysisBox').innerHTML=''}function regenerate(){generate();alert('Lesson regenerated from the latest curriculum, homework, teacher selection and available lesson history.')}function analyze(){var assessed=state.items.filter(function(x){return x.score!==''}),weak=assessed.filter(function(x){return Number(x.score)<13}).sort(function(a,b){return Number(a.score)-Number(b.score)}),strong=assessed.filter(function(x){return Number(x.score)>=17}).sort(function(a,b){return Number(b.score)-Number(a.score)}),issues=[];assessed.forEach(function(x){var o=(x.observation||'').toLowerCase();if(/thumb|αντίχει/.test(o))issues.push('Thumb / hand organisation → check mobility, relaxation, coordination and adaptation.');if(/pressure|πίεσ|tension|ένταση/.test(o))issues.push('Possible tension / excessive pressure → inspect the underlying bow or left-hand organisation before assigning more repetitions.');if(/contact point|sounding point|σημείο/.test(o))issues.push('Bow contact-point control → verify before increasing bow speed.');if(/elbow|αγκώνα/.test(o))issues.push('Right-elbow organisation → inspect arm level and string-crossing mechanics.');if(/intonation|inton/.test(o))issues.push('Intonation issue → identify position/finger/shifting source before simply increasing repetitions.');});var lines=['🧠 VIOLIN ANALYSIS & SUGGEST','',name+' · Level '+level+' · Term '+term,''];if(!assessed.length){lines.push('No scored items yet. Enter lesson scores and observations, then run the analysis.')}else{if(weak.length){lines.push('🎯 PRIMARY PRIORITIES');weak.slice(0,5).forEach(function(x){lines.push('• '+x.title+' — '+x.score+'/20')});lines.push('')}if(issues.length){lines.push('🔎 POSSIBLE ROOT CAUSES');Array.from(new Set(issues)).slice(0,6).forEach(function(x){lines.push('• '+x)});lines.push('')}if(strong.length){lines.push('💪 SECURE / KEEP DEVELOPING');strong.slice(0,4).forEach(function(x){lines.push('• '+x.title+' — '+x.score+'/20')});lines.push('')}lines.push('NEXT SUGGESTED ACTION');if(weak.length)lines.push('• Revisit the lowest-scoring requirement first. Diagnose the cause before adding volume.');else lines.push('• Maintain current work and use repertoire transfer to confirm consistency.')}document.getElementById('analysisBox').innerHTML='<div class="card"><div class="analysis">'+esc(lines.join('\n'))+'</div></div>'}function save(){var a=readJSON('VIOLIN_AI_LESSONS_V1',[]);if(!Array.isArray(a))a=[];a.push({studentId:sid,studentIndex:idx,studentName:name,level:level,term:term,date:new Date().toISOString(),items:state.items});localStorage.setItem('VIOLIN_AI_LESSONS_V1',JSON.stringify(a));alert('Lesson saved.')}function createHomework(){var selected=state.items.filter(function(x){return x.selected!==false});var hw={id:String(Date.now()),studentId:sid,studentName:name,level:level,term:term,source:'lesson',createdAt:new Date().toISOString(),items:selected.map(function(x){return{section:x.section,title:x.title,detail:x.detail,minutes:x.minutes,score:x.score,observation:x.observation,homework:true}})};var all=readJSON('VIOLIN_AI_HOMEWORK_V1',[]);if(!Array.isArray(all))all=[];all.push(hw);localStorage.setItem('VIOLIN_AI_HOMEWORK_V1',JSON.stringify(all));localStorage.setItem('VIOLIN_AI_PENDING_HOMEWORK_V1',JSON.stringify(hw));alert('Homework created from the selected Lesson Plan. It is ready for the Homework page / message workflow.')}document.getElementById('generate').onclick=generate;document.getElementById('regenerate').onclick=regenerate;document.getElementById('analyze').onclick=analyze;document.getElementById('save').onclick=save;document.getElementById('homework').onclick=createHomework;generate()})();</script></body></html>
