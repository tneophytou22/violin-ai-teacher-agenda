<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — Lesson</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0;padding:16px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:16px;margin:12px 0}.item{border:1px solid #e3e7ee;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{width:48px;padding:6px;border:1px solid #ccd3df;border-radius:8px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#24344c;color:#fff}.muted{color:#687487;font-size:13px}.back{background:#eef1f5}.tag{display:inline-block;background:#eef1f5;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:3px}.obs{width:100%;min-height:70px;border:1px solid #ccd3df;border-radius:9px;padding:8px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.empty{padding:20px;color:#687487}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">VIOLIN AI</div><h1 id="title">Lesson</h1><div id="meta" class="muted"></div></div><button class="btn back" onclick="history.back()">← Back</button></div><div class="card"><div class="row"><button id="generate" class="btn primary">🤖 AI Generate Lesson</button><button id="save" class="btn">💾 Save Lesson</button><button id="homework" class="btn">🏠 Generate Homework</button></div><p class="muted">The lesson suggestion uses the student's previous homework, curriculum, and saved lesson history. The teacher remains in control.</p></div><div id="content"></div></div><script>(function(){var params=new URLSearchParams(location.search),idx=Number(params.get('student'));function read(){try{var d=JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10')||'{}');return Array.isArray(d.students)?d.students:[]}catch(e){return[]}}var students=read(),s=students[idx];if(!s){document.getElementById('content').innerHTML='<div class="card empty">Student not found. Open Lesson from a student profile.</div>';return}var level=s.level??s.Level??s.currentLevel??'—',term=s.term??s.Term??1,name=s.name||s.studentName||'Student';document.getElementById('title').textContent='🎓 Lesson — '+name;document.getElementById('meta').textContent='Level '+level+' · Term '+term;var state={items:[],generated:false};function save(){var all;try{all=JSON.parse(localStorage.getItem('VIOLIN_AI_LESSONS_V1')||'[]')}catch(e){all=[]}all.push({studentIndex:idx,studentName:name,level:level,term:term,date:new Date().toISOString(),items:state.items});localStorage.setItem('VIOLIN_AI_LESSONS_V1',JSON.stringify(all));alert('Lesson saved.')}function add(section,title,detail){state.items.push({section,title,detail,score:'',observation:''})}function render(){var groups={};state.items.forEach(function(x,i){(groups[x.section]||(groups[x.section]=[])).push([x,i])});var h='';Object.keys(groups).forEach(function(g){h+='<div class="card"><h2>'+g+'</h2>';groups[g].forEach(function(pair){var x=pair[0],i=pair[1];h+='<div class="item"><b>'+x.title+'</b><div class="muted">'+x.detail+'</div><div class="row"><span>Score</span><input class="score" data-score="'+i+'" type="number" min="0" max="5" value="'+x.score+'" placeholder="0–5"><span class="tag">Teacher observation</span></div><textarea class="obs" data-obs="'+i+'" placeholder="Observation / diagnostic note...">'+(x.observation||'')+'</textarea></div>'});h+='</div>'});document.getElementById('content').innerHTML=h||'<div class="card empty">No lesson items yet. Use AI Generate Lesson or add items from the Student page.</div>';document.querySelectorAll('[data-score]').forEach(function(e){e.oninput=function(){state.items[Number(e.dataset.score)].score=e.value}});document.querySelectorAll('[data-obs]').forEach(function(e){e.oninput=function(){state.items[Number(e.dataset.obs)].observation=e.value}})}function generate(){state.items=[];add('Warm-up','Warm-up — 5 min','Review areas suggested by previous lesson/homework.');add('Scales','Curriculum Scales','Use the scales selected from the Student → Scales page; check intonation, rhythm, bow control and shifting.');add('Technique','Technical Skills','Prioritise current technical gaps from the Technical Skills curriculum and mastery profile.');add('Études','Étude — 5–10 min','Review the current étude/homework and assess progress.');add('Repertoire','Repertoire','Listen to assigned repertoire and record musical/technical observations.');state.generated=true;render()}document.getElementById('generate').onclick=generate;document.getElementById('save').onclick=save;document.getElementById('homework').onclick=function(){alert('Homework generation will use the saved Lesson assessment as its next input.');};generate()})();</script></body></html>
