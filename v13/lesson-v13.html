<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>VIOLIN AI — Lesson V13</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#24344c;font-family:Arial,sans-serif;padding:18px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.muted{color:#687487;font-size:13px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 24px #14233d0d}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#24344c;color:#fff}.danger{background:#df6873;color:#fff}.ghost{background:#eef1f5;color:#24344c}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title h2{margin:0}.curriculum{border:1px solid #dfd4ff;background:#faf8ff;border-radius:15px;padding:13px;margin:10px 0}.curriculum h3{margin:0 0 8px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pick{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #e2e5eb;border-radius:10px;padding:9px}.pick input{width:18px;height:18px;margin-top:2px}.pick b{font-size:13px}.details{margin-top:12px;border-top:1px solid #eeeef3;padding-top:12px}.details-title{font-size:12px;font-weight:800;color:#59667a;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.detail{background:#fff;border:1px solid #e2e5eb;border-radius:10px;padding:9px}.detail .label{font-size:10px;font-weight:800;color:#687487;text-transform:uppercase}.detail .value{font-size:12px;margin-top:3px;line-height:1.35}.note{margin-top:10px;padding:10px;background:#fff;border:1px solid #e2e5eb;border-radius:10px;font-size:12px;line-height:1.4}.empty{text-align:center;color:#687487;padding:24px}@media(max-width:800px){.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){body{padding:10px}.grid,.detail-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">VIOLIN AI · V13</div><h1 id="title">🎓 Lesson</h1><div id="meta" class="muted"></div></div><button class="btn ghost" onclick="history.back()">← Back</button></div><div class="card"><div class="toolbar"><button id="save" class="btn primary">💾 Save Lesson</button><button id="clear" class="btn danger">Clear Lesson Selection</button></div><p class="muted">The Lesson receives only the curriculum items explicitly selected by the teacher.</p></div><div id="curricula" class="card"></div><div class="card"><div class="section-title"><h2>🎯 Today's Teacher Plan</h2></div><div id="plan"></div></div></div><script>(function(){'use strict';const q=new URLSearchParams(location.search),studentId=String(q.get('studentId')||''),selectionRaw=q.get('selection')||'';function read(k,f){try{const x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}function agenda(){const x=read('VIOLIN_AI_AGENDA_V10',{});return Array.isArray(x?.students)?x.students:Array.isArray(x)?x:[]}function sid(s){return String(s?.id??s?.studentId??s?.uid??'')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function norm(x){if(typeof x==='string')return{curriculum:'scales',category:'Scales',title:x,requirements:{}};x=x||{};return{curriculum:x.curriculum||'scales',category:x.category||'Scales',title:x.title||x.name||'Selected item',id:x.id||null,level:x.level,term:x.term,requirements:x.requirements||{},objective:x.objective,mastery:x.mastery,source:x.source}}function parseExplicit(){if(!selectionRaw)return null;let raw=selectionRaw;for(let i=0;i<3;i++){try{const p=JSON.parse(raw);if(String(p.studentId)===studentId&&p.kind==='lesson'&&Array.isArray(p.items)&&p.items.length)return p;return null}catch(e){try{const d=decodeURIComponent(raw);if(d===raw)break;raw=d}catch(e2){break}}}return null}const explicit=parseExplicit();let student=agenda().find(s=>sid(s)===studentId);if(!student&&explicit)student={id:studentId,studentId,name:explicit.studentName||'Student',studentName:explicit.studentName||'Student',level:explicit.level||1,term:explicit.term||1};if(!student){document.body.innerHTML='<div class="wrap"><div class="card empty">Student not found.</div></div>';return}const name=student.name||student.studentName||explicit?.studentName||'Student',level=Number(String(student.level??explicit?.level??1).match(/\d+/)?.[0]||1),term=Number(String(student.term??explicit?.term??1).match(/\d+/)?.[0]||1);document.getElementById('title').textContent='🎓 Lesson — '+name;document.getElementById('meta').textContent='Level '+level+' · Term '+term;let items=explicit?explicit.items.map(norm):[];if(!items.length){const db=read('VIOLIN_AI_CURRICULUM_SELECTION_V2',{}),p=db?.[studentId]?.lesson?.scales;if(p?.studentId===studentId&&Array.isArray(p.items))items=p.items.map(norm)}if(!items.length){const p=read('VIOLIN_AI_LESSON_SELECTION_V1',null);if(p?.studentId===studentId&&p.kind==='lesson'&&Array.isArray(p.items))items=p.items.map(norm)}if(explicit){const db=read('VIOLIN_AI_CURRICULUM_SELECTION_V2',{});db[studentId]=db[studentId]&&typeof db[studentId]==='object'?db[studentId]:{};db[studentId].lesson=db[studentId].lesson&&typeof db[studentId].lesson==='object'?db[studentId].lesson:{};db[studentId].lesson.scales={...explicit,items};write('VIOLIN_AI_CURRICULUM_SELECTION_V2',db);write('VIOLIN_AI_LESSON_ACTIVE_V13',{...explicit,items,receivedAt:new Date().toISOString()})}function arr(v){if(Array.isArray(v))return v.filter(Boolean).map(String);return v==null||v===''?[]:[String(v)]}function octaves(x){const r=x.requirements||{};if(r.octaves)return r.octaves;const m=String(x.title||'').match(/\b\d+(?:\s*[–-]\s*\d+)?\s*octaves?\b/i);return m?m[0]:''}function detail(x){const r=x.requirements||{},fields=[['Octaves',octaves(x)],['Positions',r.positions],['Bowing',arr(r.bowing).join(' · ')],['Articulation',arr(r.articulation).join(' · ')],['Rhythm',arr(r.rhythmicGroups??r.rhythm).join(' · ')],['Accents',arr(r.accents).join(' · ')],['Dynamics',arr(r.dynamics).join(' · ')],['Tempo',r.tempo]];const shown=fields.filter(f=>f[1]!==''&&f[1]!=null);let h=shown.length?'<div class="details"><div class="details-title">Scale technical requirements</div><div class="detail-grid">'+shown.map(f=>'<div class="detail"><div class="label">'+esc(f[0])+'</div><div class="value">'+esc(f[1])+'</div></div>').join('')+'</div></div>':'';if(x.objective)h+='<div class="note"><b>Objective:</b> '+esc(x.objective)+'</div>';if(x.mastery)h+='<div class="note"><b>Mastery:</b> '+esc(x.mastery)+'</div>';return h}function render(){const c=document.getElementById('curricula');if(!items.length){c.innerHTML='<div class="section-title"><h2>📚 Selected Curriculum</h2></div><div class="empty">No curriculum items were received for this lesson.</div>';document.getElementById('plan').innerHTML='<div class="empty">Nothing to plan.</div>';return}const groups={};items.forEach(x=>(groups[x.curriculum]??=[]).push(x));let h='<div class="section-title"><h2>📚 Selected Curriculum</h2><span class="muted">'+items.length+' selected</span></div>';Object.entries(groups).forEach(([g,a])=>{h+='<section class="curriculum"><h3>🎼 '+esc(g==='scales'?'Scales':g)+'</h3><div class="grid">'+a.map(x=>'<div class="pick"><input type="checkbox" checked disabled><span><b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.category)+'</span></span></div>'+detail(x)).join('')+'</div></section>'});c.innerHTML=h;document.getElementById('plan').innerHTML=items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid #f0f1f4"><b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.category)+'</span></div>').join('')}render();document.getElementById('save').onclick=()=>{write('VIOLIN_AI_LESSON_ACTIVE_V13',{studentId,studentName:name,level,term,kind:'lesson',curriculum:'scales',items,updatedAt:new Date().toISOString()});alert('Lesson saved.')};document.getElementById('clear').onclick=()=>{if(!confirm('Clear this lesson selection?'))return;const db=read('VIOLIN_AI_CURRICULUM_SELECTION_V2',{});if(db[studentId]?.lesson)delete db[studentId].lesson.scales;write('VIOLIN_AI_CURRICULUM_SELECTION_V2',db);location.reload()};})();</script></body></html>
