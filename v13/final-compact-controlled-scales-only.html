<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 COMPACT CONTROLLED SCALES ONLY</title><style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./final-compact-controlled.html?v=scales-only-10"></iframe><script>(function(){'use strict';var root=document.getElementById('app'),timer;function css(d){if(d.getElementById('v13scalesonlycss'))return;var s=d.createElement('style');s.id='v13scalesonlycss';s.textContent=`#v13fixscale.v13scalesonly-hidden{display:none!important}.v13scalesonly-visible{display:block!important}`;d.head.appendChild(s)}function text(b){return ((b&&b.textContent)||'').replace(/\s+/g,' ').trim().toUpperCase()}function isScalesButton(b){var t=text(b);return t==='SCALES'||t.includes('SCALES')&&!t.includes('SCALE CURRICULUM')}function activeScales(doc){var tabs=doc.querySelector('.tabs');if(!tabs)return false;var bs=[...tabs.querySelectorAll('button')];var b=bs.find(isScalesButton);if(!b)return false;var cls=(b.className||'').toString().toLowerCase();return b.getAttribute('aria-selected')==='true'||b.getAttribute('data-active')==='true'||/active|selected|current/.test(cls)||b.getAttribute('aria-current')==='page'}function bindTabs(doc){var tabs=doc.querySelector('.tabs');if(!tabs)return;[...tabs.querySelectorAll('button')].forEach(function(b){if(b.dataset.v13scalesBound==='1')return;if(!isScalesButton(b)&&text(b).includes('LESSON')){b.dataset.v13scalesBound='1';return}b.dataset.v13scalesBound='1';b.addEventListener('click',function(){setTimeout(function(){update(doc)},30);setTimeout(function(){update(doc)},180)},{capture:true})})}function update(doc){try{if(!doc||!doc.body)return;css(doc);var card=doc.getElementById('v13fixscale');if(!card)return;bindTabs(doc);var tabs=doc.querySelector('.tabs');if(!tabs)return;var bs=[...tabs.querySelectorAll('button')];var scale=bs.find(isScalesButton);var visible=scale?((scale.getAttribute('aria-selected')==='true'||scale.getAttribute('data-active')==='true'||/active|selected|current/i.test((scale.className||'').toString())||scale.getAttribute('aria-current')==='page')):false;if(!visible){var heads=[...doc.querySelectorAll('h1,h2,h3')].map(x=>text(x));visible=heads.some(x=>x==='SCALES'||x.includes('SCALES ·')||x.includes('SCALES —'))}card.classList.toggle('v13scalesonly-hidden',!visible)}catch(e){}}function walk(d){try{if(!d||!d.body)return;update(d);[...d.querySelectorAll('iframe')].forEach(function(f){try{walk(f.contentDocument)}catch(e){}})}catch(e){}}function run(){clearTimeout(timer);timer=setTimeout(function(){try{walk(root.contentDocument)}catch(e){}},80)}root.addEventListener('load',run);setInterval(run,500);run()})();</script></body></html>
