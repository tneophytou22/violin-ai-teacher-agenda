<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOLIN AI — Homework V13</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#24344c;font-family:Arial,sans-serif;padding:18px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.muted{color:#687487;font-size:13px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 24px #14233d0d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#24344c;color:#fff}.mint{background:#64c6a3;color:#12372c}.purple{background:#7451d9;color:#fff}.viber{background:#7463d6;color:#fff}..ghost{background:#eef1f5;color:#24344c}.danger{background:#df6873;color:#fff}.hero{background:linear-gradient(135deg,#f4f0ff,#fff);border:1px solid #dfd4ff;border-radius:16px;padding:15px}.hero h2{margin:0 0 5px}.task{border:1px solid #e2e5eb;border-radius:14px;padding:13px;margin:9px 0;background:#fff}.task-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.task-title{font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:800}.minutes{width:70px;padding:7px;border:1px solid #d7dce5;border-radius:9px;font-weight:800}.task textarea{margin-top:8px;min-height:58px;width:100%;padding:9px;border:1px solid #d7dce5;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{border:1px solid #e5e8ee;border-radius:14px;padding:12px}.panel h3{margin:0 0 8px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#f0eff7;margin:2px;font-size:11px}.message{white-space:pre-wrap;background:#fafafa;border:1px solid #e3e6ec;border-radius:12px;padding:13px;line-height:1.45}.notice{background:#fff8df;border:1px solid #eadba3;border-radius:12px;padding:11px}.empty{text-align:center;color:#687487;padding:24px}@media(max-width:700px){body{padding:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="muted">VIOLIN AI · V13</div><h1 id="title">🏠 Homework</h1><div id="meta" class="muted"></div></div>
    <button class="btn ghost" onclick="history.back()">← Back</button>
  </div>

  <div class="card hero">
    <h2>🤖 AI Homework Designer</h2>
    <div class="muted">The selected lesson items are the source. VIOLIN AI turns them into a short, clear and encouraging home-practice plan.</div>
  </div>

  <div id="source" class="card"></div>

  <div class="card">
    <div class="toolbar">
      <button id="generate" class="btn purple">✨ Create Homework with AI</button>
      <button id="save" class="btn primary">💾 Save Homework</button>
      <button id="copy" class="btn mint">📋 Copy Viber Message</button>
      <button id="clear" class="btn danger">Clear Homework</button>
    </div>
    <div class="notice" style="margin-top:10px">Simple rule: the teacher chooses <b>what</b> to practise; AI organises <b>how</b> to practise it. It does not invent curriculum requirements.</div>
  </div>

  <div id="tasks" class="card"></div>
  <div id="parent" class="card"></div>
  <div id="viber" class="card"></div>
</div>

<script>
(function(){
'use strict';
const q=new URLSearchParams(location.search);
const studentId=String(q.get('studentId')||'');
const enc=q.get('selection')||'';
function read(k,f){try{const x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function decodeSelection(raw){if(!raw)return null;let s=raw;for(let i=0;i<4;i++){try{let p=JSON.parse(s);if(p&&p.kind==='lesson'&&Array.isArray(p.items))return p}catch(e){}try{let d=decodeURIComponent(s);if(d===s)break;s=d}catch(e){break}}return null}
function norm(x){if(typeof x==='string')return{curriculum:'scales',category:'Scales',title:x,requirements:{}};x=x||{};return{curriculum:x.curriculum||'scales',category:x.category||'Scales',title:x.title||x.name||'Selected item',id:x.id||null,requirements:x.requirements||{},objective:x.objective,mastery:x.mastery,source:x.source,level:x.level,term:x.term}}
function agenda(){const x=read('VIOLIN_AI_AGENDA_V10',{});return Array.isArray(x?.students)?x.students:Array.isArray(x)?x:[]}
function sid(s){return String(s?.id??s?.studentId??s?.uid??'')}
let explicit=decodeSelection(enc);
let student=agenda().find(s=>sid(s)===studentId);
if(!student&&explicit)student={id:studentId,name:explicit.studentName||'Student',level:explicit.level||1,term:explicit.term||1};
if(!student){document.body.innerHTML='<div class="wrap"><div class="card empty">Student not found.</div></div>';return}
const name=student.name||student.studentName||explicit?.studentName||'Student';
const level=Number(String(student.level??explicit?.level??1).match(/\d+/)?.[0]||1);
const term=Number(String(student.term??explicit?.term??1).match(/\d+/)?.[0]||1);
let items=(explicit?.items||[]).map(norm);
if(!items.length){const active=read('VIOLIN_AI_LESSON_ACTIVE_V13',null);if(active?.studentId===studentId&&Array.isArray(active.items))items=active.items.map(norm)}
if(!items.length){const db=read('VIOLIN_AI_CURRICULUM_SELECTION_V2',{}),p=db?.[studentId]?.lesson?.scales;if(p?.studentId===studentId&&Array.isArray(p.items))items=p.items.map(norm)}
let homework=read('VIOLIN_AI_HOMEWORK_V1',{})?.[studentId]||null;
let tasks=Array.isArray(homework?.tasks)?homework.tasks:[];
function reqText(x){const r=x.requirements||{};let a=[];if(r.octaves)a.push('Octaves: '+r.octaves);if(r.positions)a.push('Positions: '+r.positions);if(r.bowing)a.push('Bowing: '+(Array.isArray(r.bowing)?r.bowing.join(' · '):r.bowing));if(r.articulation)a.push('Articulation: '+(Array.isArray(r.articulation)?r.articulation.join(' · '):r.articulation));if(r.rhythmicGroups||r.rhythm)a.push('Rhythm: '+(Array.isArray(r.rhythmicGroups||r.rhythm)?(r.rhythmicGroups||r.rhythm).join(' · '):(r.rhythmicGroups||r.rhythm)));if(r.accents)a.push('Accents: '+(Array.isArray(r.accents)?r.accents.join(' · '):r.accents));if(r.dynamics)a.push('Dynamics: '+(Array.isArray(r.dynamics)?r.dynamics.join(' · '):r.dynamics));if(r.tempo)a.push('Tempo: '+r.tempo);return a}
function targetMinutes(){return level<=2?25:level<=4?35:level<=6?45:level<=8?55:65}
function aiDesign(){
 const source=items.length?items:[{title:'Teacher-selected lesson work',category:'General',requirements:{}}];
 let out=[];
 const scale=source.filter(x=>String(x.category).toLowerCase().includes('scale')||String(x.curriculum).toLowerCase()==='scales');
 const technique=source.filter(x=>/technique|technical/i.test(String(x.category)));
 const etude=source.filter(x=>/étude|etude/i.test(String(x.category)));
 const repertoire=source.filter(x=>/repertoire|piece/i.test(String(x.category)));
 const add=(x,mins,focus)=>out.push({id:'hw-'+Date.now()+'-'+out.length,title:x.title,category:x.category,minutes:mins,focus:focus||'Play carefully and listen to the sound.',sourceId:x.id||null});
 if(scale.length)scale.slice(0,2).forEach((x,i)=>add(x,i?8:10,'Slow, accurate repetitions. Keep the listed scale requirements exactly as assigned.'));
 if(technique.length)technique.slice(0,2).forEach(x=>add(x,8,'Work slowly first, then repeat with relaxed movement and good sound.'));
 if(etude.length)etude.slice(0,2).forEach(x=>add(x,10,'Small sections first. Repeat the difficult passage before playing the whole section.'));
 if(repertoire.length)repertoire.slice(0,2).forEach(x=>add(x,12,'One clear goal for each passage: rhythm, intonation, bow control or musical expression.'));
 source.filter(x=>!scale.includes(x)&&!technique.includes(x)&&!etude.includes(x)&&!repertoire.includes(x)).slice(0,3).forEach(x=>add(x,10,'Focused practice: slow, accurate and repeated.'));
 let sum=out.reduce((a,x)=>a+x.minutes,0),target=targetMinutes();
 while(sum>target&&out.length>2){let i=out.findIndex(x=>x.minutes>7);if(i<0)break;out[i].minutes-=3;sum-=3}
 while(sum<target&&out.length){out[out.length-1].minutes+=Math.min(5,target-sum);sum=out.reduce((a,x)=>a+x.minutes,0)}
 tasks=out;
 homework={studentId,studentName:name,level,term,tasks,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 render();
}
function parentMessage(){
 const mins=tasks.reduce((a,x)=>a+(Number(x.minutes)||0),0);
 return `🎻 VIOLIN AI — ${name}\n\nΑυτή την εβδομάδα ο στόχος είναι μια ήρεμη και σταθερή μελέτη ${mins} λεπτών συνολικά την ημέρα.\n\nΣτο σπίτι βοηθά περισσότερο η ενθάρρυνση παρά η πίεση: ένα ήσυχο σημείο, λίγος χρόνος χωρίς διακοπές και μια μικρή επιβράβευση για την προσπάθεια.\n\n💚 Μικρό μήνυμα προς τον μαθητή:\n«Μπράβο για την προσπάθεια! Δούλεψε αργά, άκου τον ήχο σου και κάνε μικρά βήματα. Η συνέπεια μετρά περισσότερο από την ταχύτητα.»\n\n— VIOLIN AI Teacher Agenda`;
}
function viberMessage(){
 const lines=[`🎻 VIOLIN AI — Homework για ${name}`,`Level ${level} · Term ${term}`,''];
 tasks.forEach((x,i)=>lines.push(`${i+1}. ${x.title} — ${x.minutes}′`,`   ${x.focus}`));
 lines.push('','💚 Θυμήσου: λίγη, ήρεμη και ποιοτική μελέτη κάθε μέρα.','Μπράβο για την προσπάθεια!');
 return lines.join('\n');
}
function render(){
 document.getElementById('title').textContent='🏠 Homework — '+name;
 document.getElementById('meta').textContent='Level '+level+' · Term '+term;
 const source=document.getElementById('source');
 source.innerHTML='<h2 style="margin:0 0 8px">📚 Lesson items</h2>'+(items.length?items.map(x=>'<div class="panel" style="margin:7px 0"><b>'+esc(x.title)+'</b> <span class="badge">'+esc(x.category)+'</span>'+(reqText(x).length?'<div class="muted" style="margin-top:6px">'+reqText(x).map(esc).join(' · ')+'</div>':'')+'</div>').join(''):'<div class="empty">No lesson items found. Go back and select an item first.</div>');
 const tc=document.getElementById('tasks');
 if(!tasks.length){tc.innerHTML='<h2 style="margin:0 0 8px">📝 Homework plan</h2><div class="empty">Press <b>Create Homework with AI</b> to build the plan.</div>'}else{tc.innerHTML='<h2 style="margin:0 0 8px">📝 This week\'s plan</h2>'+tasks.map((x,i)=>'<div class="task"><div class="task-head"><div><span class="badge">'+esc(x.category)+'</span><div class="task-title" style="margin-top:6px">'+(i+1)+'. '+esc(x.title)+'</div></div><label><input class="minutes" type="number" min="3" max="60" value="'+Number(x.minutes||5)+'" data-i="'+i+'"> min</label></div><textarea data-focus="'+i+'">'+esc(x.focus||'')+'</textarea></div>').join('');tc.querySelectorAll('.minutes').forEach(el=>el.onchange=()=>{tasks[+el.dataset.i].minutes=Math.max(3,Math.min(60,+el.value||5));refreshMessages()});tc.querySelectorAll('textarea').forEach(el=>el.onchange=()=>{tasks[+el.dataset.focus].focus=el.value;refreshMessages()})}
 document.getElementById('parent').innerHTML='<h2 style="margin:0 0 8px">👨‍👩‍👧 Parent support</h2><div class="message">'+esc(parentMessage())+'</div>';
 document.getElementById('viber').innerHTML='<h2 style="margin:0 0 8px">💜 Viber message</h2><div class="message">'+esc(viberMessage())+'</div><div class="muted" style="margin-top:8px">The page prepares the message. Automatic Viber delivery requires a secure server/Bot connection; the Viber token must never be stored in this GitHub Pages app.</div>';
}
function refreshMessages(){
 const p=document.querySelector('#parent .message'),v=document.querySelector('#viber .message');if(p)p.textContent=parentMessage();if(v)v.textContent=viberMessage();
}
document.getElementById('generate').onclick=aiDesign;
document.getElementById('save').onclick=()=>{let db=read('VIOLIN_AI_HOMEWORK_V1',{});db[studentId]={...(homework||{}),studentId,studentName:name,level,term,tasks,updatedAt:new Date().toISOString()};write('VIOLIN_AI_HOMEWORK_V1',db);alert('Homework saved.')};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(viberMessage());alert('Viber message copied. Open Viber and paste it.')}catch(e){alert(viberMessage())}};
document.getElementById('clear').onclick=()=>{if(!confirm('Clear this homework?'))return;let db=read('VIOLIN_AI_HOMEWORK_V1',{});delete db[studentId];write('VIOLIN_AI_HOMEWORK_V1',db);tasks=[];homework=null;render()};
render();
})();
</script>
</body>
</html>
