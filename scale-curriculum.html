<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — Scale & Arpeggio Curriculum</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c;margin:0}.top{background:#14233d;color:#fff;padding:16px 20px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:800;margin:2px}.section{border:1px solid #e6e9ef;border-radius:12px;padding:12px}.skill{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:7px 0}.skill input{width:70px;padding:7px}.small{font-size:13px;color:#667085}.btn{border:0;border-radius:10px;padding:10px 13px;background:#7451d9;color:#fff;font-weight:800;cursor:pointer}</style></head><body><div class="top">VIOLIN <span style="color:#e6c25f">AI</span> · Scale & Arpeggio Curriculum</div><main class="wrap"><div class="card"><h2>🎵 Scale & Arpeggio Curriculum</h2><p class="small">Teacher-facing curriculum · Levels 1–9 · 18 Terms</p><label>Student <select id="student"></select></label> <label>Term <select id="term"><option value="1">Term 1</option><option value="2">Term 2</option></select></label> <button class="btn" onclick="show()">Open Curriculum</button></div><div id="out"></div></main><script src="curriculum/scale-arpeggio-v1.js"></script><script>const KEY='VIOLIN_AI_AGENDA_V10';let data={students:[]};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}data.students??=[];const sel=document.getElementById('student');data.students.forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.name+' · Level '+s.level;sel.appendChild(o)});function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(x){if(x==null)return '';if(Array.isArray(x))return x.map(fmt).join(', ');if(typeof x==='object')return Object.entries(x).map(([k,v])=>'<b>'+esc(k)+':</b> '+fmt(v)).join('<br>');return esc(x)}function show(){let s=data.students.find(x=>x.id===sel.value);if(!s)return out.innerHTML='<div class="card">No students found in local data.</div>';let term=+document.getElementById('term').value,c=window.VIOLIN_SCALE_CURRICULUM_V1.getTerm(+s.level,term);if(!c)return out.innerHTML='<div class="card">Curriculum not available for this Level/Term.</div>';out.innerHTML='<div class="card"><span class="pill">'+esc(s.name)+'</span><span class="pill">Level '+s.level+'</span><span class="pill">Term '+term+'</span><div class="grid" style="margin-top:12px">'+Object.entries(c).map(([k,v])=>'<div class="section"><b>'+esc(k)+'</b><div class="small" style="margin-top:6px">'+fmt(v)+'</div></div>').join('')+'</div></div><div class="card"><h3>Scale Mastery Matrix</h3>'+['Intonation','Rhythm','Bow control','Tone','Coordination','Shifting','Relaxation','Speed','Articulation','Memory'].map(x=>'<div class="skill"><span>'+x+'</span><input type="number" min="1" max="5" placeholder="/5"></div>').join('')+'</div>'}if(sel.options.length)show()</script></body></html>
