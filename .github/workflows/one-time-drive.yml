name: Configure Google Drive client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Drive client ID
        env:
          CLIENT_ID: '239503689250-a6ut85vcf224ril3s81r7926sv435hfp.apps.googleusercontent.com'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "const DRIVE_KEY='VIOLIN_AI_DRIVE_CLIENT_ID';"
          client = "const DRIVE_CLIENT_ID='239503689250-a6ut85vcf224ril3s81r7926sv435hfp.apps.googleusercontent.com';"
          if 'const DRIVE_CLIENT_ID=' not in s:
              s = s.replace(marker, marker + "\n" + client, 1)
          s = s.replace("let cid=localStorage.getItem(DRIVE_KEY)||'';", "let cid=localStorage.getItem(DRIVE_KEY)||DRIVE_CLIENT_ID;")
          s = s.replace("let cid=localStorage.getItem(DRIVE_KEY);if(!cid)return driveSetup();", "let cid=localStorage.getItem(DRIVE_KEY)||DRIVE_CLIENT_ID;if(!cid)return driveSetup();")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-drive.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-drive.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Connect Teacher Agenda to Google Drive client'
          git push