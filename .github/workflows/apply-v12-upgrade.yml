name: Apply V12 Agenda Upgrade

on:
  push:
    paths:
      - 'agenda-v12-upgrade.trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply upgrade
        run: python3 tools/patch_v12.py
      - name: Commit upgraded agenda
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: V12 student colours assessment and AI suggestions [skip ci]'
          git push
