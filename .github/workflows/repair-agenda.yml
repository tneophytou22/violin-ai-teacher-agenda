name: Repair agenda safely
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known V12 and fix JavaScript
        run: |
          git checkout 4f50cb954dbbf9a34bcd351391f1d44d4c0851bb -- index.html manifest.json sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="assessments:{}}};data.students.push(s)"
          new="assessments:{}};data.students.push(s)"
          if old not in s:
              raise SystemExit('Expected syntax-error pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/repair-agenda.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js .github/workflows/repair-agenda.yml
          git commit -m "Restore working V12 agenda and fix syntax error"
          git push
