name: V15 Tests

on:
  push:
    branches:
      - v15-*
      - main
  pull_request:
    branches:
      - main
      - v15-*

jobs:
  test-v15:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V15 tests
        run: npm test
