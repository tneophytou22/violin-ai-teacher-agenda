name: V15 Browser Demo

on:
  push:
    branches:
      - v15-tktl-mvp
    paths:
      - 'v15/**'
      - '.github/workflows/v15-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload V15 demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: './v15'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
