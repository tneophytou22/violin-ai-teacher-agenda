name: Build V12

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate V12 files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          echo "V12 validation passed"
          echo "index.html: $(wc -c < index.html) bytes"
          echo "manifest.json: $(wc -c < manifest.json) bytes"
          echo "sw.js: $(wc -c < sw.js) bytes"

      - name: Verify V12 marker
        run: |
          if grep -q "VIOLIN_AI_V12" index.html; then
            echo "V12 marker found"
          else
            echo "V12 marker not found — keeping this as a validation-only build"
          fi
