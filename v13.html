<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIOLIN AI — V13 Development</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#24344c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.devbar{position:fixed;right:12px;top:12px;z-index:20;background:#14233d;color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;box-shadow:0 6px 20px #0003}.devbar button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.panel{display:none;position:fixed;z-index:30;right:12px;top:58px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 72px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 15px 50px #0005;padding:16px}.panel.open{display:block}.student{border:1px solid #e6e9ef;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}.student:hover{background:#f5f7fb}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:700;margin:2px}.section{border-top:1px solid #eee;padding:10px 0}.score{display:grid;grid-template-columns:1fr 70px;gap:7px;align-items:center;margin:5px 0}.score input{width:55px;padding:7px}.close{float:right}</style></head><body><iframe src="index.html" title="VIOLIN AI Teacher Agenda"></iframe><div class="devbar"><button id="open">Scale Curriculum</button></div><div id="panel" class="panel"><button id="close" class="close">✕</button><h2>Scale &amp; Arpeggio Curriculum</h2><p id="status">Development integration — legacy Agenda remains untouched.</p><div id="students"></div><div id="curriculum"></div></div><script src="curriculum/scale-arpeggio-v1.js"></script><script src="js/scale-mastery.js"></script><script src="js/scale-curriculum-service.js"></script><script src="js/scale-curriculum-panel.js"></script><script>(function(){var p=document.getElementById('panel'),s=document.getElementById('students'),c=document.getElementById('curriculum');document.getElementById('open').onclick=function(){p.classList.add('open');renderStudents()};document.getElementById('close').onclick=function(){p.classList.remove('open')};function read(){try{return JSON.parse(localStorage.getItem('VIOLIN_AI_AGENDA_V10'))}catch(e){return null}}function list(data){if(Array.isArray(data))return data;for(var k in (data||{})){if(Array.isArray(data[k]))return data[k]}return []}function renderStudents(){var a=list(read());s.innerHTML=a.length?'':'<div>No students found in the current browser storage.</div>';a.forEach(function(st,i){var d=document.createElement('div');d.className='student';d.innerHTML='<strong>'+(st.name||st.studentName||('Student '+(i+1)))+'</strong><br><span class="pill">Level '+(st.level||st.currentLevel||'—')+'</span><span class="pill">Term '+(st.term||st.currentTerm||'1')+'</span>';d.onclick=function(){render(st)};s.appendChild(d)})}function text(v){if(v==null)return '';if(Array.isArray(v))return v.join(', ');if(typeof v==='object')return Object.keys(v).map(function(k){return k+': '+text(v[k])}).join(' · ');return String(v)}function render(st){var link=window.ViolinScaleCurriculumService.getForStudent(st);if(!link||!link.curriculum){c.innerHTML='<div class="section">This student has no valid Level 1–9 / Term 1–2 mapping yet.</div>';return}var x=window.ViolinScaleCurriculumPanel.build(st),html='<h3>Level '+x.level+' · Term '+x.term+'</h3>';x.sections.forEach(function(row){html+='<div class="section"><strong>'+row[0]+'</strong><div>'+text(row[1])+'</div></div>'});html+='<div class="section"><h3>Scale Mastery Matrix /5</h3>';window.ViolinScaleMastery.skills.forEach(function(k){html+='<div class="score"><span>'+k+'</span><input type="number" min="1" max="5" step="1" placeholder="—"></div>'});html+='</div>';c.innerHTML=html} })();</script></body></html>
