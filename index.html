function setCategoryAssessment(sid,category,value){let s=data.students.find(x=>x.id===sid);if(!s)return;s.assessments??={};let n=Math.max(0,Math.min(20,+value||0));s.assessments['category:'+category]=n;save()}
function getCategoryScore(s,category){let v=s.assessments?.['category:'+category];return Number.isFinite(+v)&&+v>0?+v:null}
function getItemScore(s,x){let v=s.assessments?.[x.category+':'+x.id];return Number.isFinite(+v)&&+v>0?+v:null}
function aiProfile(s){
  let items=data.repertoire.filter(x=>x.studentId===s.id).map(x=>({x,score:getItemScore(s,x)})).filter(o=>o.score!==null);
  let cats=['Technique','Intonation','Rhythm','Bow Control','Musicality','Repertoire','Scales & Études','Practice / Preparation'].map(k=>({k,score:getCategoryScore(s,k)})).filter(o=>o.score!==null);
  let weakItems=items.filter(o=>o.score<13).sort((a,b)=>a.score-b.score);
  let strongItems=items.filter(o=>o.score>=17).sort((a,b)=>b.score-a.score);
  let weakCats=cats.filter(o=>o.score<13).sort((a,b)=>a.score-b.score);
  let strongCats=cats.filter(o=>o.score>=17).sort((a,b)=>b.score-a.score);
  return {items,cats,weakItems,strongItems,weakCats,strongCats};
}
function generateAIPlanner(sid){
  let s=data.students.find(x=>x.id===sid);if(!s)return;
  let prof=aiProfile(s), items=data.repertoire.filter(x=>x.studentId===sid), c=curriculum[s.level]||{s:[],e:[],t:[],p:[]};
  let plan=[]; const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
  const add=(title,category,minutes,sourceId=null,reason='')=>plan.push({id:uid(),sourceId,title,category,minutes:Math.max(3,Math.round(minutes)),done:false,aiReason:reason});
  const weakTechnique=prof.weakCats.find(x=>['Technique','Bow Control'].includes(x.k));
  const weakIntonation=prof.weakCats.find(x=>x.k==='Intonation');
  const weakRhythm=prof.weakCats.find(x=>x.k==='Rhythm');
  const warm=automaticWarmup(s.level);
  add(warm[0],'Warm Up',7,null,'Activation adapted to level');
  if(weakTechnique||weakIntonation) add(warm[1],'Warm Up',6,null,'Targets the weakest technical area'); else add(warm[1],'Warm Up',5,null,'Level-appropriate activation');
  let scales=items.filter(x=>x.category==='Scales');let etudes=items.filter(x=>x.category==='Études');let tech=items.filter(x=>x.category==='Technical Studies');let pieces=items.filter(x=>x.category==='Pieces');
  const ordered=(arr)=>[...arr].sort((a,b)=>(getItemScore(s,a)??15)-(getItemScore(s,b)??15));
  ordered(scales).slice(0,2).forEach(x=>add(x.title,'Scales',weakIntonation?12:10,x.id,`Current score: ${getItemScore(s,x)??'not rated'}/20`));
  if(!scales.length)add(c.s[0]||'Level scale work','Scales',10,null,'Level curriculum suggestion');
  ordered(tech).slice(0,2).forEach(x=>add(x.title,'Technique',weakTechnique?13:10,x.id,`Current score: ${getItemScore(s,x)??'not rated'}/20`));
  if(!tech.length) c.t.slice(0,2).forEach(x=>add(x,'Technique Focus',8,null,'Automatic level technique')); 
  ordered(etudes).slice(0,2).forEach(x=>add(x.title,'Études',weakRhythm?18:15,x.id,`Current score: ${getItemScore(s,x)??'not rated'}/20`));
  if(!etudes.length)add(c.e[0]||'Level étude work','Études',15,null,'Level curriculum suggestion');
  ordered(pieces).slice(0,3).forEach(x=>add(x.title,'Repertoire',12+(getItemScore(s,x)!==null&&getItemScore(s,x)<13?8:0),x.id,`Current score: ${getItemScore(s,x)??'not rated'}/20`));
  if(!pieces.length)add(c.p[0]||'Level repertoire work','Repertoire',18,null,'Level curriculum suggestion');
  let target=practiceTarget(s),sum=plan.reduce((a,x)=>a+x.minutes,0);
  while(sum>target&&plan.length>3){let idx=plan.findIndex(x=>x.minutes>8&&x.category!=='Warm Up');if(idx<0)break;plan[idx].minutes-=3;sum-=3}
  while(sum<target){let m=Math.min(5,target-sum);add(weakRhythm?'Rhythm review / clapping and subdivision':'Review weakest point from the lesson','AI Review',m,null,'Generated from lesson assessment');sum+=m}
  s.daily??={};s.daily[todayKey()]=plan;save();state.sid=sid;state.page='student';render();
}
function showAISuggestions(sid){
  let s=data.students.find(x=>x.id===sid);if(!s)return;let p=aiProfile(s),c=curriculum[s.level]||{s:[],e:[],t:[],p:[]};
  let lines=[];
  lines.push(`🤖 VIOLIN AI — ${s.name} · Level ${s.level}`,'');
  if(p.weakCats.length)lines.push('🎯 PRIORITY AREAS',...p.weakCats.slice(0,4).map(x=>`• ${x.k}: ${x.score}/20`),'');
  if(p.weakItems.length)lines.push('🔧 ITEMS TO REVISIT',...p.weakItems.slice(0,4).map(x=>`• ${x.x.title}: ${x.score}/20`),'');
  lines.push('✨ LEVEL-APPROPRIATE SUGGESTIONS',`• Technique: ${c.t.slice(0,2).join(' · ')}`,`• Scales: ${c.s.slice(0,2).join(' · ')}`,`• Étude: ${c.e.slice(0,1).join(' · ')}`,`• Repertoire: ${c.p.slice(0,2).join(' · ')}`,'');
  if(p.strongCats.length)lines.push('💪 KEEP DEVELOPING',...p.strongCats.slice(0,3).map(x=>`• ${x.k}: ${x.score}/20`),'');
  lines.push(`⏱ Home-practice target: ${practiceTarget(s)}+ min`,'','Το επόμενο Daily Planner μπορεί να δημιουργηθεί αυτόματα με βάση αυτά τα δεδομένα.');
  alert(lines.join('\n'));
}

Advanced arpeggios','Chromatic'],e:['Dont Op.35','Wieniawski — selected','Paganini — selected'],t:['Advanced position system','Virtuoso spiccato','Flying staccato','Left-hand pizzicato']},10:{p:['Bach — advanced Sonata/Partita','Ravel — Tzigane','Beethoven — Violin Sonata','Paganini — Caprices'],s:['Full 3-octave major/minor cycle','Advanced arpeggios','Full-range chromatic'],e:['Paganini Caprices','Wieniawski','Dont Op.35 — advanced'],t:['Integrated virtuoso technique','Advanced bow distribution','High-position intonation','Rapid string crossing']}};

function addNote(id){let s=data.students.find(x=>x.id===id),n=prompt('Teacher notes:',s.notes||'');if(n!==null){s.notes=n;save();student()}}
function editStudent(id){let s=data.students.find(x=>x.id===id);if(!s)return;let n=prompt('Student name:',s.name);if(n!==null&&n.trim())s.name=n.trim();let l=prompt('Level 1–10:',s.level);if(l!==null&&+l>=1&&+l<=10)s.level=+l;let v=prompt('Viber number:',s.viber||'');if(v!==null)s.viber=v.trim();let type=prompt('Type: Μουσικό Σχολείο or Private:',s.type||'Μουσικό Σχολείο');if(type!==null&&(type==='Private'||type==='Μουσικό Σχολείο')){s.type=type;s.lessonDuration=type==='Private'?30:40}save();student()}
function aiQuarterlySuggestion(s){let a=s.assessments||{};let vals=Object.entries(a).map(([k,v])=>({k,v:+v})).filter(x=>Number.isFinite(x.v));let fallback=['Technique','Intonation','Rhythm','Bow Control','Musicality','Repertoire','Scales & Études','Practice / Preparation'];let scores=fallback.map(k=>({k,v:vals.find(x=>x.k===k)?.v??14}));let low=[...scores].sort((a,b)=>a.v-b.v).slice(0,3);let high=[...scores].sort((a,b)=>b.v-a.v).slice(0,4);return {strengths:high.map(x=>`${x.k} (${x.v}/20)`),focus:low.map(x=>`${x.k} (${x.v}/20)`),next:`Στο επόμενο τρίμηνο θα συνεχίσουμε να ενισχύουμε ${low.map(x=>x.k).join(', ')} με στοχευμένη καθημερινή μελέτη, ενώ θα διατηρήσουμε την καλή δουλειά στα ${high.map(x=>x.k).join(', ')}.`}}
function openQuarterlyReport(id){let s=data.students.find(x=>x.id===id);if(!s)return;let last=(s.quarterlyReports||[]).slice(-1)[0]||{};let term=prompt('Quarter / Term (e.g. 1st Term):',last.term||'');if(term===null)return;let ai=aiQuarterlySuggestion(s);let overall=prompt('Overall grade — enter 0 to 20:',last.overall??'');if(overall===null)return;overall=Math.max(0,Math.min(20,+overall||0));let categories=['Technique','Intonation','Rhythm','Bow Control','Musicality','Repertoire','Scales & Études','Practice / Preparation'];let grades={};for(let c of categories){let current=last.grades?.[c]??s.assessments?.[c]??14;let g=prompt(c+' grade (0–20):',current);if(g===null)return;grades[c]=Math.max(0,Math.min(20,+g||0))}let strengths=prompt('3–4 points of progress (encouraging and positive):',last.strengths?.join('\n')||ai.strengths.map(x=>'• '+x).join('\n'));if(strengths===null)return;let focus=prompt('3–4 points to pay attention to:',last.focus?.join('\n')||ai.focus.map(x=>'• '+x).join('\n'));if(focus===null)return;let goals=prompt('What we plan for the next term:',last.goals||ai.next);if(goals===null)return;let summary=prompt('Short polite teacher message to the student / parent:',last.summary||`Θερμά συγχαρητήρια για την προσπάθεια αυτού του τριμήνου. Υπάρχει σαφής πρόοδος και με σταθερή, ποιοτική μελέτη μπορούμε να κάνουμε το επόμενο βήμα με ακόμη μεγαλύτερη αυτοπεποίθηση.`);if(summary===null)return;s.quarterlyReports??=[];s.quarterlyReports.push({date:new Date().toLocaleDateString(),term,overall,grades,strengths:strengths.split(/\n+/).map(x=>x.trim()).filter(Boolean),focus:focus.split(/\n+/).map(x=>x.trim()).filter(Boolean),summary,goals});save();student()}
function exportQuarterlyReport(id){let s=data.students.find(x=>x.id===id),r=(s?.quarterlyReports||[]).slice(-1)[0];if(!r)return alert('No quarterly report yet.');let text=`VIOLIN AI — QUARTERLY PROGRESS PROTOCOL\n\nStudent: ${s.name}\nLevel: ${s.level}\nSchool: ${s.type}\nTerm: ${r.term}\nOverall grade: ${r.overall}/20\nDate: ${r.date}\n\nASSESSMENT /20\n`+Object.entries(r.grades||{}).map(([k,v])=>`${k}: ${v}/20`).join('\n')+`\n\nPOINTS OF PROGRESS\n${(r.strengths||[]).join('\n')}\n\nPOINTS TO PAY ATTENTION TO\n${(r.focus||[]).join('\n')}\n\nTEACHER MESSAGE\n${r.summary}\n\nNEXT TERM GOALS\n${r.goals||''}`;let b=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${s.name}_Quarterly_Progress_${r.term.replace(/\s+/g,'_')}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function timetable(){shell(`<div class="title"><h2>🗓 Timetable</h2><button class="btn mint" onclick="addLesson()">＋ Add Lesson</button></div><div class="week">${days.map(d=>`<div class="day"><b>${d}</b>${(data.timetable[d]||[]).map((x,i)=>`<div class="lesson"><b>${x.time||'—'}</b><br>${esc(x.student)}<br><button class="btn ghost" onclick="removeLesson('${d}',${i})">✕</button></div>`).join('')||'<div class="empty">Free</div>'}</div>`).join('')}</div>`)}
function addLesson(){let d=prompt('Day:','Monday'),n=prompt('Student:',''),t=prompt('Time:','');if(!d||!days.includes(d)||n===null||t===null)return;data.timetable[d]??=[];data.timetable[d].push({student:n,time:t});save();timetable()}function removeLesson(d,i){data.timetable[d].splice(i,1);save();timetable()}
function tech(){shell(`<section class="hero"><h1>🧩 Technique & Curriculum</h1><p>Levels 1–10 starter planning map. Use the student workspace to assign items to a specific student.</p></section><div class="levels">${Array.from({length:10},(_,i)=>`<button class="level" onclick="level(${i+1})">🎻<br>Level ${i+1}<br><small>${curriculum[i+1].t.length} technique areas</small></button>`).join('')}</div>`)}
function level(n){let c=curriculum[n];shell(`<div class="title"><h2>Level ${n}</h2><button class="btn ghost" onclick="nav('tech')">← Levels</button></div><div class="grid"><div class="card"><h3>🎼 Pieces</h3>${c.p.map(x=>`<div class="repcard">${esc(x)}</div>`).join('')}</div><div class="card"><h3>🎵 Scales</h3>${c.s.map(x=>`<div class="repcard mintbg">${esc(x)}</div>`).join('')}</div><div class="card"><h3>📚 Études</h3>${c.e.map(x=>`<div class="repcard peachbg">${esc(x)}</div>`).join('')}</div><div class="card"><h3>🧩 Techniques</h3>${c.t.map(x=>`<div class="repcard skybg"><b>${esc(x)}</b></div>`).join('')}</div></div>`)}
function rep(){shell(`<div class="title"><h2>🎼 Repertoire Library</h2><button class="btn mint" onclick="addRep(state.tab)">＋ Add ${state.tab}</button></div><div class="notice">This is the shared library. To assign something to a student, open that student first and add it from their own tab. Student entries stay with that student.</div><div class="tabs">${cats.map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`).join('')}</div>${data.repertoire.filter(x=>x.category===state.tab&&!x.studentId).map(x=>`<div class="card"><span class="pill">${x.category}</span><h3>${esc(x.title)}</h3><p>${esc(x.composer||'')}</p><button class="btn danger" onclick="delRep('${x.id}')">Delete</button></div>`).join('')||'<div class="card empty">No shared library entries. Student-specific entries are kept inside each student.</div>'}`)}
function addRep(cat){let title=prompt(cat==='Scales'?'Scale:':cat==='Études'?'Étude:':cat==='Technical Studies'?'Technical study:':'Piece:');if(!title)return;let composer=prompt('Composer / Source:','');data.repertoire.push({id:crypto.randomUUID?.()||String(Date.now()),category:cat,title,composer,studentId:null,progress:0});save();rep()}function delRep(id){data.repertoire=data.repertoire.filter(x=>x.id!==id);save();rep()}
function hw(){shell(`<div class="title"><h2>🏠 Homework</h2><button class="btn mint" onclick="newHW()">＋ New Homework</button></div><div class="grid">${data.homework.map(x=>`<div class="card"><span class="pill">${esc(x.student||'General')}</span><p>${esc(x.text)}</p><button class="btn viber" onclick="sendViber('${x.id}')">💬 Send to Viber</button></div>`).join('')||'<div class="card empty">No homework yet.</div>'}</div>`)}
function backup(){let b=new Blob([JSON.stringify({version:12,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='VIOLIN_AI_Teacher_Agenda_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||x;save();alert('Backup restored.');render()}catch(e){alert('Invalid backup.')}};r.readAsText(i.files[0])};i.click()}
function driveSetup(){let old=localStorage.getItem(DRIVE_KEY)||'';let cid=prompt('Google OAuth Web Client ID\n\nCreate a Web application OAuth client in Google Cloud, add this app URL as an Authorized JavaScript origin, then paste the Client ID here. Example ends with .apps.googleusercontent.com',old);if(cid===null)return;if(cid.trim()){localStorage.setItem(DRIVE_KEY,cid.trim());alert('Client ID saved on this device. Open the app from your HTTPS URL before connecting.')}else localStorage.removeItem(DRIVE_KEY);render()}
function loadGIS(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();let s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function getDriveToken(){let cid=localStorage.getItem(DRIVE_KEY)||DRIVE_CLIENT_ID;if(!cid)return driveSetup();await loadGIS();return new Promise((resolve,reject)=>{let client=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)reject(r);else{state.driveToken=r.access_token;resolve(r.access_token)}}});client.requestAccessToken({prompt:''})})}
async function driveFetch(url,opts={}){opts.headers=Object.assign({'Authorization':'Bearer '+state.driveToken},opts.headers||{});let r=await fetch(url,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
async function findDriveFile(){let q=encodeURIComponent("name='VIOLIN_AI_Agenda_Backup.json' and trashed=false");let j=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name,modifiedTime)');return j.files?.[0]||null}
async function saveDrive(){try{let token=await getDriveToken();if(!token)return;let file=await findDriveFile();let body=JSON.stringify({version:12,savedAt:new Date().toISOString(),data});let boundary='violin_ai_'+Date.now();let meta={name:'VIOLIN_AI_Agenda_Backup.json',mimeType:'application/json'};let payload='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';let url=file?'https://www.googleapis.com/upload/drive/v3/files/'+file.id+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';let r=await fetch(url,{method:file?'PATCH':'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body:payload});if(!r.ok)throw new Error(await r.text());let out=await r.json();localStorage.setItem(DRIVE_FILE_KEY,out.id||file?.id||'');alert('☁️ Saved to Google Drive successfully.')}catch(e){console.error(e);alert('Google Drive save failed. Check the OAuth Client ID, Authorized JavaScript origin and that the app is running from HTTPS.')}}
async function restoreDrive(){try{let token=await getDriveToken();if(!token)return;let file=await findDriveFile();if(!file)return alert('No VIOLIN_AI_Agenda_Backup.json was found in this Google Drive.');let r=await fetch('https://www.googleapis.com/drive/v3/files/'+file.id+'?alt=media',{headers:{'Authorization':'Bearer '+token}});if(!r.ok)throw new Error(await r.text());let x=await r.json();if(!x.data)return alert('The Drive backup is not a valid VIOLIN AI backup.');if(!confirm('Restore the Google Drive backup? Your current local data will be replaced.'))return;data=x.data;save();alert('☁️ Google Drive backup restored.');render()}catch(e){console.error(e);alert('Google Drive restore failed. Check your OAuth setup and HTTPS origin.')}}
function quick(){let x=prompt('Quick add: student / homework / piece / scale','homework');if(!x)return;x=x.toLowerCase();if(x.includes('student'))newStudent();else if(x.includes('piece')){state.page='rep';state.tab='Pieces';rep()}else if(x.includes('scale')){state.page='rep';state.tab='Scales';rep()}else newHW()}
render();</script></body></html>
