<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15243d"><link rel="manifest" href="manifest.json"><title>VIOLIN AI · Teacher Agenda</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#20314b}header{background:#15243d;color:#fff;padding:16px;position:sticky;top:0}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,#15243d,#496b92);color:#fff;padding:24px;border-radius:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e9ef;border-radius:17px;padding:16px;box-shadow:0 5px 18px #15243d12}button{border:0;border-radius:10px;padding:10px 13px;margin:3px;font-weight:700;cursor:pointer}.primary{background:#7451d9;color:#fff}.ok{background:#54b98d;color:#fff}.danger{background:#df6873;color:#fff}.pill{background:#edf1f6;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#eceff4}.tabs .active{background:#7451d9;color:white}.item{padding:10px;border:1px solid #e6e9ef;border-radius:12px;margin:7px 0}input,textarea{width:100%;padding:10px;border:1px solid #d5dbe5;border-radius:10px;box-sizing:border-box;font:inherit}small{color:#748096}</style></head><body><header><b onclick="home()" style="cursor:pointer">🎻 VIOLIN AI · Teacher Agenda</b></header><main id="app" class="wrap"></main><script>const K='VAI_AGENDA_V11',C={1:['Posture & setup','Open strings','Basic frame'],2:['Finger patterns','String crossing','Simple slurs'],3:['2-octave scales','Slurs','Position preparation'],4:['1st–3rd position','Shifting','Martelé'],5:['3rd position','Shifting','Spiccato'],6:['Advanced shifting','Spiccato','Double stops'],7:['High positions','String crossing','Advanced spiccato'],8:['Virtuoso bow control','Advanced shifting','Chord work'],9:['Flying staccato','Left-hand pizzicato','High-position intonation'],10:['Integrated virtuoso technique','Advanced bow distribution','Rapid string crossing']};let D=JSON.parse(localStorage.getItem(K)||'{"students":[]}'),sid=null,tab='Pieces';function save(){localStorage.setItem(K,JSON.stringify(D))}function s(){return D.students.find(x=>x.id===sid)}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function home(){app.innerHTML='<section class="hero"><h1>Teacher Agenda</h1><p>Student-centered lesson, home practice and progress records.</p><button class="primary" onclick="newStudent()">＋ Create Student</button></section><div class="grid" style="margin-top:16px"><div class="card"><h3>👥 Students</h3><b style="font-size:30px">'+D.students.length+'</b></div><div class="card"><h3>☁️ Backup</h3><button class="ok" onclick="backup()">Save Backup</button><button onclick="restore()">Restore</button></div></div>'}function students(){app.innerHTML='<div class="card"><h2>Students</h2><button class="primary" onclick="newStudent()">＋ Create Student</button></div><div class="grid" style="margin-top:14px">'+(D.students.map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><span class="pill">Level '+x.level+'</span> <span class="pill">'+x.type+'</span><p>'+x.days.join(' · ')+'</p><button class="primary" onclick="openS(\''+x.id+'\')">Open</button><button class="danger" onclick="delS(\''+x.id+'\')">Delete</button></div>').join('')||'<div class="card">No students yet.</div>')+'</div>'}function newStudent(){let name=prompt('Student name:');if(!name)return;let type=/private/i.test(prompt('Type: Music School or Private','Music School')||'')?'Private':'Music School',level=Math.max(1,Math.min(10,parseInt(prompt('Level 1–10','1'))||1)),days=(prompt('Choose up to 2 days, e.g. Monday, Thursday','Monday, Thursday')||'Monday').split(',').map(x=>x.trim()).filter(Boolean).slice(0,2);D.students.push({id:Date.now()+'',name,type,level,days,items:{Pieces:[],Scales:[],Études:[],Technique:[]},planner:[],homework:[],reports:[]});save();openS(D.students.at(-1).id)}function delS(id){if(confirm('Delete this student and all their data?')){D.students=D.students.filter(x=>x.id!==id);save();students()}}function openS(id){sid=id;tab='Pieces';student()}function student(){let x=s(),cats=['Pieces','Scales','Études','Technique'];if(!x)return students();app.innerHTML='<div class="card"><h2>🎻 '+esc(x.name)+'</h2><span class="pill">Level '+x.level+'</span> <span class="pill">'+x.type+' · '+(x.type==='Private'?30:40)+' min lesson</span><p>Lessons: '+x.days.join(' & ')+'</p><button class="primary" onclick="generate()">✨ Generate Daily Planner</button><button onclick="generate()">↻ Regenerate Plan for Today</button></div><div class="tabs">'+cats.map(c=>'<button class="'+(tab===c?'active':'')+'" onclick="tab=\''+c+'\';student()">'+c+'</button>').join('')+'<button class="'+(tab==='Homework'?'active':'')+'" onclick="tab=\'Homework\';student()">🏠 Homework</button><button class="'+(tab==='Progress'?'active':'')+'" onclick="tab=\'Progress\';student()">📋 Progress</button></div><div class="grid"><div class="card"><h3>'+tab+'</h3>'+content(x)+'</div><div class="card"><h3>📅 Today’s Home Practice</h3>'+x.planner.map((p,i)=>'<div class="item"><input type="checkbox" '+(p.done?'checked':'')+' onchange="done('+i+',this.checked)"> '+esc(p.title)+' <b>'+p.min+'′</b></div>').join('')+'<p><b>Total: '+x.planner.reduce((a,p)=>a+Number(p.min),0)+' min</b></p></div></div>'}function content(x){if(tab==='Homework')return '<textarea id="hw" rows="5" placeholder="Homework for parent/student..."></textarea><button class="primary" onclick="voice()">🎙️ Speak</button><button class="ok" onclick="saveHW()">Save</button>'+x.homework.map((h,i)=>'<div class="item">'+esc(h)+'<br><button onclick="send('+i+')">💬 Send message</button></div>').join('');if(tab==='Progress')return '<button class="primary" onclick="report()">＋ Quarterly Progress</button>'+x.reports.map(r=>'<div class="item"><b>'+esc(r.term)+'</b><br>'+esc(r.text)+'</div>').join('');return '<button class="primary" onclick="add()">＋ Add '+tab+'</button>'+x.items[tab].map((v,i)=>'<div class="item">'+esc(v)+' <button onclick="today('+i+')">＋ Today</button><button class="danger" onclick="remove('+i+')">Delete</button></div>').join('')||'<small>No entries yet.</small>'}function add(){let v=prompt('Enter '+tab+':');if(v){s().items[tab].push(v);save();student()}}function remove(i){s().items[tab].splice(i,1);save();student()}function today(i){let m=Number(prompt('Home practice minutes:','10'))||10;s().planner.push({title:s().items[tab][i],min:m,done:false});save();student()}function done(i,v){s().planner[i].done=v;save()}function generate(){let x=s(),c=C[x.level],p=[{title:'Warm-up · Level '+x.level,min:x.level<4?8:10},{title:'Technique · '+c[0],min:10}];x.items.Scales.slice(0,2).forEach(v=>p.push({title:'Scale · '+v,min:10}));x.items.Études.slice(0,1).forEach(v=>p.push({title:'Étude · '+v,min:15}));x.items.Pieces.slice(0,2).forEach(v=>p.push({title:'Repertoire · '+v,min:20}));let target=x.level<=2?30:x.level<=4?45:x.level<=6?60:x.level<=8?90:120;while(p.reduce((a,v)=>a+v.min,0)>target)p.pop();while(p.reduce((a,v)=>a+v.min,0)<target)p.push({title:'Focused practice · '+c[1],min:Math.min(10,target-p.reduce((a,v)=>a+v.min,0))});x.planner=p.filter(v=>v.min>0).map(v=>({...v,done:false}));save();student()}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input is not available here. Please use Chrome on Android.');let r=new R();r.lang='el-GR';r.interimResults=false;r.continuous=true;r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';document.getElementById('hw').value+=t};r.onerror=e=>alert('Voice input error: '+e.error);r.start()}function saveHW(){let v=document.getElementById('hw').value.trim();if(v){s().homework.push(v);save();student()}}function send(i){let text='🎻 VIOLIN AI — HOME PRACTICE\n\nStudent: '+s().name+'\nLevel: '+s().level+'\n\n'+s().homework[i];location.href='viber://forward?text='+encodeURIComponent(text)}function report(){let term=prompt('Term:','1st Term');if(term===null)return;let text=prompt('3–4 progress points, 3–4 points to improve, and next-term goals:','🌟 Progress\n• \n• \n• \n\n🎯 To focus on\n• \n• \n• \n\n🚀 Next term\n• \n• ');if(text!==null){s().reports.push({term,text});save();student()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='VIOLIN_AI_Agenda_Backup.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader;r.onload=()=>{try{D=JSON.parse(r.result);save();home()}catch(e){alert('Invalid backup')}};r.readAsText(i.files[0])};i.click()}home()</script></body></html>
